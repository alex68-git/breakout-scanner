<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bybit OrderFlow Engine v7.0 GitHub</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; padding: 15px; background: #080a0c; color: #eaecef; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; }
.header { background: #12161c; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #1e2630; }
h1 { font-size: 18px; margin: 0 0 12px 0; color: #f0b90b; display: flex; align-items: center; gap: 8px; }
.controls { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; align-items: center; }
button { border: none; border-radius: 6px; padding: 10px 16px; font-weight: bold; cursor: pointer; background: #f0b90b; color: #000; font-size: 12px; }
button.stop { background: #f6465d; color: white; }
button.clear { background: #2b313a; color: white; }
.status-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
.stat-card { background: #181e25; border-radius: 6px; padding: 8px; text-align: center; border: 1px solid #222c37; font-size: 11px; color: #848e9c; }
.stat-card span { display: block; font-size: 13px; font-weight: bold; margin-top: 2px; color: #eaecef; }
.signals { height: 72vh; overflow-y: auto; }
.card { background: #12161c; border-radius: 8px; padding: 14px; margin-bottom: 10px; border-left: 5px solid #0ecb81; border: 1px solid #1e2630; }
.card.hold { border-left-color: #3b82f6; }
.card.broken { border-left-color: #f6465d; opacity: 0.6; }
.head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.symbol { font-size: 16px; font-weight: bold; }
.badge { font-weight: bold; font-size: 11px; padding: 3px 8px; border-radius: 4px; text-transform: uppercase; background: rgba(14, 203, 129, 0.2); color: #0ecb81; }
.badge.short { background: rgba(246, 70, 93, 0.2); color: #f6465d; }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 10px 0; font-size: 11px; }
.box { background: #181e25; padding: 6px 8px; border-radius: 4px; color: #848e9c; }
.box strong { display: block; color: #eaecef; font-size: 12px; margin-top: 2px; }
.reason { color: #848e9c; font-size: 11px; margin-top: 8px; line-height: 1.4; background: #181e25; padding: 8px; border-radius: 4px; }
.empty { text-align: center; color: #848e9c; padding: 50px; font-size: 13px; }
</style>
</head>
<body>

<div class="header">
    <h1>⚡ OrderFlow Engine v7.0 (GitHub Ready)</h1>
    <div class="controls">
        <button onclick="startEngine()">▶ Запустить Сканер</button>
        <button class="stop" onclick="stopEngine()">⏹ Стоп</button>
        <button class="clear" onclick="clearSignals()">🗑 Очистить</button>
    </div>
    <div class="status-bar">
        <div class="stat-card">Монеты<span id="coinCount">0</span></div>
        <div class="stat-card">WS Потоки<span id="wsStatus" style="color:#f6465d">0/4</span></div>
        <div class="stat-card">Сигналы (ENTRY)<span id="sigCount">0</span></div>
        <div class="stat-card">Всего Кластеров<span id="clusterCount">0</span></div>
    </div>
</div>

<div id="signals" class="signals">
    <div class="empty" id="emptyState">Нажмите "Запустить Сканер" для старта инициализации...</div>
</div>

<script>
let worker = null;
let running = false;
const signals = new Map();
const symbols = [];
const metrics = [];

function money(v) { return Number(v).toLocaleString("en-US", { maximumFractionDigits: 0 }); }
function price(v) { return Number(v) >= 1000 ? Number(v).toFixed(2) : Number(v).toFixed(4); }

async function loadSwings(symbol) {
    try {
        const [r5, r60] = await Promise.all([
            fetch(`https://api.bybit.com/v5/market/kline?category=linear&symbol=${symbol}&interval=5&limit=40`),
            fetch(`https://api.bybit.com/v5/market/kline?category=linear&symbol=${symbol}&interval=60&limit=24`)
        ]);

        const j5 = await r5.json();
        const j60 = await r60.json();
        if (!j5.result?.list) return;

        const k5 = j5.result.list.map(k => ({ h: +k[2], l: +k[3], c: +k[4] })).reverse();
        const highs = [], lows = [];

        for (let i = 2; i < k5.length - 2; i++) {
            if (k5[i].h > k5[i-1].h && k5[i].h > k5[i-2].h && k5[i].h > k5[i+1].h && k5[i].h > k5[i+2].h) highs.push(k5[i].h);
            if (k5[i].l < k5[i-1].l && k5[i].l < k5[i-2].l && k5[i].l < k5[i+1].l && k5[i].l < k5[i+2].l) lows.push(k5[i].l);
        }

        if (worker) {
            worker.postMessage({ type: "SWING", payload: { symbol, data: { highs, lows, k5m: k5 } } });
        }
    } catch(e){}
}

async function startEngine() {
    if (running) return;
    running = true;

    // Подключение через отдельный файл без BLOB
    worker = new Worker('worker.js');

    worker.onmessage = e => {
        const { type, payload } = e.data;
        if (type === "WS") {
            document.getElementById("wsStatus").innerText = payload;
            document.getElementById("wsStatus").style.color = "#0ecb81";
        }
        if (type === "ENTRY") {
            signals.set(payload.key, payload);
            render();
        }
        if (type === "SIGNAL_UPDATE") {
            if (signals.has(payload.key)) {
                const s = signals.get(payload.key);
                s.state = payload.state;
                s.reason = payload.reason;
                render();
            }
        }
    };

    document.getElementById("emptyState").innerText = "Загрузка списка монет и уровней...";

    try {
        const res = await fetch("https://api.bybit.com/v5/market/tickers?category=linear");
        const json = await res.json();

        const exclude = ["BTCUSDT", "ETHUSDT", "SOLUSDT", "XRPUSDT", "DOGEUSDT"];
        const list = json.result.list
            .filter(i => i.symbol.endsWith("USDT"))
            .filter(i => !exclude.includes(i.symbol))
            .sort((a,b) => +b.turnover24h - +a.turnover24h)
            .slice(0, 100);

        symbols.length = 0; metrics.length = 0;
        for (let i = 0; i < list.length; i++) {
            symbols.push(list[i].symbol);
            metrics.push([list[i].symbol, { rank: i + 1, turnover: +list[i].turnover24h }]);
        }

        document.getElementById("coinCount").innerText = symbols.length;

        for (let i = 0; i < symbols.length; i++) {
            await loadSwings(symbols[i]);
            await new Promise(r => setTimeout(r, 60));
        }

        worker.postMessage({ type: "START", payload: { symbols, metrics } });
        document.getElementById("emptyState").innerText = "Мониторинг запущен. Ожидание сигналов...";
    } catch(err) {
        document.getElementById("emptyState").innerText = "Ошибка загрузки данных с Bybit. Проверьте соединение.";
    }
}

function stopEngine() {
    running = false;
    if (worker) { worker.postMessage({ type: "STOP" }); worker.terminate(); worker = null; }
    document.getElementById("wsStatus").innerText = "0/4";
    document.getElementById("wsStatus").style.color = "#f6465d";
}

function clearSignals() {
    signals.clear();
    render();
}

function render() {
    const box = document.getElementById("signals");

    if (signals.size === 0) {
        box.innerHTML = '<div class="empty" id="emptyState">Ожидаем подтвержденный отскок от институционального уровня...</div>';
        document.getElementById("sigCount").innerText = 0;
        document.getElementById("clusterCount").innerText = 0;
        return;
    }

    const arr = [...signals.values()].sort((a,b) => b.cluster - a.cluster).slice(0, 15);
    document.getElementById("sigCount").innerText = arr.filter(s => s.state === 'ENTRY' || s.state === 'HOLD').length;
    document.getElementById("clusterCount").innerText = signals.size;

    box.innerHTML = arr.map(s => `
        <div class="card ${s.state ? s.state.toLowerCase() : ''}">
            <div class="head">
                <div class="symbol">${s.symbol}</div>
                <div class="badge ${s.side === 'SHORT' ? 'short' : ''}">${s.side} [${s.state}]</div>
            </div>
            <div class="grid">
                <div class="box">Кластер<strong>$${money(s.cluster)}</strong></div>
                <div class="box">Цена Входа<strong>${price(s.price)}</strong></div>
                <div class="box">SL<strong>${price(s.sl)}</strong></div>
                <div class="box">TP<strong>${price(s.tp)}</strong></div>
                <div class="box">Удары в Ядро<strong>${s.hits}</strong></div>
                <div class="box">Absorption<strong>$${money(s.abs)}</strong></div>
                <div class="box">Цена Ядра<strong>${price(s.clusterPrice)}</strong></div>
                <div class="box">Тиков<strong>${s.ticks}</strong></div>
            </div>
            <div class="reason">
                <b>Статус: ${s.state}</b><br>
                ${s.reason || "Цена коснулась ядра кластера, прошла проверка на спуфинг, зафиксировано поглощение маркет-ордерами."}
            </div>
        </div>
    `).join("");
}
</script>
</body>
</html>
