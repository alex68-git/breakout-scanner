<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bybit Institutional OrderFlow Engine v6.2 (Fixed Signal Logic)</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; padding: 15px; background: #080a0c; color: #eaecef; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; }
.header { background: #12161c; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #1e2630; }
h1 { font-size: 18px; margin: 0 0 12px 0; color: #f0b90b; display: flex; align-items: center; gap: 8px; }
.controls { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; align-items: center; }
button { border: none; border-radius: 6px; padding: 10px 16px; font-weight: bold; cursor: pointer; background: #f0b90b; color: #000; font-size: 12px; }
button.stop { background: #f6465d; color: white; }
button.clear { background: #2b313a; color: white; }
.status-bar { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 10px; }
.stat-card { background: #181e25; border-radius: 6px; padding: 8px; text-align: center; border: 1px solid #222c37; }
.stat-card span { display: block; font-size: 13px; font-weight: bold; margin-top: 2px; }
.signals { height: 72vh; overflow-y: auto; }
.card { background: #12161c; border-radius: 8px; padding: 14px; margin-bottom: 10px; border-left: 5px solid #2b313a; border: 1px solid #1e2630; transition: all 0.2s ease; }
.card.entry { border-left: 5px solid #0ecb81; box-shadow: 0 0 15px rgba(14, 203, 129, 0.15); }
.card.cancelled { border-left: 5px solid #f6465d; opacity: 0.6; }
.card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.symbol { font-size: 16px; font-weight: bold; }
.badge { font-weight: bold; font-size: 11px; padding: 3px 8px; border-radius: 4px; text-transform: uppercase; }
.badge.entry { background: rgba(14, 203, 129, 0.2); color: #0ecb81; }
.badge.cancelled { background: rgba(246, 70, 93, 0.2); color: #f6465d; }
.badge.cluster { background: rgba(59, 130, 246, 0.2); color: #60a5fa; margin-left: 5px; }
.badge.vol { background: rgba(168, 85, 247, 0.2); color: #c084fc; margin-left: 5px; }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 10px 0; font-size: 11px; }
.box { background: #181e25; padding: 6px 8px; border-radius: 4px; color: #848e9c; }
.box strong { display: block; color: #eaecef; font-size: 12px; margin-top: 2px; }
.empty { text-align: center; color: #848e9c; padding: 50px; font-size: 13px; }
.progress-bar { width: 100%; height: 4px; background: #181e25; border-radius: 2px; overflow: hidden; margin-top: 8px; }
.progress-fill { height: 100%; width: 0%; background: #f0b90b; transition: width 0.1s ease; }
</style>
</head>
<body>

<div class="header">
    <h1>⚡ Bybit Institutional OrderFlow Engine v6.2 (Fixed Logic)</h1>
    <div class="controls">
        <button onclick="startEngine()">▶ Запустить Сканер</button>
        <button class="stop" onclick="stopEngine()">⏹ Стоп</button>
        <button class="clear" onclick="clearCards()">🗑 Очистить</button>
        <label style="font-size: 12px; color: #848e9c; margin-left: 10px;">
            <input type="checkbox" id="soundToggle" checked> 🔔 Звук
        </label>
    </div>
    <div class="status-bar">
        <div class="stat-card">Монеты<span id="coinCount">0</span></div>
        <div class="stat-card">Загрузка REST<span id="loadProgress">0%</span></div>
        <div class="stat-card">WS Потоки (4x)<span id="wsStatus" style="color:#f6465d">0/4</span></div>
        <div class="stat-card">Сигналы (ENTRY)<span id="sigCount">0</span></div>
        <div class="stat-card">Активные Кластеры<span id="clusterCount">0</span></div>
    </div>
    <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
</div>

<div id="signals" class="signals">
    <div class="empty" id="emptyState">Нажмите "Запустить Сканер" для старта инициализации...</div>
</div>

<script>
const workerCode = `
const ORDERBOOK_DEPTH = 50;
let wsConnections = [];
let symbols = [];
let symbolMetrics = new Map();
let running = false;

const books = new Map();
const swingLevels = new Map();
const wallStateMap = new Map();
const recentTrades = new Map();

function now() { return Date.now(); }

self.onmessage = function(e) {
    const { type, payload } = e.data;
    if (type === 'START') {
        symbols = payload.symbols;
        payload.metrics.forEach(([s, m]) => symbolMetrics.set(s, m));
        running = true;
        initMultiWS();
        startGarbageCollector();
    } else if (type === 'STOP') {
        running = false;
        closeWS();
    } else if (type === 'SET_SWINGS') {
        swingLevels.set(payload.symbol, payload.data);
    }
};

function startGarbageCollector() {
    setInterval(() => {
        if (!running) return;
        const currentTime = now();

        for (const [key, state] of wallStateMap.entries()) {
            if (currentTime - state.lastUpdated > 90000 || state.status === 'CANCELLED') {
                wallStateMap.delete(key);
                self.postMessage({ type: 'SIGNAL_EXPIRED', payload: { key } });
            }
        }

        for (const [symbol, buffer] of recentTrades.entries()) {
            const cutoff = currentTime - 15000;
            while (buffer.length > 0 && buffer[0].t < cutoff) buffer.shift();
            if (buffer.length === 0) recentTrades.delete(symbol);
        }
    }, 5000);
}

function getMinClusterSize(symbol) {
    const m = symbolMetrics.get(symbol) || { turnover: 5000000 };
    const avgMinuteVolume = m.turnover / 1440;
    return Math.max(10000, Math.min(avgMinuteVolume * 1.2, 250000));
}

function closeWS() {
    wsConnections.forEach(ws => { try { ws.onclose=null; ws.close(); } catch(e){} });
    wsConnections = [];
}

function initMultiWS() {
    closeWS();
    books.clear(); wallStateMap.clear(); recentTrades.clear();
    const chunkSize = 25;
    let activeWSCount = 0;

    for (let i = 0; i < symbols.length; i += chunkSize) {
        const group = symbols.slice(i, i + chunkSize);
        createSingleWS(group, () => {
            activeWSCount++;
            self.postMessage({ type: 'WS_STATUS', payload: \`\${activeWSCount}/4\` });
        });
    }
}

function createSingleWS(group, onOpenCb) {
    const ws = new WebSocket("wss://stream.bybit.com/v5/public/linear");
    wsConnections.push(ws);

    ws.onopen = async () => {
        if (onOpenCb) onOpenCb();
        const args = [];
        group.forEach(s => {
            args.push(\`orderbook.\${ORDERBOOK_DEPTH}.\${s}\`);
            args.push(\`publicTrade.\${s}\`);
        });

        for (let i = 0; i < args.length; i += 20) {
            ws.send(JSON.stringify({ op: "subscribe", args: args.slice(i, i + 20) }));
            await new Promise(r => setTimeout(r, 100));
        }
    };

    ws.onmessage = (e) => {
        if (!running) return;
        try {
            const data = JSON.parse(e.data);
            if (!data.topic) return;
            const parts = data.topic.split('.');
            const type = parts[0], symbol = parts[parts.length - 1];

            if (type === 'orderbook') handleOrderbook(symbol, data);
            else if (type === 'publicTrade') handleTrades(symbol, data.data);
        } catch(err){}
    };

    ws.onclose = () => { if (running) setTimeout(() => createSingleWS(group, null), 3000); };
}

function handleOrderbook(symbol, data) {
    let book = books.get(symbol);

    if (data.type === 'snapshot') {
        book = { bids: new Map(), asks: new Map(), lastPrice: 0, seq: data.cts || data.u };
        data.data.b.forEach(o => book.bids.set(parseFloat(o[0]), parseFloat(o[1])));
        data.data.a.forEach(o => book.asks.set(parseFloat(o[0]), parseFloat(o[1])));
        books.set(symbol, book);
    } else if (data.type === 'delta') {
        if (!book) return;
        const currentSeq = data.cts || data.u;
        if (book.seq && currentSeq < book.seq) { books.delete(symbol); return; }
        book.seq = currentSeq;

        data.data.b.forEach(o => { 
            const p=parseFloat(o[0]), q=parseFloat(o[1]); 
            q===0 ? book.bids.delete(p) : book.bids.set(p,q); 
        });
        data.data.a.forEach(o => { 
            const p=parseFloat(o[0]), q=parseFloat(o[1]); 
            q===0 ? book.asks.delete(p) : book.asks.set(p,q); 
        });
    }

    checkClusterDisappearance(symbol, book);
    processEngine(symbol);
}

function handleTrades(symbol, trades) {
    if (!trades || !trades.length) return;
    const book = books.get(symbol);
    if (!book) return;

    book.lastPrice = parseFloat(trades[0].p);
    if (!recentTrades.has(symbol)) recentTrades.set(symbol, []);
    const buffer = recentTrades.get(symbol);

    trades.forEach(t => {
        buffer.push({
            id: t.i || \`\${t.p}_\${t.v}_\${t.T || now()}\`,
            p: parseFloat(t.p),
            v: parseFloat(t.v),
            val: parseFloat(t.p) * parseFloat(t.v),
            side: t.S,
            t: t.T || now()
        });
    });

    processEngine(symbol);
}

function calculatePercentageATR(klines) {
    if (!klines || klines.length < 2) return 0;
    let trSum = 0;
    for (let i = 1; i < klines.length; i++) {
        const tr = Math.max(
            klines[i].h - klines[i].l,
            Math.abs(klines[i].h - klines[i-1].c),
            Math.abs(klines[i].l - klines[i-1].c)
        );
        trSum += tr;
    }
    return (trSum / (klines.length - 1) / klines[klines.length - 1].c) * 100;
}

function getMarketRegime(k5m, k1h) {
    const atrPct5m = calculatePercentageATR(k5m);
    const atrPct1h = calculatePercentageATR(k1h);
    if (atrPct1h === 0) return { isTradeable: false, rviNorm: 0 };
    const rviNorm = atrPct5m / atrPct1h;
    return { isTradeable: rviNorm >= 0.10 && rviNorm <= 4.0, rviNorm, atrPct5m };
}

function findPeakDensityCluster(sourceMap, targetPrice, maxDistPct, minUsdVolume) {
    if (!sourceMap || sourceMap.size === 0) return null;

    const levels = [];
    let windowTotalUsd = 0;

    for (const [price, qty] of sourceMap.entries()) {
        const dist = Math.abs(price - targetPrice) / targetPrice;
        if (dist <= maxDistPct) {
            const usdVal = price * qty;
            levels.push({ price, qty, usdVal });
            windowTotalUsd += usdVal;
        }
    }

    if (levels.length === 0 || windowTotalUsd < minUsdVolume) return null;
    levels.sort((a, b) => a.price - b.price);

    let peakIndex = 0, maxSingleTickUsd = 0;
    for (let i = 0; i < levels.length; i++) {
        if (levels[i].usdVal > maxSingleTickUsd) {
            maxSingleTickUsd = levels[i].usdVal;
            peakIndex = i;
        }
    }

    const coreStartIndex = Math.max(0, peakIndex - 2);
    const coreEndIndex = Math.min(levels.length - 1, peakIndex + 2);

    let coreUsdVolume = 0, weightedPriceSum = 0;
    for (let i = coreStartIndex; i <= coreEndIndex; i++) {
        coreUsdVolume += levels[i].usdVal;
        weightedPriceSum += levels[i].price * levels[i].usdVal;
    }

    if (coreUsdVolume >= minUsdVolume) {
        return {
            clusterAvgPrice: weightedPriceSum / coreUsdVolume,
            peakPrice: levels[peakIndex].price,
            coreUsdVolume,
            totalWindowUsd: windowTotalUsd,
            minPrice: levels[coreStartIndex].price,
            maxPrice: levels[coreEndIndex].price,
            ticksInCore: (coreEndIndex - coreStartIndex) + 1
        };
    }
    return null;
}

// УЛУЧШЕННАЯ ПРОВЕРКА СНЯТИЯ (ЗАЩИТА ОТ ЛОЖНОГО СПУФИНГА ПРИ ПОГЛОЩЕНИИ)
function checkClusterDisappearance(symbol, book) {
    for (const [key, state] of wallStateMap.entries()) {
        if (state.symbol === symbol && state.status !== 'CANCELLED' && state.status !== 'ENTRY') {
            const source = state.side === 'LONG' ? book.bids : book.asks;
            const cluster = findPeakDensityCluster(source, state.clusterAvgPrice, 0.005, getMinClusterSize(symbol) * 0.15);

            // Если объемы падают, но по кластеру шли реальные маркет-удары — это НЕ спуфинг
            if (!cluster && state.absorbedVol < 1500 && state.hitsCount === 0) {
                state.status = 'CANCELLED';
                state.reason = '❌ СПУФИНГ / КЛАСТЕР СНЯТ';
                self.postMessage({ type: 'SIGNAL_CANCEL', payload: { key, reason: state.reason } });
                wallStateMap.delete(key);
            }
        }
    }
}

function processEngine(symbol) {
    const book = books.get(symbol);
    const swings = swingLevels.get(symbol);
    if (!book || !swings || !book.lastPrice) return;

    const regime = getMarketRegime(swings.k5m, swings.k1h);
    if (!regime.isTradeable) return;

    const price = book.lastPrice;
    const trades = recentTrades.get(symbol) || [];

    const levelsToTest = [
        ...swings.lows.map(l => ({ p: l, side: 'LONG' })),
        ...swings.highs.map(h => ({ p: h, side: 'SHORT' }))
    ];

    levelsToTest.forEach(lvl => {
        const key = \`\${symbol}_\${lvl.side}_\${lvl.p}\`;
        const minClusterSize = getMinClusterSize(symbol);
        const sourceMap = lvl.side === 'LONG' ? book.bids : book.asks;

        const cluster = findPeakDensityCluster(sourceMap, lvl.p, 0.005, minClusterSize);
        if (!cluster) return;

        let state = wallStateMap.get(key) || {
            key, symbol, side: lvl.side, 
            clusterAvgPrice: cluster.clusterAvgPrice,
            clusterMinP: cluster.minPrice,
            clusterMaxP: cluster.maxPrice,
            initialVal: cluster.coreUsdVolume,
            hitsCount: 0, absorbedVol: 0, touched: false, status: 'TRACKING',
            minPriceAfterTouch: price, maxPriceAfterTouch: price,
            lastProcessedTradeTime: 0,
            lastUpdated: now()
        };

        state.lastUpdated = now();

        // Расширенный диапазон детекции касания уровня (0.25%)
        const borderPrice = lvl.side === 'LONG' ? cluster.maxPrice : cluster.minPrice;
        if (Math.abs(price - borderPrice) / borderPrice <= 0.0025) { state.touched = true; }

        if (state.touched) {
            state.minPriceAfterTouch = Math.min(state.minPriceAfterTouch, price);
            state.maxPriceAfterTouch = Math.max(state.maxPriceAfterTouch, price);

            let maxTradeTimeInBatch = state.lastProcessedTradeTime;

            trades.forEach(t => {
                if (t.t > state.lastProcessedTradeTime) {
                    const isHit = (lvl.side === 'LONG' && t.side === 'Sell') || 
                                  (lvl.side === 'SHORT' && t.side === 'Buy');

                    if (isHit && t.p >= cluster.minPrice * 0.995 && t.p <= cluster.maxPrice * 1.005) {
                        state.hitsCount++;
                        state.absorbedVol += t.val;
                    }
                    if (t.t > maxTradeTimeInBatch) maxTradeTimeInBatch = t.t;
                }
            });

            state.lastProcessedTradeTime = maxTradeTimeInBatch;

            const atrAbs5m = (regime.atrPct5m / 100) * price;
            const actualBounce = lvl.side === 'LONG' 
                ? (price - state.minPriceAfterTouch) 
                : (state.maxPriceAfterTouch - price);

            let sl = lvl.side === 'LONG' ? cluster.minPrice - (atrAbs5m * 0.2) : cluster.maxPrice + (atrAbs5m * 0.2);

            // Режим входа: достаточно хотя бы 1 удара и минимального поглощения ($2k)
            if ((state.hitsCount >= 1 || state.absorbedVol >= 2000) && state.status !== 'ENTRY') {
                state.status = 'ENTRY';
                const risk = Math.abs(price - sl);

                self.postMessage({
                    type: 'SIGNAL_ENTRY',
                    payload: {
                        key, symbol, side: lvl.side, price, 
                        clusterVal: cluster.coreUsdVolume,
                        clusterAvgPrice: cluster.clusterAvgPrice,
                        levelsCount: cluster.ticksInCore,
                        hitsCount: state.hitsCount, 
                        absorbedVol: state.absorbedVol,
                        sl, 
                        tp1: lvl.side === 'LONG' ? price + risk * 2.0 : price - risk * 2.0,
                        slPct: (risk / price) * 100,
                        bounceDist: actualBounce / price,
                        rvi: regime.rviNorm
                    }
                });
            }
        }
        wallStateMap.set(key, state);
    });
}
`;

// ============================================================================
// MAIN THREAD
// ============================================================================
let worker = null;
let running = false;
let audioCtx = null;
const activeSignals = new Map();
const symbols = [];
const symbolMetrics = new Map();

function playBeep() {
    if (!document.getElementById("soundToggle").checked) return;
    try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.frequency.value = 880; gain.gain.value = 0.15;
        osc.start(); osc.stop(audioCtx.currentTime + 0.12);
    } catch(e){}
}

function priceFormat(v) { return Number(v) >= 1000 ? Number(v).toFixed(2) : Number(v).toFixed(4); }

async function loadKlinesWithQueue(symbolList) {
    const total = symbolList.length;
    let completed = 0;

    for (const symbol of symbolList) {
        if (!running) break;
        try {
            const [res5m, res1h] = await Promise.all([
                fetch(`https://api.bybit.com/v5/market/kline?category=linear&symbol=${symbol}&interval=5&limit=40`),
                fetch(`https://api.bybit.com/v5/market/kline?category=linear&symbol=${symbol}&interval=60&limit=24`)
            ]);

            const json5m = await res5m.json();
            const json1h = await res1h.json();

            if (json5m.result?.list && json1h.result?.list) {
                const k5m = json5m.result.list.map(k => ({ h: parseFloat(k[2]), l: parseFloat(k[3]), c: parseFloat(k[4]) })).reverse();
                const k1h = json1h.result.list.map(k => ({ h: parseFloat(k[2]), l: parseFloat(k[3]), c: parseFloat(k[4]) })).reverse();

                const highs = [], lows = [];
                for (let i = 2; i < k5m.length - 2; i++) {
                    const isHigh = k5m[i].h > k5m[i-2].h && k5m[i].h > k5m[i-1].h && k5m[i].h > k5m[i+1].h && k5m[i].h > k5m[i+2].h;
                    const isLow  = k5m[i].l < k5m[i-2].l && k5m[i].l < k5m[i-1].l && k5m[i].l < k5m[i+1].l && k5m[i].l < k5m[i+2].l;
                    if (isHigh) highs.push(k5m[i].h);
                    if (isLow)  lows.push(k5m[i].l);
                }

                if (worker) {
                    worker.postMessage({ 
                        type: 'SET_SWINGS', 
                        payload: { symbol, data: { highs, lows, k5m, k1h } } 
                    });
                }
            }
        } catch(e){}

        completed++;
        const pct = Math.round((completed / total) * 100);
        document.getElementById("loadProgress").innerText = `${pct}%`;
        document.getElementById("progressFill").style.width = `${pct}%`;

        await new Promise(r => setTimeout(r, 100));
    }
}

function updateCardDOM(s) {
    const container = document.getElementById("signals");
    const emptyState = document.getElementById("emptyState");
    if (emptyState) emptyState.remove();

    let card = document.getElementById(`card_${s.key}`);
    const isEntry = s.status === 'ENTRY';

    const cardHTML = `
        <div class="card-head">
            <div class="symbol">${s.symbol} <span class="badge ${isEntry ? 'entry' : 'cancelled'}">${s.side}</span>
            <span class="badge cluster">ПИК-КЛАСТЕР (${s.levelsCount || 1} тика)</span>
            <span class="badge vol">RVI ${s.rvi ? s.rvi.toFixed(2) : '1.00'}</span></div>
            <div>${isEntry ? '🟢 ENTRY' : '🔴 CANCELLED'}</div>
        </div>

        ${isEntry ? `
        <div class="grid">
            <div class="box">Объем Кластера<strong>$${(s.clusterVal/1000).toFixed(1)}k</strong></div>
            <div class="box">Ударов в Ядро<strong>${s.hitsCount} раз</strong></div>              <div class="box">Поглощено (Absorption)<strong>$${(s.absorbedVol/1000).toFixed(1)}k</strong></div>
            <div class="box">Импульс (Bounce)<strong>+${(s.bounceDist*100).toFixed(2)}%</strong></div>
        </div>
        <div class="grid">
            <div class="box">Вход (Market)<strong>${priceFormat(s.price)}</strong></div>
            <div class="box">Dynamic SL (ATR)<strong>${priceFormat(s.sl)} (-${s.slPct.toFixed(2)}%)</strong></div>
            <div class="box">Take Profit 1<strong>${priceFormat(s.tp1)}</strong></div>
            <div class="box">Средняя Ядра<strong>${priceFormat(s.clusterAvgPrice)}</strong></div>
        </div>
        ` : `<div style="color:#f6465d; font-size:12px;"><b>Причина отмены:</b> ${s.reason}</div>`}
    `;

    if (!card) {
        card = document.createElement("div");
        card.id = `card_${s.key}`;
        card.className = `card ${isEntry ? 'entry' : 'cancelled'}`;
        card.innerHTML = cardHTML;
        container.prepend(card);
    } else {
        card.className = `card ${isEntry ? 'entry' : 'cancelled'}`;
        card.innerHTML = cardHTML;
    }

    updateCounters();
}

function removeCardDOM(key) {
    const card = document.getElementById(`card_${key}`);
    if (card) card.remove();
    activeSignals.delete(key);
    updateCounters();
}

function updateCounters() {
    const list = [...activeSignals.values()];
    document.getElementById("sigCount").innerText = list.filter(s => s.status === 'ENTRY').length;
    document.getElementById("clusterCount").innerText = list.length;
}

async function startEngine() {
    if (running) return;
    running = true;

    const blob = new Blob([workerCode], { type: 'application/javascript' });
    worker = new Worker(URL.createObjectURL(blob));

    worker.onmessage = function(e) {
        const { type, payload } = e.data;
        if (type === 'WS_STATUS') {
            const el = document.getElementById("wsStatus");
            el.innerText = payload; el.style.color = "#0ecb81";
        } else if (type === 'SIGNAL_ENTRY') {
            playBeep();
            payload.status = 'ENTRY';
            activeSignals.set(payload.key, payload);
            updateCardDOM(payload);
        } else if (type === 'SIGNAL_CANCEL') {
            if (activeSignals.has(payload.key)) {
                const s = activeSignals.get(payload.key);
                s.status = 'CANCELLED';
                s.reason = payload.reason;
                updateCardDOM(s);
            }
        } else if (type === 'SIGNAL_EXPIRED') {
            removeCardDOM(payload.key);
        }
    };

    document.getElementById("emptyState").innerText = "Фильтрация альтов и мемов...";
    
    const res = await fetch("https://api.bybit.com/v5/market/tickers?category=linear");
    const json = await res.json();
    symbols.length = 0; symbolMetrics.clear();

    const top5ToExclude = ["BTCUSDT", "ETHUSDT", "SOLUSDT", "XRPUSDT", "DOGEUSDT"];

    const list = json.result.list
        .filter(i => i.symbol.endsWith("USDT") && parseFloat(i.turnover24h) > 0)
        .filter(i => !top5ToExclude.includes(i.symbol))
        .sort((a,b) => parseFloat(b.turnover24h) - parseFloat(a.turnover24h))
        .slice(0, 100);

    const metricsArr = [];
    list.forEach((item, idx) => {
        symbols.push(item.symbol);
        const m = { rank: idx + 6, turnover: parseFloat(item.turnover24h) };
        symbolMetrics.set(item.symbol, m);
        metricsArr.push([item.symbol, m]);
    });
    document.getElementById("coinCount").innerText = symbols.length;

    await loadKlinesWithQueue(symbols);
    worker.postMessage({ type: 'START', payload: { symbols, metrics: metricsArr } });
    document.getElementById("emptyState").innerText = "Мониторинг запущен...";
}

function stopEngine() {
    running = false;
    if (worker) { worker.postMessage({ type: 'STOP' }); worker.terminate(); worker = null; }
    document.getElementById("wsStatus").innerText = "0/4";
    document.getElementById("wsStatus").style.color = "#f6465d";
    document.getElementById("loadProgress").innerText = "0%";
    document.getElementById("progressFill").style.width = "0%";
}

function clearCards() {
    activeSignals.clear();
    document.getElementById("signals").innerHTML = `<div class="empty" id="emptyState">Карточки очищены...</div>`;
    updateCounters();
}
</script>
</body>
</html>
