<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bybit MTF OrderFlow v9 Pro</title>
<style>
body{margin:0;background:#080a0c;color:#eaecef;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;padding:14px}
.header{background:#12161c;border:1px solid #1e2630;border-radius:12px;padding:14px;margin-bottom:12px}
button{background:#f0b90b;border:0;padding:10px 14px;border-radius:8px;font-weight:700;cursor:pointer;margin-right:4px}
.stop{background:#f6465d;color:#fff}.clear{background:#2b313a;color:#fff}
#signals{height:78vh;overflow:auto}.card{background:#12161c;border:1px solid #1e2630;border-left:5px solid #0ecb81;border-radius:10px;padding:12px;margin-bottom:10px;transition:all 0.3s}
.short{border-left-color:#f6465d}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.box{background:#181e25;padding:8px;border-radius:6px;font-size:12px}.box b{display:block;font-size:14px}
.tf-badge{display:inline-block;padding:2px 6px;border-radius:4px;font-size:11px;font-weight:700;margin-left:8px;background:#2b313a}
.tf-4H{background:#8a2be2;color:#fff}
.tf-1H{background:#f39c12;color:#fff}
.tf-15M{background:#2980b9;color:#fff}
.info-row{display:flex;justify-content:space-between;font-size:11px;color:#848e9c;margin-top:8px;padding-top:6px;border-top:1px dashed #2b313a}
#status{margin-top:8px;font-size:13px;color:#848e9c}
</style>
</head>
<body>

<div class="header">
  <h2>⚡ Bybit MTF OrderFlow Scanner (4H / 1H / 15M → 5M Trigger)</h2>
  <button onclick="start()">▶ Старт</button> 
  <button class="stop" onclick="stop()">⏹ Стоп</button> 
  <button class="clear" onclick="clearCards()">🗑 Очистить</button>
  <div id="status">Статус: ожидание</div>
</div>

<div id="signals"><div>Нажмите «Старт» для анализа старших таймфреймов и стакана...</div></div>

<script>
const DEPTH = 50, TOP = 80, SIGNAL_TTL_MS = 900000; // TTL: 15 минут
let run = false, ws = [], pingInterval = null, managerInterval = null;
let books = new Map(), swings = new Map(), trades = new Map(), signals = new Map(), symbols = [], metrics = new Map();

const S = document.getElementById("signals");
const ST = document.getElementById("status");

const now = () => Date.now();
const pf = v => Number(v) >= 1000 ? Number(v).toFixed(2) : Number(v).toFixed(4);

async function start() {
    if (run) return;
    run = true;
    ST.textContent = "Загрузка топ монет и разметка уровней HTF (4H, 1H, 15M)...";

    try {
        const r = await fetch("https://api.bybit.com/v5/market/tickers?category=linear");
        const j = await r.json();
        const ex = new Set(["BTCUSDT", "ETHUSDT", "SOLUSDT", "XRPUSDT", "DOGEUSDT"]);

        symbols = j.result.list
            .filter(x => x.symbol.endsWith("USDT") && !ex.has(x.symbol))
            .sort((a, b) => +b.turnover24h - +a.turnover24h)
            .slice(0, TOP)
            .map((x, i) => (metrics.set(x.symbol, { rank: i + 1, turn: +x.turnover24h }), x.symbol));

        let loaded = 0;
        for (const s of symbols) {
            await loadSwings(s);
            loaded++;
            ST.textContent = `Загрузка уровней HTF: ${loaded}/${symbols.length} монет`;
            await new Promise(r => setTimeout(r, 35));
        }

        connect();
        startSignalManager();
        ST.textContent = `Мониторинг запущен (${symbols.length} монет)`;
    } catch (e) {
        ST.textContent = "Ошибка инициализации API";
        run = false;
    }
}

async function loadSwings(sym) {
    try {
        const [r4h, r1h, r15m, r5m] = await Promise.all([
            fetch(`https://api.bybit.com/v5/market/kline?category=linear&symbol=${sym}&interval=240&limit=40`).then(r => r.json()),
            fetch(`https://api.bybit.com/v5/market/kline?category=linear&symbol=${sym}&interval=60&limit=40`).then(r => r.json()),
            fetch(`https://api.bybit.com/v5/market/kline?category=linear&symbol=${sym}&interval=15&limit=40`).then(r => r.json()),
            fetch(`https://api.bybit.com/v5/market/kline?category=linear&symbol=${sym}&interval=5&limit=30`).then(r => r.json())
        ]);

        const parseK = list => (list || []).map(x => ({ h: +x[2], l: +x[3], c: +x[4] })).reverse();
        const k4h = parseK(r4h.result?.list);
        const k1h = parseK(r1h.result?.list);
        const k15m = parseK(r15m.result?.list);
        const k5m = parseK(r5m.result?.list);

        let levels = [];

        const extractFractals = (k, tf, weight) => {
            for (let i = 2; i < k.length - 2; i++) {
                if (k[i].h > k[i-1].h && k[i].h > k[i+1].h && k[i].h > k[i-2].h && k[i].h > k[i+2].h) {
                    levels.push({ price: k[i].h, side: "SHORT", tf, weight });
                }
                if (k[i].l < k[i-1].l && k[i].l < k[i+1].l && k[i].l < k[i-2].l && k[i].l < k[i+2].l) {
                    levels.push({ price: k[i].l, side: "LONG", tf, weight });
                }
            }
        };

        extractFractals(k4h, "4H", 3);
        extractFractals(k1h, "1H", 2);
        extractFractals(k15m, "15M", 1);

        swings.set(sym, { levels, k5m });
    } catch (e) {}
}

function connect() {
    for (let i = 0; i < symbols.length; i += 20) {
        const g = symbols.slice(i, i + 20);
        const w = new WebSocket("wss://stream.bybit.com/v5/public/linear");
        ws.push(w);

        w.onopen = async () => {
            let a = [];
            g.forEach(s => {
                a.push(`orderbook.${DEPTH}.${s}`);
                a.push(`publicTrade.${s}`);
            });

            for (let j = 0; j < a.length; j += 10) {
                if (w.readyState === WebSocket.OPEN) {
                    w.send(JSON.stringify({ op: "subscribe", args: a.slice(j, j + 10) }));
                    await new Promise(r => setTimeout(r, 80));
                }
            }
        };

        w.onmessage = e => {
            if (!run) return;
            try {
                const d = JSON.parse(e.data);
                if (!d.topic) return;
                const p = d.topic.split(".");
                const t = p[0], s = p.at(-1);

                if (t === "orderbook") ob(s, d);
                else if (t === "publicTrade") tr(s, d.data);
            } catch (err) {}
        };
    }

    if (pingInterval) clearInterval(pingInterval);
    pingInterval = setInterval(() => {
        ws.forEach(w => w.readyState === WebSocket.OPEN && w.send(JSON.stringify({ op: "ping" })));
    }, 20000);
}

function ob(s, d) {
    let b = books.get(s) || { b: new Map(), a: new Map(), last: 0 };

    if (d.type === "snapshot") {
        b.b.clear(); b.a.clear();
        d.data.b.forEach(o => b.b.set(+o[0], +o[1]));
        d.data.a.forEach(o => b.a.set(+o[0], +o[1]));
    } else if (d.type === "delta") {
        d.data.b.forEach(o => +o[1] ? b.b.set(+o[0], +o[1]) : b.b.delete(+o[0]));
        d.data.a.forEach(o => +o[1] ? b.a.set(+o[0], +o[1]) : b.a.delete(+o[0]));
    }

    books.set(s, b);
    scan(s);
}

function tr(s, l) {
    if (!l || !l.length) return;
    let b = books.get(s) || { b: new Map(), a: new Map(), last: 0 };
    b.last = +l[0].p; 
    books.set(s, b);

    if (!trades.has(s)) trades.set(s, []);
    const arr = trades.get(s);

    l.forEach(x => arr.push({ p: +x.p, val: +x.p * +x.v, side: x.S, t: x.T || now() }));
    while (arr.length && arr[0].t < now() - 15000) arr.shift();
    scan(s);
}

function atr(k) {
    if (!k || k.length < 2) return 0;
    let t = 0;
    for (let i = 1; i < k.length; i++) {
        t += Math.max(k[i].h - k[i].l, Math.abs(k[i].h - k[i-1].c), Math.abs(k[i].l - k[i-1].c));
    }
    return t / (k.length - 1);
}

function cluster(map, p, s) {
    if (!map || map.size === 0) return null;
    let total = 0, peak = p, m = 0;
    for (const [k, q] of map) {
        if (Math.abs(k - p) / p <= 0.005) {
            let u = k * q;
            total += u;
            if (u > m) { m = u; peak = k; }
        }
    }
    let minThreshold = Math.max(12000, (metrics.get(s)?.turn || 5e6) / 1440 * 1.5);
    if (total < minThreshold) return null;
    return { usd: total, price: peak, min: peak * 0.998, max: peak * 1.002 };
}

function scan(s) {
    const b = books.get(s), sw = swings.get(s);
    if (!b || !sw || !b.last) return;

    // 1. Фильтр: Ищем уровни HTF (4H/1H/15M) вблизи текущей цены (дистанция до 0.4%)
    const nearHTF = sw.levels.filter(l => Math.abs(b.last - l.price) / l.price <= 0.004);
    if (nearHTF.length === 0) return;

    for (const lvl of nearHTF) {
        const key = `${s}_${lvl.tf}_${lvl.side}_${lvl.price}`;
        
        // 2. Ищем подкрепление лимитным кластером на 5M около уровня
        const c = cluster(lvl.side === "LONG" ? b.b : b.a, lvl.price, s);
        if (!c) continue;

        // 3. Проверка ленты сделок (активность поглощения)
        let hits = 0, abs = 0;
        for (const t of (trades.get(s) || [])) {
            const hit = lvl.side === "LONG" ? t.side === "Sell" : t.side === "Buy";
            if (hit && Math.abs(t.p - c.price) / c.price < 0.003) {
                hits++;
                abs += t.val;
            }
        }
        if (hits < 2 && abs < 4000) continue;

        if (signals.has(key)) continue;

        // 4. Расчет SL и TP на основе структуры HTF и ATR 5M
        const A = atr(sw.k5m);
        const sl = lvl.side === "LONG" ? c.min - A * 0.3 : c.max + A * 0.3;
        const risk = Math.abs(b.last - sl);

        // Расчет Target R:R 1:3 для HTF сетапов
        const tp = lvl.side === "LONG" ? b.last + (risk * 3) : b.last - (risk * 3);

        signals.set(key, {
            key,
            symbol: s,
            side: lvl.side,
            tf: lvl.tf,
            weight: lvl.weight,
            price: b.last,
            levelPrice: lvl.price,
            sl,
            tp,
            clusterUsd: c.usd,
            rr: "1:3",
            created: now()
        });

        render();
    }
}

function startSignalManager() {
    if (managerInterval) clearInterval(managerInterval);
    managerInterval = setInterval(() => {
        if (!run || signals.size === 0) return;

        let changed = false;
        const currentTime = now();

        for (const [key, sig] of signals.entries()) {
            const b = books.get(sig.symbol);

            // 1. Истечение времени жизни
            if (currentTime - sig.created > SIGNAL_TTL_MS) {
                signals.delete(key);
                changed = true;
                continue;
            }

            if (!b || !b.last) continue;

            // 2. Инвалидация при уходе цены за пределы структуры (более 1.2%)
            if (Math.abs(b.last - sig.levelPrice) / sig.levelPrice > 0.012) {
                signals.delete(key);
                changed = true;
                continue;
            }

            // 3. Проверка расформирования кластера в стакане (< 35% от первичного)
            const sourceMap = sig.side === "LONG" ? b.b : b.a;
            const currentCluster = cluster(sourceMap, sig.levelPrice, sig.symbol);
            if (!currentCluster || currentCluster.usd < sig.clusterUsd * 0.35) {
                signals.delete(key);
                changed = true;
            }
        }

        if (changed) render();
    }, 1500);
}

function render() {
    if (!signals.size) {
        S.innerHTML = "<div>Мониторинг HTF уровней и стакана. Ожидание сетапов...</div>";
        return;
    }

    // Сортировка сигналов по важности таймфрейма (4H -> 1H -> 15M)
    const sorted = [...signals.values()].sort((a,b) => b.weight - a.weight || b.created - a.created);

    S.innerHTML = sorted.slice(0, 15).map(x => `
        <div class="card ${x.side === "SHORT" ? "short" : ""}">
            <h3>${x.symbol} — ${x.side} <span class="tf-badge tf-${x.tf}">Уровень ${x.tf}</span></h3>
            <div class="grid">
                <div class="box">Вход<b>${pf(x.price)}</b></div>
                <div class="box">Уровень HTF<b>${pf(x.levelPrice)}</b></div>
                <div class="box">SL<b>${pf(x.sl)}</b></div>
                <div class="box">TP (R:R ${x.rr})<b>${pf(x.tp)}</b></div>
            </div>
            <div class="info-row">
                <span>Плотность 5M: $${Math.round(x.clusterUsd).toLocaleString()}</span>
                <span>Статус: Подтвержден стаканом</span>
            </div>
        </div>
    `).join("");
}

function stop() {
    run = false;
    if (pingInterval) clearInterval(pingInterval);
    if (managerInterval) clearInterval(managerInterval);
    ws.forEach(x => { try { x.close(); } catch(e){} });
    ws = [];
    ST.textContent = "Сканер остановлен.";
}

function clearCards() {
    signals.clear();
    render();
}
</script>
</body>
</html>
