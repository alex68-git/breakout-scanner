<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bybit Institutional OrderFlow v8 Dynamic</title>
<style>
body{margin:0;background:#080a0c;color:#eaecef;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;padding:14px}
.header{background:#12161c;border:1px solid #1e2630;border-radius:12px;padding:14px;margin-bottom:12px}
button{background:#f0b90b;border:0;padding:10px 14px;border-radius:8px;font-weight:700;cursor:pointer;margin-right:4px}
.stop{background:#f6465d;color:#fff}.clear{background:#2b313a;color:#fff}
#signals{height:78vh;overflow:auto}.card{background:#12161c;border:1px solid #1e2630;border-left:5px solid #0ecb81;border-radius:10px;padding:12px;margin-bottom:10px;transition:all 0.3s}
.short{border-left-color:#f6465d}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.box{background:#181e25;padding:8px;border-radius:6px;font-size:12px}.box b{display:block;font-size:14px}
.info-row{display:flex;justify-content:space-between;font-size:11px;color:#848e9c;margin-top:8px;padding-top:6px;border-top:1px dashed #2b313a}
#status{margin-top:8px;font-size:13px;color:#848e9c}
</style>
</head>
<body>

<div class="header">
  <h2>⚡ Bybit OrderFlow v8 (Dynamic Signals & Clean Manager)</h2>
  <button onclick="start()">▶ Старт</button> 
  <button class="stop" onclick="stop()">⏹ Стоп</button> 
  <button class="clear" onclick="clearCards()">🗑 Очистить</button>
  <div id="status">Статус: ожидание</div>
</div>

<div id="signals"><div>Нажмите «Старт» для запуска сканера...</div></div>

<script>
const DEPTH = 50, TOP = 100, SIGNAL_TTL_MS = 600000; // TTL: 10 минут
let run = false, ws = [], pingInterval = null, managerInterval = null;
let books = new Map(), swings = new Map(), trades = new Map(), signals = new Map(), symbols = [], metrics = new Map();

const S = document.getElementById("signals");
const ST = document.getElementById("status");

const now = () => Date.now();
const pf = v => Number(v) >= 1000 ? Number(v).toFixed(2) : Number(v).toFixed(4);

async function start() {
    if (run) return;
    run = true;
    ST.textContent = "Загрузка монет...";

    try {
        const r = await fetch("https://api.bybit.com/v5/market/tickers?category=linear");
        const j = await r.json();
        const ex = new Set(["BTCUSDT", "ETHUSDT", "SOLUSDT", "XRPUSDT", "DOGEUSDT"]);

        symbols = j.result.list
            .filter(x => x.symbol.endsWith("USDT") && !ex.has(x.symbol))
            .sort((a, b) => +b.turnover24h - +a.turnover24h)
            .slice(0, TOP)
            .map((x, i) => (metrics.set(x.symbol, { rank: i + 1, turn: +x.turnover24h }), x.symbol));

        for (const s of symbols) {
            await loadSwings(s);
            await new Promise(r => setTimeout(r, 25));
        }

        connect();
        startSignalManager(); // Запуск авто-очистки
        ST.textContent = `Мониторинг запущен (${symbols.length} монет)`;
    } catch (e) {
        ST.textContent = "Ошибка запуска API";
        run = false;
    }
}

async function loadSwings(sym) {
    try {
        const r = await fetch(`https://api.bybit.com/v5/market/kline?category=linear&symbol=${sym}&interval=5&limit=40`);
        const j = await r.json();
        if (!j.result?.list) return;

        const k = j.result.list.map(x => ({ h: +x[2], l: +x[3], c: +x[4] })).reverse();
        let hi = [], lo = [];

        for (let i = 2; i < k.length - 2; i++) {
            if (k[i].h > k[i-1].h && k[i].h > k[i+1].h && k[i].h > k[i-2].h && k[i].h > k[i+2].h) hi.push(k[i].h);
            if (k[i].l < k[i-1].l && k[i].l < k[i+1].l && k[i].l < k[i-2].l && k[i].l < k[i+2].l) lo.push(k[i].l);
        }
        swings.set(sym, { hi, lo, k });
    } catch (e) {}
}

function connect() {
    for (let i = 0; i < symbols.length; i += 20) {
        const g = symbols.slice(i, i + 20);
        const w = new WebSocket("wss://stream.bybit.com/v5/public/linear");
        ws.push(w);

        w.onopen = async () => {
            let a = [];
            g.forEach(s => {
                a.push(`orderbook.${DEPTH}.${s}`);
                a.push(`publicTrade.${s}`);
            });

            for (let j = 0; j < a.length; j += 10) {
                if (w.readyState === WebSocket.OPEN) {
                    w.send(JSON.stringify({ op: "subscribe", args: a.slice(j, j + 10) }));
                    await new Promise(r => setTimeout(r, 80));
                }
            }
        };

        w.onmessage = e => {
            if (!run) return;
            try {
                const d = JSON.parse(e.data);
                if (!d.topic) return;
                const p = d.topic.split(".");
                const t = p[0], s = p.at(-1);

                if (t === "orderbook") ob(s, d);
                else if (t === "publicTrade") tr(s, d.data);
            } catch (err) {}
        };
    }

    if (pingInterval) clearInterval(pingInterval);
    pingInterval = setInterval(() => {
        ws.forEach(w => w.readyState === WebSocket.OPEN && w.send(JSON.stringify({ op: "ping" })));
    }, 20000);
}

function ob(s, d) {
    let b = books.get(s) || { b: new Map(), a: new Map(), last: 0 };

    if (d.type === "snapshot") {
        b.b.clear(); b.a.clear();
        d.data.b.forEach(o => b.b.set(+o[0], +o[1]));
        d.data.a.forEach(o => b.a.set(+o[0], +o[1]));
    } else if (d.type === "delta") {
        d.data.b.forEach(o => +o[1] ? b.b.set(+o[0], +o[1]) : b.b.delete(+o[0]));
        d.data.a.forEach(o => +o[1] ? b.a.set(+o[0], +o[1]) : b.a.delete(+o[0]));
    }

    books.set(s, b);
    scan(s);
}

function tr(s, l) {
    if (!l || !l.length) return;
    let b = books.get(s) || { b: new Map(), a: new Map(), last: 0 };
    b.last = +l[0].p; 
    books.set(s, b);

    if (!trades.has(s)) trades.set(s, []);
    const arr = trades.get(s);

    l.forEach(x => arr.push({ p: +x.p, val: +x.p * +x.v, side: x.S, t: x.T || now() }));
    while (arr.length && arr[0].t < now() - 15000) arr.shift();
    scan(s);
}

function atr(k) {
    if (!k || k.length < 2) return 0;
    let t = 0;
    for (let i = 1; i < k.length; i++) {
        t += Math.max(k[i].h - k[i].l, Math.abs(k[i].h - k[i-1].c), Math.abs(k[i].l - k[i-1].c));
    }
    return t / (k.length - 1);
}

function cluster(map, p, s) {
    if (!map || map.size === 0) return null;
    let total = 0, peak = p, m = 0;
    for (const [k, q] of map) {
        if (Math.abs(k - p) / p <= 0.005) {
            let u = k * q;
            total += u;
            if (u > m) { m = u; peak = k; }
        }
    }
    let minThreshold = Math.max(10000, (metrics.get(s)?.turn || 5e6) / 1440 * 1.2);
    if (total < minThreshold) return null;
    return { usd: total, price: peak, min: peak * 0.998, max: peak * 1.002 };
}

function scan(s) {
    const b = books.get(s), sw = swings.get(s);
    if (!b || !sw || !b.last) return;

    const lv = [
        ...sw.lo.map(x => ({ p: x, side: "LONG" })),
        ...sw.hi.map(x => ({ p: x, side: "SHORT" }))
    ];

    for (const l of lv) {
        const key = `${s}_${l.side}_${l.p}`;
        
        const c = cluster(l.side === "LONG" ? b.b : b.a, l.p, s);
        if (!c) continue; // Если кластера нет — пропускаем

        if (Math.abs(b.last - c.price) / c.price > 0.0025) continue;

        let hits = 0, abs = 0;
        for (const t of (trades.get(s) || [])) {
            const hit = l.side === "LONG" ? t.side === "Sell" : t.side === "Buy";
            if (hit && Math.abs(t.p - c.price) / c.price < 0.003) {
                hits++;
                abs += t.val;
            }
        }

        if (hits < 2 && abs < 5000) continue;

        if (signals.has(key)) continue; // Установлен ли уже активный сигнал

        const A = atr(sw.k);
        const sl = l.side === "LONG" ? c.min - A * 0.25 : c.max + A * 0.25;
        const risk = Math.abs(b.last - sl);
        
        // Динамический Take-Profit: минимум 2.5R или 1.2x ATR
        const tpDist = Math.max(risk * 2.5, A * 1.2);
        const tp = l.side === "LONG" ? b.last + tpDist : b.last - tpDist;

        signals.set(key, {
            key,
            symbol: s,
            side: l.side,
            price: b.last,
            sl,
            tp,
            clusterPrice: c.price,
            clusterUsd: c.usd,
            atrVal: A,
            created: now()
        });

        render();
    }
}

// МЕНЕДЖЕР АВТО-ОЧИСТКИ СИГНАЛОВ
function startSignalManager() {
    if (managerInterval) clearInterval(managerInterval);
    managerInterval = setInterval(() => {
        if (!run || signals.size === 0) return;

        let changed = false;
        const currentTime = now();

        for (const [key, sig] of signals.entries()) {
            const b = books.get(sig.symbol);
            
            // 1. Удаление по истечению времени (TTL)
            if (currentTime - sig.created > SIGNAL_TTL_MS) {
                signals.delete(key);
                changed = true;
                continue;
            }

            if (!b || !b.last) continue;

            // 2. Проверка ухода цены далеко от уровня (Инвалидация)
            const priceDev = Math.abs(b.last - sig.clusterPrice) / sig.clusterPrice;
            if (priceDev > 0.015) { // Ушли дальше 1.5%
                signals.delete(key);
                changed = true;
                continue;
            }

            // 3. Проверка актуальности лимитного кластера в стакане
            const sourceMap = sig.side === "LONG" ? b.b : b.a;
            const currentCluster = cluster(sourceMap, sig.clusterPrice, sig.symbol);
            
            // Если объем кластера упал ниже 40% от начального (сняли заявку/spoofing)
            if (!currentCluster || currentCluster.usd < sig.clusterUsd * 0.4) {
                signals.delete(key);
                changed = true;
            }
        }

        if (changed) render();
    }, 1500); // Проверка каждые 1.5 секунды
}

function render() {
    if (!signals.size) {
        S.innerHTML = "<div>Ожидаем актуальные сетапы...</div>";
        return;
    }

    S.innerHTML = [...signals.values()].reverse().slice(0, 15).map(x => `
        <div class="card ${x.side === "SHORT" ? "short" : ""}">
            <h3>${x.symbol} — ${x.side}</h3>
            <div class="grid">
                <div class="box">Вход<b>${pf(x.price)}</b></div>
                <div class="box">SL<b>${pf(x.sl)}</b></div>
                <div class="box">TP<b>${pf(x.tp)}</b></div>
                <div class="box">Объем<b>$${Math.round(x.clusterUsd).toLocaleString()}</b></div>
            </div>
            <div class="info-row">
                <span>ATR: ${pf(x.atrVal)}</span>
                <span>Статус: Кластер удержан (Мониторинг)</span>
            </div>
        </div>
    `).join("");
}

function stop() {
    run = false;
    if (pingInterval) clearInterval(pingInterval);
    if (managerInterval) clearInterval(managerInterval);
    ws.forEach(x => { try { x.close(); } catch(e){} });
    ws = [];
    ST.textContent = "Мониторинг остановлен.";
}

function clearCards() {
    signals.clear();
    render();
}
</script>
</body>
</html>
