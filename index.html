function clamp(
  value,
  min,
  max
){

  return Math.max(
    min,
    Math.min(
      max,
      value
    )
  );

}


function safeNumber(
  value,
  fallback = 0
){

  const number =
    Number(value);

  return Number.isFinite(
    number
  )
    ? number
    : fallback;

}


function formatUsd(
  value
){

  value =
    safeNumber(value);

  const abs =
    Math.abs(value);

  if(abs >= 1000000){

    return (
      (value / 1000000)
        .toFixed(2) +
      "M"
    );

  }

  if(abs >= 1000){

    return (
      (value / 1000)
        .toFixed(1) +
      "K"
    );

  }

  return value.toFixed(0);

}


function formatPct(
  value
){

  value =
    safeNumber(value);

  return (
    value >= 0
      ? "+"
      : ""
  ) +
  value.toFixed(2) +
  "%";

}


function formatPrice(
  price,
  tickSize = 0
){

  price =
    safeNumber(price);

  if(
    !price
  ){

    return "0";

  }


  if(
    Number.isFinite(
      tickSize
    ) &&
    tickSize > 0
  ){

    const decimals =
      Math.max(
        0,
        Math.min(
          12,
          Math.ceil(
            -Math.log10(
              tickSize
            )
          )
        )
      );

    return price.toFixed(
      decimals
    );

  }


  if(price >= 1000){

    return price.toFixed(2);

  }

  if(price >= 1){

    return price.toFixed(4);

  }

  if(price >= 0.01){

    return price.toFixed(6);

  }

  return price.toPrecision(6);

}


function roundToTick(
  price,
  tickSize
){

  if(
    !Number.isFinite(price) ||
    !Number.isFinite(tickSize) ||
    tickSize <= 0
  ){

    return price;

  }

  return (
    Math.round(
      price / tickSize
    ) *
    tickSize
  );

}


function priceDistancePct(
  priceA,
  priceB
){

  if(
    !Number.isFinite(priceA) ||
    !Number.isFinite(priceB) ||
    priceB === 0
  ){

    return Infinity;

  }

  return (
    Math.abs(
      priceA - priceB
    ) /
    Math.abs(priceB)
  ) *
  100;

}

function cooldownActive(
  symbol,
  direction = null
){

  const item =
    cooldowns.get(
      symbol

  if(!item){

    return false;

  }


  if(
    item.until <=
    now()
  ){

    cooldowns.delete(
      symbol
    );

    return false;

  }


  if(
    direction &&
    item.direction &&
    item.direction !==
    direction
  ){

    return false;

  }


  return true;

}

  direction,
  duration

/* =========================================================
   SYMBOL FRESHNESS
   ========================================================= */

function isSymbolFresh(
  symbol
){

  const book =
    books.get(
      symbol
    );

  const health =
    symbolHealth.get(
      symbol
    );


  if(
    !book ||
    !health
  ){

    return false;

  }


  if(
    !book.valid
  ){

    return false;

  }


  const current =
    now();


  const bookFresh =
    current -
    health.lastBookRx <=
    CONFIG.SYMBOL_STALE_MS;


  const tradeFresh =
    current -
    health.lastTradeRx <=
    CONFIG.SYMBOL_STALE_MS;


  return (
    bookFresh &&
    tradeFresh
  );

}

function playSignalSound(
  direction
){

  try{

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;


    if(!AudioContext){

      return;

    }


    const context =
      new AudioContext();


    const oscillator =
      context.createOscillator();


    const gain =
      context.createGain();


    oscillator.connect(
      gain
    );

    gain.connect(
      context.destination
    );


    oscillator.type =
      "sine";


    oscillator.frequency.value =
      direction === "LONG"
        ? 720
        : 420;


    gain.gain.setValueAtTime(
      0.0001,
      context.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
      0.08,
      context.currentTime +
      0.01
    );


    gain.gain.exponentialRampToValueAtTime(
      0.0001,
      context.currentTime +
      0.18
    );


    oscillator.start();

    oscillator.stop(
      context.currentTime +
      0.2
    );

  }catch(error){

    if(
      CONFIG.DEBUG
    ){

      console.warn(
        "Sound error",
        error
      );

    }

  }

}

/* =========================================================
   REST REQUEST
   ========================================================= */

async function restGet(
  path,
  params = {},
  timeoutMs = 10000
){

  const url =
    new URL(
      REST_BASE + path
    );

  Object.entries(params)
    .forEach(
      ([key,value]) => {

        if(
          value !== undefined &&
          value !== null
        ){

          url.searchParams.set(
            key,
            String(value)
          );

        }

      }
    );


  const controller =
    new AbortController();

  const timer =
    setTimeout(
      () => controller.abort(),
      timeoutMs
    );


  try{

    const response =
      await fetch(
        url.toString(),
        {
          method:"GET",
          cache:"no-store",
          signal:
            controller.signal
        }
      );


    if(
      !response.ok
    ){

      throw new Error(
        `HTTP ${response.status}`
      );

    }


    const json =
      await response.json();


    if(
      json.retCode !== 0
    ){

      throw new Error(
        json.retMsg ||
        `Bybit error ${json.retCode}`
      );

    }


    return json.result;

  }finally{

    clearTimeout(
      timer
    );

  }

}


/* =========================================================

async function loadInstrumentInfo(){

  let cursor =
    "";

  let loaded =
    0;


  do{

    const params = {

      category:
        CONFIG.CATEGORY,

      limit:
        1000

    };


    if(cursor){

      params.cursor =
        cursor;

    }


    const result =
      await restGet(
        "/v5/market/instruments-info",
        params
      );


    const list =
      Array.isArray(
        result.list
      )
        ? result.list
        : [];


    for(
      const item of list
    ){

      if(
        item.status !==
        "Trading"
      ){

        continue;

      }


      if(
        item.contractType !==
        "LinearPerpetual"
      ){

        continue;

      }


      if(
        item.quoteCoin !==
        "USDT"
      ){

        continue;

      }


      const lot =
        item.lotSizeFilter ||
        {};

      const price =
        item.priceFilter ||
        {};


      const existing =
        marketMeta.get(
          item.symbol
        ) ||
        {};


      marketMeta.set(
        item.symbol,
        {

          ...existing,

          symbol:
            item.symbol,

          tickSize:
            safeNumber(
              price.tickSize
            ),

          qtyStep:
            safeNumber(
              lot.qtyStep
            ),

          minOrderQty:
            safeNumber(
              lot.minOrderQty
            ),

          maxOrderQty:
            safeNumber(
              lot.maxOrderQty
            ),

          maxOrderAmt:
            safeNumber(
              lot.maxOrderAmt
            ),

          status:
            item.status,

          contractType:
            item.contractType,

          quoteCoin:
            item.quoteCoin

        }
      );


      loaded++;

    }


    cursor =
      result.nextPageCursor ||
      "";

  }while(
    cursor
  );


  if(
    CONFIG.DEBUG
  ){

    console.log(
      "Instrument info loaded:",
      loaded
    );

  }


  return loaded;

}


/* =========================================================
   MARKET UNIVERSE
   ========================================================= */

async function loadUniverse(){

  const result =
    await restGet(
      "/v5/market/tickers",
      {
        category:
          CONFIG.CATEGORY
      }
    );


  const list =
    Array.isArray(
      result.list
    )
      ? result.list
      : [];


  const candidates =
    [];


  for(
    const item of list
  ){

    const symbol =
      item.symbol;


    if(
      !symbol ||
      !symbol.endsWith(
        "USDT"
      )
    ){

      continue;

    }


    if(
      CONFIG.EXCLUDED_SYMBOLS
        .has(symbol)
    ){

      continue;

    }


    const meta =
      marketMeta.get(
        symbol
      );


    if(
      !meta
    ){

      continue;

    }


    if(
      meta.status !==
      "Trading"
    ){

      continue;

    }


    const turnover =
      safeNumber(
        item.turnover24h
      );


    const lastPrice =
      safeNumber(
        item.lastPrice
      );


    if(
      turnover <= 0 ||
      lastPrice <= 0
    ){

      continue;

    }


    candidates.push({

      symbol,

      turnover24h:
        turnover,

      lastPrice,

      high24h:
        safeNumber(
          item.highPrice24h
        ),

      low24h:
        safeNumber(
          item.lowPrice24h
        ),

      volume24h:
        safeNumber(
          item.volume24h
        ),

      price24hPcnt:
        safeNumber(
          item.price24hPcnt
        )

    });

  }


  candidates.sort(
    (
      a,
      b
    ) =>
      b.turnover24h -
      a.turnover24h
  );


  marketUniverse =
    candidates
      .slice(
        0,
        CONFIG.TOP_SYMBOLS
      );


  /*
    Сохраняем rank и ticker
    в metadata.
  */

  marketUniverse
    .forEach(
      (
        item,
        index
      ) => {

        const meta =
          marketMeta.get(
            item.symbol
          ) ||
          {};


        marketMeta.set(
          item.symbol,
          {

            ...meta,

            symbol:
              item.symbol,

            rank:
              index + 1,

            turnover24h:
              item.turnover24h,

            lastPrice:
              item.lastPrice,

            high24h:
              item.high24h,

            low24h:
              item.low24h,

            volume24h:
              item.volume24h,

            price24hPcnt:
              item.price24hPcnt

          }
        );

      }
    );


  metrics.monitors =
    marketUniverse.length;


  if(
    CONFIG.DEBUG
  ){

    console.log(
      "Universe:",
      marketUniverse.map(
        x => x.symbol
      )
    );

  }


  return marketUniverse;

}


/* =========================================================
   INTERVAL HELPERS
   ========================================================= */

function intervalDurationMs(
  interval
){

  const value =
    String(
      interval
    );


  if(
    value === "1"
  ){

    return 60_000;

  }

  if(
    value === "3"
  ){

    return 3 * 60_000;

  }

  if(
    value === "5"
  ){

    return 5 * 60_000;

  }

  if(
    value === "15"
  ){

    return 15 * 60_000;

  }

  if(
    value === "30"
  ){

    return 30 * 60_000;

  }

  if(
    value === "60"
  ){

    return 60 * 60_000;

  }

  if(
    value === "120"
  ){

    return 2 * 60 * 60_000;

  }

  if(
    value === "240"
  ){

    return 4 * 60 * 60_000;

  }

  if(
    value === "360"
  ){

    return 6 * 60 * 60_000;

  }

  if(
    value === "720"
  ){

    return 12 * 60 * 60_000;

  }

  if(
    value === "D"
  ){

    return 24 * 60 * 60_000;

  }

  return 60_000;

}


/* =========================================================
   KLINE NORMALIZATION
   ========================================================= */

function normalizeKlines(
  raw,
  interval
){

  if(
    !Array.isArray(raw)
  ){

    return [];

  }


  const duration =
    intervalDurationMs(
      interval
    );


  const candles =
    raw
      .map(
        row => {

          if(
            !Array.isArray(
              row
            ) ||
            row.length < 7
          ){

            return null;

          }


          return {

            start:
              safeNumber(
                row[0]
              ),

            open:
              safeNumber(
                row[1]
              ),

            high:
              safeNumber(
                row[2]
              ),

            low:
              safeNumber(
                row[3]
              ),

            close:
              safeNumber(
                row[4]
              ),

            volume:
              safeNumber(
                row[5]
              ),

            turnover:
              safeNumber(
                row[6]
              ),

            end:
              safeNumber(
                row[0]
              ) +
              duration

          };

        }
      )
      .filter(Boolean)
      .sort(
        (
          a,
          b
        ) =>
          a.start -
          b.start
      );


  /*
    Последняя свеча может быть
    ещё незакрыта.

    Для HTF-структуры и ATR
    используем только закрытые свечи.
  */

  const current =
    now();


  return candles.filter(
    candle =>
      candle.end <=
      current
  );

}

/* =========================================================
   FRACTALS
   ========================================================= */

function extractFractals(
  candles,
  left = 2,
  right = 2
){

  const highs =
    [];

  const lows =
    [];


  if(
    !Array.isArray(
      candles
    ) ||
    candles.length <
      left +
      right +
      1
  ){

    return {
      highs,
      lows
    };

  }


  for(
    let i = left;
    i <
      candles.length -
      right;
    i++
  ){

    const current =
      candles[i];


    let highValid =
      true;

    let lowValid =
      true;


    for(
      let j = 1;
      j <= left;
      j++
    ){

      if(
        candles[i-j].high >=
        current.high
      ){

        highValid =
          false;

      }


      if(
        candles[i-j].low <=
        current.low
      ){

        lowValid =
          false;

      }

    }


    for(
      let j = 1;
      j <= right;
      j++
    ){

      if(
        candles[i+j].high >=
        current.high
      ){

        highValid =
          false;

      }


      if(
        candles[i+j].low <=
        current.low
      ){

        lowValid =
          false;

      }

    }


    if(
      highValid
    ){

      highs.push({

        price:
          current.high,

        time:
          current.start,

        index:
          i

      });

    }


    if(
      lowValid
    ){

      lows.push({

        price:
          current.low,

        time:
          current.start,

        index:
          i

      });

    }

  }


  return {
    highs,
    lows
  };

}


/* =========================================================
   ATR
   ========================================================= */

function calculateATR(
  candles,
  period = 14
){

  if(
    !Array.isArray(
      candles
    ) ||
    candles.length <
      period + 1
  ){

    return 0;

  }


  const trueRanges =
    [];


  for(
    let i = 1;
    i <
      candles.length;
    i++
  ){

    const current =
      candles[i];

    const previous =
      candles[i - 1];


    const tr =
      Math.max(

        current.high -
        current.low,

        Math.abs(
          current.high -
          previous.close
        ),

        Math.abs(
          current.low -
          previous.close
        )

      );


    trueRanges.push(
      tr
    );

  }


  if(
    trueRanges.length <
    period
  ){

    return 0;

  }


  let atr =
    trueRanges
      .slice(
        0,
        period
      )
      .reduce(
        (
          sum,
          value
        ) =>
          sum + value,
        0
      ) /
    period;


  /*
    Wilder-style smoothing.
  */

  for(
    let i = period;
    i <
      trueRanges.length;
    i++
  ){

    atr =
      (
        atr *
        (
          period - 1
        ) +
        trueRanges[i]
      ) /
      period;

  }


  return atr;

}


/* =========================================================
   ZONE CREATION
   ========================================================= */

function buildZones(
  candles,
  timeframe,
  maxZones = 12
){

  const fractals =
    extractFractals(
      candles,
      2,
      2
    );


  const zones =
    [];


  /*
    Swing highs -> resistance.
    Swing lows  -> support.
  */

  for(
    const point of
    fractals.highs
  ){

    zones.push({

      price:
        point.price,

      type:
        "RESISTANCE",

      timeframe,

      source:
        "FRACTAL",

      time:
        point.time,

      strength:
        1,

      touches:
        1

    });

  }


  for(
    const point of
    fractals.lows
  ){

    zones.push({

      price:
        point.price,

      type:
        "SUPPORT",

      timeframe,

      source:
        "FRACTAL",

      time:
        point.time,

      strength:
        1,

      touches:
        1

    });

  }


  /*
    Самые свежие зоны имеют
    больший вес.
  */

  zones.sort(
    (
      a,
      b
    ) =>
      b.time -
      a.time
  );


  return zones.slice(
    0,
    maxZones
  );

}


/* =========================================================
   MERGE HTF ZONES
   ========================================================= */

function mergeZones(
  zoneGroups,
  mergePct = 0.0018
){

  const merged =
    [];


  const sorted =
    zoneGroups
      .flat()
      .filter(
        zone =>
          Number.isFinite(
            zone.price
          ) &&
          zone.price > 0
      )
      .sort(
        (
          a,
          b
        ) =>
          a.price -
          b.price
      );


  for(
    const zone of sorted
  ){

    let target =
      null;


    for(
      const existing of
      merged
    ){

      if(
        existing.type !==
        zone.type
      ){

        continue;

      }


      const distance =
        Math.abs(
          existing.price -
          zone.price
        ) /
        existing.price;


      if(
        distance <=
        mergePct
      ){

        target =
          existing;

        break;

      }

    }


    if(
      !target
    ){

      merged.push({

        price:
          zone.price,

        type:
          zone.type,

        timeframes:
          [zone.timeframe],

        strength:
          1,

        touches:
          1,

        latestTime:
          zone.time

      });

      continue;

    }


    /*
      Weighted average.
    */

    const oldWeight =
      target.strength;

    const newWeight =
      oldWeight +
      1;


    target.price =
      (
        target.price *
        oldWeight +
        zone.price
      ) /
      newWeight;


    target.strength =
      newWeight;


    target.touches++;


    if(
      !target.timeframes
        .includes(
          zone.timeframe
        )
    ){

      target.timeframes.push(
        zone.timeframe
      );

    }


    target.latestTime =
      Math.max(
        target.latestTime,
        zone.time
      );

  }


  /*
    Чем больше HTF-конфлюэнс,
    тем выше сила зоны.
  */

  merged.forEach(
    zone => {

      zone.confluence =
        zone.timeframes.length;

    }
  );


  return merged;

}


/* =========================================================
   LOAD HTF DATA FOR ONE SYMBOL
   ========================================================= */

async function loadHTFForSymbol(
  symbol
){

  const [

    candles4H,
    candles1H,
    candles15M,
    candles5M

  ] =
    await Promise.all([

      loadKlines(
        symbol,
        "240",
        120
      ),

      loadKlines(
        symbol,
        "60",
        160
      ),

      loadKlines(
        symbol,
        "15",
        180
      ),

      loadKlines(
        symbol,
        "5",
        200
      )

    ]);


  if(
    !candles5M.length
  ){

    return null;

  }


  const zones4H =
    buildZones(
      candles4H,
      "4H",
      10
    );


  const zones1H =
    buildZones(
      candles1H,
      "1H",
      12
    );


  const zones15M =
    buildZones(
      candles15M,
      "15M",
      16
    );


  const zones =
    mergeZones(
      [
        zones4H,
        zones1H,
        zones15M
      ],
      0.0018
    );


  const atr5M =
    calculateATR(
      candles5M,
      14
    );


  const atr15M =
    calculateATR(
      candles15M,
      14
    );


  const meta =
    marketMeta.get(
      symbol
    );


  const currentPrice =
    safeNumber(
      meta?.lastPrice
    );


  const data = {

    symbol,

    currentPrice,

    atr5M,

    atr15M,

    candles5M,

    candles15M,

    candles1H,

    candles4H,

    fractals: {

      "4H":
        extractFractals(
          candles4H
        ),

      "1H":
        extractFractals(
          candles1H
        ),

      "15M":
        extractFractals(
          candles15M
        )

    },

    zones,

    updatedAt:
      now()

  };


  htfData.set(
    symbol,
    data
  );


  return data;

}


/* =========================================================
   REFRESH HTF DATA
   ========================================================= */

async function refreshHTF(){

  if(
    !marketUniverse.length
  ){

    return;

  }


  /*
    Не отправляем 80 REST-запросов
    одновременно.

    Пакетная загрузка снижает
    вероятность rate-limit.
  */

  const batchSize =
    5;


  for(
    let i = 0;
    i <
      marketUniverse.length;
    i += batchSize
  ){

    if(
      !scannerRunning
    ){

      break;

    }


    const batch =
      marketUniverse.slice(
        i,
        i + batchSize
      );


    await Promise.all(
      batch.map(
        item =>
          loadHTFForSymbol(
            item.symbol
          )
      )
    );


    await sleep(
      100
    );

  }

}


/* =========================================================
   NEAREST HTF ZONE
   ========================================================= */

function getNearestZone(
  symbol,
  price,
  type = null,
  direction = null
){

  const data =
    htfData.get(
      symbol
    );


  if(
    !data ||
    !Array.isArray(
      data.zones
    )
  ){

    return null;

  }


  const candidates =
    data.zones
      .filter(
        zone => {

          if(
            type &&
            zone.type !==
            type
          ){

            return false;

          }


          if(
            direction ===
            "LONG" &&
            zone.type ===
            "RESISTANCE"
          ){

            /*
              Для LONG сопротивление
              используется как TP,
              а не как входная зона.
            */

            return false;

          }


          if(
            direction ===
            "SHORT" &&
            zone.type ===
            "SUPPORT"
          ){

            /*
              Для SHORT поддержка
              используется как TP.
            */

            return false;

          }


          return true;

        }
      )
      .map(
        zone => ({

          zone,

          distance:
            Math.abs(
              zone.price -
              price
            )

        })
      )
      .sort(
        (
          a,
          b
        ) =>
          a.distance -
          b.distance
      );


  return candidates.length
    ? candidates[0].zone
    : null;

}


/* =========================================================
   FIND ZONES AROUND PRICE
   ========================================================= */

function getZonesAroundPrice(
  symbol,
  price,
  maxDistancePct = 1
){

  const data =
    htfData.get(
      symbol
    );


  if(
    !data
  ){

    return [];

  }


  return data.zones
    .filter(
      zone => {

        const distance =
          priceDistancePct(
            price,
            zone.price
          );


        return (
          distance <=
          maxDistancePct
        );

      }
    )
    .sort(
      (
        a,
        b
      ) =>
        Math.abs(
          a.price -
          price
        ) -
        Math.abs(
          b.price -
          price
        )
    );

}

    reconnectTimer:
      null,

    pingTimer:
      null,

    reconnectAttempts:
      0,

    lastRx:
      0,

    lastOpen:
      0,

    lastPong:
      0,

    manualClose:
      false,

    resyncing:
      new Set()

  };

}


/* =========================================================
   UPDATE SYMBOL HEALTH
   ========================================================= */

function touchBookHealth(
  symbol,
  data
){

  const health =
    symbolHealth.get(
      symbol
    );


  if(
    !health
  ){

    return;

  }


  const timestamp =
    now();


  health.lastBookRx =
    timestamp;

  health.lastBookTs =
    safeNumber(
      data?.cts,
      timestamp
    );

  health.bookValid =
    true;


  metrics.lastUpdate =
    timestamp;

}


function touchTradeHealth(
  symbol,
  exchangeTime
){

  const health =
    symbolHealth.get(
      symbol
    );


  if(
    !health
  ){

    return;

  }


  const timestamp =
    now();


  health.lastTradeRx =
    timestamp;

  health.lastTradeTs =
    safeNumber(
      exchangeTime,
      timestamp
    );


  metrics.lastUpdate =
    timestamp;

}


/* =========================================================
   BOOK FACTORY
   ========================================================= */

function ensureBook(
  symbol
){

  let book =
    books.get(
      symbol
    );


  if(
    book
  ){

    return book;

  }


  book = {

    bids:
      new Map(),

    asks:
      new Map(),

    lastPrice:
      safeNumber(
        marketMeta.get(
          symbol
        )?.lastPrice
      ),

    bestBid:
      0,

    bestAsk:
      0,

    spread:
      0,

    spreadPct:
      0,

    updateId:
      0,

    seq:
      0,

    valid:
      false,

    lastBookRx:
      0,

    lastBookTs:
      0,

    lastCts:
      0

  };


  books.set(
    symbol,
    book
  );


  return book;

}


/* =========================================================
   CLEAR BOOK
   ========================================================= */

function clearBook(
  symbol
){

  const book =
    ensureBook(
      symbol
    );


  book.bids.clear();

  book.asks.clear();

  book.bestBid =
    0;

  book.bestAsk =
    0;

  book.spread =
    0;

  book.spreadPct =
    0;

  book.updateId =
    0;

  book.seq =
    0;

  book.valid =
    false;

}


/* =========================================================
   APPLY BOOK LEVELS
   ========================================================= */

function applyBookLevels(
  map,
  levels
){

  if(
    !Array.isArray(
      levels
    )
  ){

    return;

  }


  for(
    const level of levels
  ){

    if(
      !Array.isArray(
        level
      ) ||
      level.length < 2
    ){

      continue;

    }


    const price =
      safeNumber(
        level[0]
      );

    const qty =
      safeNumber(
        level[1]
      );


    if(
      price <= 0
    ){

      continue;

    }


    /*
      Bybit delta:
      size = 0 -> delete
      size > 0 -> insert/update
    */

    if(
      qty <= 0
    ){

      map.delete(
        price
      );

    }else{

      map.set(
        price,
        qty
      );

    }

  }

}


/* =========================================================
   RECALCULATE BEST BID / ASK
   ========================================================= */

function recalculateBookTop(
  symbol
){

  const book =
    books.get(
      symbol
    );


  if(
    !book
  ){

    return;

  }


  let bestBid =
    0;

  let bestAsk =
    Infinity;


  for(
    const [
      price,
      qty
    ] of book.bids
  ){

    if(
      qty <= 0
    ){

      continue;

    }


    if(
      price >
      bestBid
    ){

      bestBid =
        price;

    }

  }


  for(
    const [
      price,
      qty
    ] of book.asks
  ){

    if(
      qty <= 0
    ){

      continue;

    }


    if(
      price <
      bestAsk
    ){

      bestAsk =
        price;

    }

  }


  if(
    !Number.isFinite(
      bestAsk
    )
  ){

    bestAsk =
      0;

  }


  book.bestBid =
    bestBid;

  book.bestAsk =
    bestAsk;


  if(
    bestBid > 0 &&
    bestAsk > 0 &&
    bestAsk >= bestBid
  ){

    book.spread =
      bestAsk -
      bestBid;


    const midpoint =
      (
        bestAsk +
        bestBid
      ) /
      2;


    book.spreadPct =
      midpoint > 0
        ? (
            book.spread /
            midpoint
          ) *
          100
        : 0;

  }else{

    book.spread =
      0;

    book.spreadPct =
      0;

  }


  if(
    bestBid > 0 &&
    bestAsk > 0
  ){

    book.lastPrice =
      (
        bestBid +
        bestAsk
      ) /
      2;

  }


  const meta =
    marketMeta.get(
      symbol
    );


  if(
    meta &&
    book.lastPrice > 0
  ){

    meta.lastPrice =
      book.lastPrice;

  }

}


/* =========================================================
   ORDERBOOK SNAPSHOT
   ========================================================= */

function handleOrderbookSnapshot(
  symbol,
  data
){

  if(
    !data
  ){

    return;

  }


  const book =
    ensureBook(
      symbol
    );


  /*
    Snapshot полностью
    заменяет локальную книгу.
  */

  book.bids.clear();

  book.asks.clear();


  applyBookLevels(
    book.bids,
    data.b
  );


  applyBookLevels(
    book.asks,
    data.a
  );


  book.updateId =
    safeNumber(
      data.u
    );


  book.seq =
    safeNumber(
      data.seq
    );


  book.lastCts =
    safeNumber(
      data.cts
    );


  book.valid =
    true;


  book.lastBookRx =
    now();

  book.lastBookTs =
    book.lastCts ||
    book.lastBookRx;


  recalculateBookTop(
    symbol
  );


  touchBookHealth(
    symbol,
    data
  );


  pendingScan.set(
    symbol,
    true
  );


  metrics.books =
    [...books.values()]
      .filter(
        item =>
          item.valid
      )
      .length;

}


/* =========================================================
   ORDERBOOK DELTA
   ========================================================= */

function handleOrderbookDelta(
  symbol,
  data
){

  if(
    !data
  ){

    return;

  }


  const book =
    ensureBook(
      symbol
    );


  /*
    Если snapshot ещё не получен,
    delta игнорируем.
  */

  if(
    !book.valid
  ){

    return;

  }


  const incomingU =
    safeNumber(
      data.u
    );


  const currentU =
    safeNumber(
      book.updateId
    );


  /*
    ВАЖНО:

    Не используем:
      incomingU === currentU + 1

    Bybit update ID не является
    обычным последовательным
    счётчиком каждого delta.

    Нас интересует монотонность
    update ID.
  */

  if(
    incomingU > 0 &&
    currentU > 0 &&
    incomingU < currentU
  ){

    return;

  }


  /*
    Если update ID равен текущему,
    повторное применение не нужно.
  */

  if(
    incomingU > 0 &&
    currentU > 0 &&
    incomingU === currentU
  ){

    return;

  }


  applyBookLevels(
    book.bids,
    data.b
  );


  applyBookLevels(
    book.asks,
    data.a
  );


  if(
    incomingU > 0
  ){

    book.updateId =
      incomingU;

  }


  if(
    Number.isFinite(
      Number(data.seq)
    )
  ){

    book.seq =
      safeNumber(
        data.seq
      );

  }


  book.lastCts =
    safeNumber(
      data.cts,
      book.lastCts
    );


  book.lastBookRx =
    now();

  book.lastBookTs =
    book.lastCts ||
    book.lastBookRx;


  recalculateBookTop(
    symbol
  );


  touchBookHealth(
    symbol,
    data
  );


  pendingScan.set(
    symbol,
    true
  );

}


/* =========================================================
   ORDERBOOK MESSAGE ROUTER
   ========================================================= */

function handleOrderbookMessage(
  message
){

  const topic =
    message?.topic;


  if(
    typeof topic !==
    "string"
  ){

    return;

  }


  if(
    !topic.startsWith(
      "orderbook."
    )
  ){

    return;

  }


  const symbol =
    topic.split(
      "."
    ).pop();


  if(
    !symbol
  ){

    return;

  }


  const type =
    message?.type ||
    message?.data?.type;


  const data =
    message?.data;


  if(
    type ===
    "snapshot"
  ){

    handleOrderbookSnapshot(
      symbol,
      data
    );

    return;

  }


  if(
    type ===
    "delta"
  ){

    handleOrderbookDelta(
      symbol,
      data
    );

  }

}


/* =========================================================
   SOCKET PING
   ========================================================= */

function startSocketPing(
  state
){

  if(
    state.pingTimer
  ){

    clearInterval(
      state.pingTimer
    );

  }


  state.pingTimer =
    setInterval(
      () => {

        if(
          !state.ws ||
          state.ws.readyState !==
          WebSocket.OPEN
        ){

          return;

        }


        try{

          state.ws.send(
            JSON.stringify({
              op:"ping"
            })
          );

        }catch(error){

          if(
            CONFIG.DEBUG
          ){

            console.warn(
              "Ping error:",
              state.id,
              error
            );

          }

        }

      },
      CONFIG.WS_PING_MS
    );

}


/* =========================================================
   STOP SOCKET PING
   ========================================================= */

function stopSocketPing(
  state
){

  if(
    state.pingTimer
  ){

    clearInterval(
      state.pingTimer
    );

    state.pingTimer =
      null;

  }

}


/* =========================================================
   SUBSCRIBE
   ========================================================= */

async function subscribeSocket(
  state
){

  if(
    !state.ws ||
    state.ws.readyState !==
    WebSocket.OPEN
  ){

    return;

  }


  const topics =
    [];


  for(
    const symbol of
    state.symbols
  ){

    topics.push(
      ...getSymbolTopics(
        symbol
      )
    );

  }


  /*
    Разбиваем подписку на
    небольшие пакеты.
  */

  for(
    let i = 0;
    i < topics.length;
    i += CONFIG.WS_SUBSCRIBE_BATCH
  ){

    if(
      !state.ws ||
      state.ws.readyState !==
      WebSocket.OPEN
    ){

      return;

    }


    const batch =
      topics.slice(
        i,
        i +
        CONFIG.WS_SUBSCRIBE_BATCH
      );


    try{

      state.ws.send(
        JSON.stringify({

          op:
            "subscribe",

          args:
            batch

        })
      );

    }catch(error){

      if(
        CONFIG.DEBUG
      ){

        console.warn(
          "Subscribe error:",
          state.id,
          error
        );

      }

      return;

    }


    await sleep(
      CONFIG.WS_SUBSCRIBE_DELAY_MS
    );

  }


  state.subscribed =
    true;

}


/* =========================================================
   RESUBSCRIBE ONE SYMBOL
   ========================================================= */

async function resubscribeSymbol(
  state,
  symbol,
  reason = "unknown"
){

  if(
    !state ||
    !symbol
  ){

    return;

  }


  if(
    state.resyncing.has(
      symbol
    )
  ){

    return;

  }


  state.resyncing.add(
    symbol
  );


  try{

    if(
      CONFIG.DEBUG
    ){

      console.warn(
        `Resync ${symbol}:`,
        reason
      );

    }


    const topics =
      getSymbolTopics(
        symbol
      );


    if(
      state.ws &&
      state.ws.readyState ===
      WebSocket.OPEN
    ){

      /*
        Удаляем локальное состояние
        до получения нового snapshot.
      */

      clearBook(
        symbol
      );


      const health =
        symbolHealth.get(
          symbol
        );


      if(
        health
      ){

        health.bookValid =
          false;

        health.sequenceErrors++;

        health.lastError =
          String(
            reason
          );

      }


      state.ws.send(
        JSON.stringify({

          op:
            "unsubscribe",

          args:
            topics

        })
      );


      await sleep(
        100
      );


      if(
        state.ws &&
        state.ws.readyState ===
        WebSocket.OPEN
      ){

        state.ws.send(
          JSON.stringify({

            op:
              "subscribe",

            args:
              topics

          })
        );

      }

    }

  }catch(error){

    if(
      CONFIG.DEBUG
    ){

      console.warn(
        "Resubscribe error:",
        symbol,
        error
      );

    }

  }finally{

    setTimeout(
      () => {

        state.resyncing.delete(
          symbol
        );

      },
      1000
    );

  }

}


/* =========================================================
   SOCKET MESSAGE
   ========================================================= */

function handleSocketMessage(
  state,
  raw
){

  state.lastRx =
    now();


  let message;


  try{

    message =
      JSON.parse(
        raw
      );

  }catch(error){

    return;

  }


  /*
    Pong / generic responses.
  */

  if(
    message?.op ===
    "pong"
  ){

    state.lastPong =
      now();

    return;

  }


  /*
    Subscription acknowledgement.
  */

  if(
    message?.op ===
    "subscribe"
  ){

    if(
      message.success
    ){

      state.subscribed =
        true;

    }

    return;

  }


  /*
    Orderbook.
  */

  if(
    typeof message?.topic ===
    "string" &&
    message.topic.startsWith(
      "orderbook."
    )
  ){

    handleOrderbookMessage(
      message
    );

    return;

  }


  /*
    Public trade будет обработан
    в следующей части.
  */

  if(
    typeof message?.topic ===
    "string" &&
    message.topic.startsWith(
      "publicTrade."
    )
  ){

    handleTradeMessage(
      message
    );

  }

}


/* =========================================================
   SOCKET OPEN
   ========================================================= */

async function handleSocketOpen(
  state
){

  state.connected =
    true;

  state.lastOpen =
    now();

  state.lastRx =
    now();

  state.reconnectAttempts =
    0;


  for(
    const symbol of
    state.symbols
  ){

    const health =
      symbolHealth.get(
        symbol
      );


    if(
      health
    ){

      health.reconnects++;

    }

  }


  startSocketPing(
    state
  );


  await subscribeSocket(
    state
  );


  setStatus(
    `WS подключен · ${state.symbols.length} монет`
  );

}


/* =========================================================
   SOCKET CLOSE
   ========================================================= */

function handleSocketClose(
  state
){

  state.connected =
    false;

  state.subscribed =
    false;


  stopSocketPing(
    state
  );


  if(
    state.manualClose
  ){

    return;

  }


  scheduleSocketReconnect(
    state
  );

}


/* =========================================================
   SOCKET ERROR
   ========================================================= */

function handleSocketError(
  state,
  error
){

  if(
    CONFIG.DEBUG
  ){

    console.warn(
      "WebSocket error:",
      state.id,
      error
    );

  }


  /*
    onclose обычно будет вызван
    следом. Здесь не создаём
    второй reconnect.
  */

}


/* =========================================================
   SOCKET RECONNECT
   ========================================================= */

function scheduleSocketReconnect(
  state
){

  if(
    !scannerRunning
  ){

    return;

  }


  if(
    state.reconnectTimer
  ){

    return;

  }


  const attempt =
    state.reconnectAttempts++;


  const delay =
    Math.min(

      CONFIG.RECONNECT_MAX_MS,

      CONFIG.RECONNECT_BASE_MS *
      Math.pow(
        2,
        Math.min(
          attempt,
          4
        )
      )

    );


  state.reconnectTimer =
    setTimeout(
      () => {

        state.reconnectTimer =
          null;

        connectSocket(
          state
        );

      },
      delay
    );

}


/* =========================================================
   CONNECT SOCKET
   ========================================================= */

function connectSocket(
  state
){

  if(
    !scannerRunning
  ){

    return;

  }


  if(
    state.ws
  ){

    try{

      state.manualClose =
        true;

      state.ws.close();

    }catch(error){}

  }


  state.manualClose =
    false;

  state.connected =
    false;

  state.subscribed =
    false;


  try{

    const ws =
      new WebSocket(
        WS_URL
      );


    state.ws =
      ws;


    ws.onopen =
      () => {

        handleSocketOpen(
          state
        );

      };


    ws.onmessage =
      event => {

        handleSocketMessage(
          state,
          event.data
        );

      };


    ws.onerror =
      error => {

        handleSocketError(
          state,
          error
        );

      };


    ws.onclose =
      () => {

        handleSocketClose(
          state
        );

      };

  }catch(error){

    if(
      CONFIG.DEBUG
    ){

      console.warn(
        "WebSocket create error:",
        error
      );

    }


    scheduleSocketReconnect(
      state
    );

  }

}


/* =========================================================
   CLOSE SOCKET
   ========================================================= */

function closeSocket(
  state
){

  if(
    !state
  ){

    return;

  }


  state.manualClose =
    true;


  if(
    state.reconnectTimer
  ){

    clearTimeout(
      state.reconnectTimer
    );

    state.reconnectTimer =
      null;

  }


  stopSocketPing(
    state
  );


  if(
    state.ws
  ){

    try{

      state.ws.close();

    }catch(error){}

  }


  state.ws =
    null;

  state.connected =
    false;

  state.subscribed =
    false;

}


/* =========================================================
   CONNECT ALL SOCKETS
   ========================================================= */

function connectAllSockets(){

  /*
    Очищаем старые sockets.
  */

  for(
    const state of
    sockets
  ){

    closeSocket(
      state
    );

  }


  sockets.length =
    0;


  const symbols =
    marketUniverse.map(
      item =>
        item.symbol
    );


  const groups =
    splitIntoSocketGroups(
      symbols
    );


  groups.forEach(
    (
      group,
      index
    ) => {

      const state =
        createSocketState(
          group,
          index
        );


      sockets.push(
        state
      );


      /*
        Небольшая задержка между
        соединениями снижает
        вероятность burst.
      */

      setTimeout(
        () => {

          if(
            scannerRunning
          ){

            connectSocket(
              state
            );

          }

        },
        index * 150
      );

    }
  );


  setStatus(
    `Подключение WS · ${symbols.length} монет`
  );

}


/* =========================================================
   CLOSE ALL SOCKETS
   ========================================================= */

function closeAllSockets(){

  for(
    const state of
    sockets
  ){

    closeSocket(
      state
    );

  }


  sockets.length =
    0;

}


/* =========================================================
   SOCKET HEALTH
   ========================================================= */

function checkSocketHealth(){

  if(
    !scannerRunning
  ){

    return;

  }


  const timestamp =
    now();


  for(
    const state of
    sockets
  ){

    if(
      !state.connected
    ){

      continue;

    }


    const age =
      timestamp -
      state.lastRx;


    if(
      age >
      CONFIG.WS_STALE_MS
    ){

      if(
        CONFIG.DEBUG
      ){

        console.warn(
          `WS stale: ${state.id}`,
          age
        );

      }


      try{

        state.ws?.close();

      }catch(error){}

    }

  }

}


/* =========================================================
   SYMBOL FRESHNESS CHECK
   ========================================================= */

function checkSymbolHealth(){

  const timestamp =
    now();


  let freshBooks =
    0;

  let freshTrades =
    0;


  for(
    const symbol of
    marketUniverse.map(
      item =>
        item.symbol
    )
  ){

    const health =
      symbolHealth.get(
        symbol
      );


    if(
      !health
    ){

      continue;

    }


    if(
      timestamp -
      health.lastBookRx <=
      CONFIG.SYMBOL_STALE_MS &&
      health.bookValid
    ){

      freshBooks++;

    }


    if(
      timestamp -
      health.lastTradeRx <=
      CONFIG.SYMBOL_STALE_MS
    ){

      freshTrades++;

    }

  }


  metrics.books =
    freshBooks;


  metrics.flow =
    freshTrades;

}


/* =========================================================
   GLOBAL RECONNECT CHECK
   ========================================================= */

function requestReconnectCheck(){

  if(
    !scannerRunning
  ){

    return;

  }


  for(
    const state of
    sockets
  ){

    if(
      !state.connected
    ){

      scheduleSocketReconnect(
        state
      );

    }

  }

}


/* =========================================================
   INITIALIZE WEBSOCKETS
   ========================================================= */

function initializeWebSockets(){

  if(
    !marketUniverse.length
  ){

    return;

  }


  connectAllSockets();

}


/* =========================================================
   WINDOW UNLOAD
   ========================================================= */

window.addEventListener(
  "beforeunload",
  () => {

    for(
      const state of
      sockets
    ){

      closeSocket(
        state
      );

    }

  }
);

/* =========================================================
   ORDERBOOK ARRAY HELPERS
   ========================================================= */

function getBookSideLevels(
  symbol,
  side,
  maxDistance = CONFIG.ORDERBOOK_RANGE
){

  const book =
    books.get(
      symbol
    );


  if(
    !book ||
    !book.valid
  ){

    return [];

  }


  const price =
    book.lastPrice;


  if(
    !Number.isFinite(price) ||
    price <= 0
  ){

    return [];

  }


  const map =
    side === "BID"
      ? book.bids
      : book.asks;


  const levels =
    [];


  for(
    const [
      levelPrice,
      qty
    ] of map
  ){

    if(
      !Number.isFinite(
        levelPrice
      ) ||
      !Number.isFinite(
        qty
      ) ||
      levelPrice <= 0 ||
      qty <= 0
    ){

      continue;

    }


    const distance =
      Math.abs(
        levelPrice -
        price
      ) /
      price;


    if(
      distance >
      maxDistance
    ){

      continue;

    }


    const usd =
      levelPrice *
      qty;


    if(
      usd <= 0
    ){

      continue;

    }


    levels.push({

      price:
        levelPrice,

      qty,

      usd,

      distance,

      distancePct:
        distance * 100,

      side

    });

  }


  levels.sort(
    (
      a,
      b
    ) =>
      side === "BID"
        ? b.price - a.price
        : a.price - b.price
  );


  return levels;

}


/* =========================================================
   LOCAL LIQUIDITY
   ========================================================= */

function calculateLocalLiquidity(
  symbol,
  side
){

  const levels =
    getBookSideLevels(
      symbol,
      side,
      CONFIG.ORDERBOOK_RANGE
    );


  if(
    !levels.length
  ){

    return {

      levels: [],

      medianUsd: 0,

      meanUsd: 0,

      topUsd: 0,

      totalUsd: 0,

      count: 0

    };

  }


  const values =
    levels
      .map(
        level =>
          level.usd
      )
      .sort(
        (
          a,
          b
        ) =>
          a - b
      );


  const total =
    values.reduce(
      (
        sum,
        value
      ) =>
        sum + value,
      0
    );


  const mean =
    values.length
      ? total /
        values.length
      : 0;


  const middle =
    Math.floor(
      values.length / 2
    );


  const median =
    values.length % 2
      ? values[middle]
      : (
          values[middle - 1] +
          values[middle]
        ) / 2;


  return {

    levels,

    medianUsd:
      median,

    meanUsd:
      mean,

    topUsd:
      values.length
        ? values[values.length - 1]
        : 0,

    totalUsd:
      total,

    count:
      values.length

  };

}


/* =========================================================
   LOCAL LIQUIDITY BOTH SIDES
   ========================================================= */

function getLocalLiquidity(
  symbol
){

  const bids =
    calculateLocalLiquidity(
      symbol,
      "BID"
    );


  const asks =
    calculateLocalLiquidity(
      symbol,
      "ASK"
    );


  return {

    bids,

    asks,

    combinedMedian:
      (
        bids.medianUsd +
        asks.medianUsd
      ) / 2,

    combinedMean:
      (
        bids.meanUsd +
        asks.meanUsd
      ) / 2

  };

}


/* =========================================================
   ADAPTIVE WALL THRESHOLD
   ========================================================= */

function getAdaptiveWallThreshold(
  symbol,
  side = null
){

  const meta =
    marketMeta.get(
      symbol
    );


  const liquidity =
    getLocalLiquidity(
      symbol
    );


  /*
    Базовый уровень зависит
    от ликвидности конкретной
    монеты.

    Мы не используем один
    фиксированный $250k для
    всего рынка.
  */

  const localMedian =
    liquidity.combinedMedian;


  const localMean =
    liquidity.combinedMean;


  const turnover =
    safeNumber(
      meta?.turnover24h
    );


  /*
    Минимальный порог от
    оборота монеты.

    Для мелких альтов он
    остаётся значительно ниже,
    чем для крупных монет.
  */

  const turnoverComponent =
    turnover *
    0.0000125;


  /*
    Wall должен быть заметно
    крупнее обычного уровня
    книги.
  */

  const localComponent =
    Math.max(
      localMedian * 4.5,
      localMean * 3.0
    );


  /*
    Для совсем пустой книги
    нужен небольшой абсолютный
    floor.
  */

  const absoluteFloor =
    15000;


  let threshold =
    Math.max(
      absoluteFloor,
      turnoverComponent,
      localComponent
    );


  /*
    Для очень крупных монет
    сохраняем более высокий
    абсолютный минимум.
  */

  if(
    turnover >= 5_000_000_000
  ){

    threshold =
      Math.max(
        threshold,
        750000
      );

  }else if(
    turnover >= 1_000_000_000
  ){

    threshold =
      Math.max(
        threshold,
        400000
      );

  }else if(
    turnover >= 300_000_000
  ){

    threshold =
      Math.max(
        threshold,
        200000
      );

  }else if(
    turnover >= 100_000_000
  ){

    threshold =
      Math.max(
        threshold,
        100000
      );

  }


  return threshold;

}


/* =========================================================
   WALL RATIO
   ========================================================= */

function calculateWallRatio(
  levelUsd,
  symbol
){

  const liquidity =
    getLocalLiquidity(
      symbol
    );


  const baseline =
    Math.max(
      liquidity.combinedMedian,
      1
    );


  return (
    levelUsd /
    baseline
  );

}


/* =========================================================
   PRICE BUCKET
   ========================================================= */

function getWallBucket(
  symbol,
  price
){

  const meta =
    marketMeta.get(
      symbol
    );


  const tick =
    safeNumber(
      meta?.tickSize
    );


  /*
    Не используем точную цену
    как identity стены.

    Крупная заявка может
    переместиться на несколько
    тиков и всё равно быть
    той же ликвидностью.
  */

  const bucketSize =
    Math.max(

      tick > 0
        ? tick * 8
        : 0,

      price *
      0.00015

    );


  if(
    bucketSize <= 0
  ){

    return price;

  }


  return (
    Math.round(
      price /
      bucketSize
    ) *
    bucketSize
  );

}


/* =========================================================
   WALL KEY
   ========================================================= */

function getWallKey(
  symbol,
  side,
  price
){

  const bucket =
    getWallBucket(
      symbol,
      price
    );


  return (
    symbol +
    ":" +
    side +
    ":" +
    bucket.toPrecision(12)
  );

}


/* =========================================================
   CLUSTER BOOK LEVELS
   ========================================================= */

function buildPriceClusters(
  symbol,
  side
){

  const levels =
    getBookSideLevels(
      symbol,
      side,
      CONFIG.WALL_MAX_DISTANCE
    );


  if(
    !levels.length
  ){

    return [];

  }


  const meta =
    marketMeta.get(
      symbol
    );


  const tick =
    safeNumber(
      meta?.tickSize
    );


  const price =
    books.get(
      symbol
    )?.lastPrice;


  if(
    !price
  ){

    return [];

  }


  const clusterDistance =
    Math.max(

      tick > 0
        ? tick * 12
        : 0,

      price *
      0.00025

    );


  const clusters =
    [];


  for(
    const level of levels
  ){

    let cluster =
      null;


    for(
      const candidate of
      clusters
    ){

      if(
        Math.abs(
          candidate.centerPrice -
          level.price
        ) <=
        clusterDistance
      ){

        cluster =
          candidate;

        break;

      }

    }


    if(
      !cluster
    ){

      cluster = {

        side,

        centerPrice:
          level.price,

        totalUsd:
          0,

        maxUsd:
          0,

        maxPrice:
          level.price,

        levels: [],

        firstDistance:
          level.distance

      };


      clusters.push(
        cluster
      );

    }


    cluster.totalUsd +=
      level.usd;


    cluster.levels.push(
      level
    );


    if(
      level.usd >
      cluster.maxUsd
    ){

      cluster.maxUsd =
        level.usd;

      cluster.maxPrice =
        level.price;

    }


    cluster.centerPrice =
      cluster.levels
        .reduce(
          (
            sum,
            item
          ) =>
            sum + item.price,
          0
        ) /
      cluster.levels.length;

  }


  return clusters
    .map(
      cluster => {

        const localValues =
          cluster.levels
            .map(
              level =>
                level.usd
            );


        const maxUsd =
          cluster.maxUsd;


        const totalUsd =
          cluster.totalUsd;


        const concentration =
          totalUsd > 0
            ? maxUsd /
              totalUsd
            : 0;


        const ratio =
          calculateWallRatio(
            maxUsd,
            symbol
          );


        return {

          ...cluster,

          maxUsd,

          totalUsd,

          concentration,

          ratio,

          distance:
            cluster.firstDistance,

          distancePct:
            cluster.firstDistance *
            100

        };

      }
    )
    .sort(
      (
        a,
        b
      ) =>
        b.maxUsd -
        a.maxUsd
    );

}


/* =========================================================
   FIND WALL CANDIDATES
   ========================================================= */

function findWallCandidates(
  symbol,
  side
){

  const clusters =
    buildPriceClusters(
      symbol,
      side
    );


  if(
    !clusters.length
  ){

    return [];

  }


  const threshold =
    getAdaptiveWallThreshold(
      symbol,
      side
    );


  return clusters
    .filter(
      cluster => {

        if(
          cluster.maxUsd <
          threshold
        ){

          return false;

        }


        if(
          cluster.distance >
          CONFIG.WALL_MAX_DISTANCE
        ){

          return false;

        }


        if(
          cluster.concentration <
          CONFIG.MIN_CONCENTRATION
        ){

          return false;

        }


        return true;

      }
    )
    .map(
      cluster => ({

        symbol,

        side,

        price:
          cluster.maxPrice,

        centerPrice:
          cluster.centerPrice,

        usd:
          cluster.maxUsd,

        totalUsd:
          cluster.totalUsd,

        ratio:
          cluster.ratio,

        concentration:
          cluster.concentration,

        distance:
          cluster.distance,

        distancePct:
          cluster.distancePct,

        threshold,

        bucket:
          getWallBucket(
            symbol,
            cluster.maxPrice
          ),

        key:
          getWallKey(
            symbol,
            side,
            cluster.maxPrice
          )

      })
    );

}


/* =========================================================
   ALL WALL CANDIDATES
   ========================================================= */

function detectWalls(
  symbol
){

  const bids =
    findWallCandidates(
      symbol,
      "BID"
    );


  const asks =
    findWallCandidates(
      symbol,
      "ASK"
    );


  return {

    bids,

    asks,

    all:
      [
        ...bids,
        ...asks
      ]

  };

}


/* =========================================================
   PATH LIQUIDITY
   ========================================================= */

function calculatePathLiquidity(
  symbol,
  direction,
  targetPrice
){

  const book =
    books.get(
      symbol
    );


  if(
    !book ||
    !book.valid ||
    !Number.isFinite(
      targetPrice
    )
  ){

    return {

      levels:
        0,

      totalUsd:
        0,

      averageUsd:
        0,

      maxUsd:
        0

    };

  }


  const current =
    book.lastPrice;


  const map =
    direction === "LONG"
      ? book.asks
      : book.bids;


  const values =
    [];


  for(
    const [
      price,
      qty
    ] of map
  ){

    if(
      qty <= 0
    ){

      continue;

    }


    if(
      direction === "LONG"
    ){

      if(
        price <= current ||
        price >= targetPrice
      ){

        continue;

      }

    }else{

      if(
        price >= current ||
        price <= targetPrice
      ){

        continue;

      }

    }


    values.push(
      price * qty
    );

  }


  if(
    !values.length
  ){

    return {

      levels:
        0,

      totalUsd:
        0,

      averageUsd:
        0,

      maxUsd:
        0

    };

  }


  const total =
    values.reduce(
      (
        sum,
        value
      ) =>
        sum + value,
      0
    );


  return {

    levels:
      values.length,

    totalUsd:
      total,

    averageUsd:
      total /
      values.length,

    maxUsd:
      Math.max(
        ...values
      )

  };

}


/* =========================================================
   LIQUIDITY IMBALANCE
   ========================================================= */

function calculateBookImbalance(
  symbol,
  range = CONFIG.ORDERBOOK_RANGE
){

  const bids =
    getBookSideLevels(
      symbol,
      "BID",
      range
    );


  const asks =
    getBookSideLevels(
      symbol,
      "ASK",
      range
    );


  const bidUsd =
    bids.reduce(
      (
        sum,
        item
      ) =>
        sum + item.usd,
      0
    );


  const askUsd =
    asks.reduce(
      (
        sum,
        item
      ) =>
        sum + item.usd,
      0
    );


  const total =
    bidUsd +
    askUsd;


  const imbalance =
    total > 0
      ? (
          bidUsd -
          askUsd
        ) /
        total
      : 0;


  return {

    bidUsd,

    askUsd,

    totalUsd:
      total,

    imbalance

  };

}


/* =========================================================
   BEST WALL
   ========================================================= */

function getBestWall(
  symbol,
  direction
){

  const side =
    direction === "LONG"
      ? "BID"
      : "ASK";


  const walls =
    findWallCandidates(
      symbol,
      side
    );


  if(
    !walls.length
  ){

    return null;

  }


  const book =
    books.get(
      symbol
    );


  if(
    !book
  ){

    return null;

  }


  /*
    Для LONG нужна поддержка
    ниже текущей цены.

    Для SHORT нужен resistance
    выше текущей цены.
  */

  const valid =
    walls.filter(
      wall => {

        if(
          direction === "LONG"
        ){

          return (
            wall.price <
            book.lastPrice
          );

        }


        return (
          wall.price >
          book.lastPrice
        );

      }
    );


  if(
    !valid.length
  ){

    return null;

  }


  valid.sort(
    (
      a,
      b
    ) => {

      /*
        Сначала ближе к цене,
        затем сильнее.
      */

      const distanceA =
        Math.abs(
          a.price -
          book.lastPrice
        );


      const distanceB =
        Math.abs(
          b.price -
          book.lastPrice
        );


      if(
        distanceA !==
        distanceB
      ){

        return (
          distanceA -
          distanceB
        );

      }


      return (
        b.usd -
        a.usd
      );

    }
  );


  return valid[0];

}


/* =========================================================
   WALL SNAPSHOT
   ========================================================= */

function getWallSnapshot(
  symbol
){

  const detected =
    detectWalls(
      symbol
    );


  return {

    symbol,

    bids:
      detected.bids,

    asks:
      detected.asks,

    bestBidWall:
      detected.bids[0] ||
      null,

    bestAskWall:
      detected.asks[0] ||
      null,

    count:
      detected.all.length

  };

}


/* =========================================================
   WALL METRICS
   ========================================================= */

function calculateWallQuality(
  wall
){

  if(
    !wall
  ){

    return 0;

  }


  const ratioScore =
    clamp(
      (
        wall.ratio -
        3
      ) /
      7,
      0,
      1
    );


  const concentrationScore =
    clamp(
      (
        wall.concentration -
        0.5
      ) /
      0.5,
      0,
      1
    );


  const distanceScore =
    clamp(
      1 -
      (
        wall.distance /
        CONFIG.WALL_MAX_DISTANCE
      ),
      0,
      1
    );


  return (
    ratioScore *
    0.45 +
    concentrationScore *
    0.35 +
    distanceScore *
    0.20
  );

}


/* =========================================================
   WALL SCAN METRICS
   ========================================================= */

function updateWallMetrics(){

  let count =
    0;


  for(
    const symbol of
    marketUniverse.map(
      item =>
        item.symbol
    )
  ){

    const result =
      detectWalls(
        symbol
      );


    count +=
      result.all.length;

  }


  metrics.walls =
    count;


  return count;

}

/* =========================================================
   TRADE BUFFER
   ========================================================= */

function ensureTradeBuffer(
  symbol
){

  let buffer =
    trades.get(
      symbol
    );


  if(
    !buffer
  ){

    buffer =
      [];

    trades.set(
      symbol,
      buffer
    );

  }


  return buffer;

}


/* =========================================================
   TRADE ID
   ========================================================= */

function getTradeId(
  trade,
  symbol
){

  if(
    trade?.i
  ){

    return String(
      trade.i
    );

  }


  return [
    symbol,
    trade?.T || 0,
    trade?.p || 0,
    trade?.v || 0,
    trade?.S || "",
    Math.random()
      .toString(36)
      .slice(2,8)
  ].join(
    ":"
  );

}


/* =========================================================
   HANDLE PUBLIC TRADE MESSAGE
   ========================================================= */

function handleTradeMessage(
  message
){

  const topic =
    message?.topic;


  if(
    typeof topic !==
    "string" ||
    !topic.startsWith(
      "publicTrade."
    )
  ){

    return;

  }


  const symbol =
    topic.split(
      "."
    ).pop();


  if(
    !symbol
  ){

    return;

  }


  const list =
    Array.isArray(
      message?.data
    )
      ? message.data
      : [];


  if(
    !list.length
  ){

    return;

  }


  const buffer =
    ensureTradeBuffer(
      symbol
    );


  const receivedTime =
    now();


  for(
    const trade of list
  ){

    const price =
      safeNumber(
        trade?.p
      );


    const qty =
      safeNumber(
        trade?.v
      );


    if(
      price <= 0 ||
      qty <= 0
    ){

      continue;

    }


    const exchangeTime =
      safeNumber(
        trade?.T,
        receivedTime
      );


    const side =
      String(
        trade?.S || ""
      ).toUpperCase();


    /*
      Bybit publicTrade:
      S = taker side.

      Buy  -> aggressive buyer
      Sell -> aggressive seller
    */

    if(
      side !== "Buy" &&
      side !== "Sell"
    ){

      continue;

    }


    const usd =
      price *
      qty;


    buffer.push({

      id:
        getTradeId(
          trade,
          symbol
        ),

      price,

      qty,

      usd,

      side,

      exchangeTime,

      receivedTime,

      seq:
        safeNumber(
          trade?.seq
        )

    });

  }


  /*
    Удаляем слишком старые
    сделки.

    FLOW_WINDOW_MS используется
    как рабочее окно, но держим
    небольшой запас для
    расчёта baseline.
  */

  const cutoff =
    receivedTime -
    Math.max(
      CONFIG.FLOW_WINDOW_MS * 3,
      60000
    );


  let firstValid =
    0;


  while(
    firstValid <
    buffer.length &&
    buffer[firstValid]
      .receivedTime <
      cutoff
  ){

    firstValid++;

  }


  if(
    firstValid > 0
  ){

    buffer.splice(
      0,
      firstValid
    );

  }


  /*
    Жёсткий лимит памяти.
  */

  if(
    buffer.length >
    CONFIG.MAX_TRADES_PER_SYMBOL
  ){

    buffer.splice(
      0,
      buffer.length -
      CONFIG.MAX_TRADES_PER_SYMBOL
    );

  }


  touchTradeHealth(
    symbol,
    list[list.length - 1]?.T
  );


  pendingScan.set(
    symbol,
    true
  );

}


/* =========================================================
   GET RECENT TRADES
   ========================================================= */

function getRecentTrades(
  symbol,
  windowMs = CONFIG.FLOW_WINDOW_MS
){

  const buffer =
    trades.get(
      symbol
    );


  if(
    !buffer ||
    !buffer.length
  ){

    return [];

  }


  const current =
    now();


  const cutoff =
    current -
    windowMs;


  /*
    Основной timestamp —
    время получения.

    Exchange timestamp используется
    отдельно для latency/quality.
  */

  return buffer.filter(
    trade =>
      trade.receivedTime >=
      cutoff
  );

}


/* =========================================================
   FLOW STATISTICS
   ========================================================= */

function calculateFlow(
  symbol,
  windowMs = CONFIG.FLOW_WINDOW_MS
){

  const recent =
    getRecentTrades(
      symbol,
      windowMs
    );


  let buyUsd =
    0;

  let sellUsd =
    0;

  let buyCount =
    0;

  let sellCount =
    0;


  let buyQty =
    0;

  let sellQty =
    0;


  let minPrice =
    Infinity;

  let maxPrice =
    0;


  let firstPrice =
    0;

  let lastPrice =
    0;


  if(
    recent.length
  ){

    firstPrice =
      recent[0].price;

    lastPrice =
      recent[
        recent.length - 1
      ].price;

  }


  for(
    const trade of recent
  ){

    if(
      trade.side ===
      "Buy"
    ){

      buyUsd +=
        trade.usd;

      buyQty +=
        trade.qty;

      buyCount++;

    }else if(
      trade.side ===
      "Sell"
    ){

      sellUsd +=
        trade.usd;

      sellQty +=
        trade.qty;

      sellCount++;

    }


    if(
      trade.price <
      minPrice
    ){

      minPrice =
        trade.price;

    }


    if(
      trade.price >
      maxPrice
    ){

      maxPrice =
        trade.price;

    }

  }


  const totalUsd =
    buyUsd +
    sellUsd;


  const netUsd =
    buyUsd -
    sellUsd;


  const imbalance =
    totalUsd > 0
      ? netUsd /
        totalUsd
      : 0;


  const buyRatio =
    totalUsd > 0
      ? buyUsd /
        totalUsd
      : 0;


  const sellRatio =
    totalUsd > 0
      ? sellUsd /
        totalUsd
      : 0;


  const priceMovePct =
    firstPrice > 0 &&
    lastPrice > 0
      ? (
          (
            lastPrice -
            firstPrice
          ) /
          firstPrice
        ) *
        100
      : 0;


  const rangePct =
    minPrice < Infinity &&
    maxPrice > 0
      ? (
          (
            maxPrice -
            minPrice
          ) /
          minPrice
        ) *
        100
      : 0;


  return {

    trades:
      recent,

    tradeCount:
      recent.length,

    buyUsd,

    sellUsd,

    totalUsd,

    netUsd,

    imbalance,

    buyRatio,

    sellRatio,

    buyCount,

    sellCount,

    buyQty,

    sellQty,

    firstPrice,

    lastPrice,

    minPrice:
      minPrice === Infinity
        ? 0
        : minPrice,

    maxPrice,

    priceMovePct,

    rangePct,

    windowMs

  };

}


/* =========================================================
   FLOW BASELINE
   ========================================================= */

function calculateFlowBaseline(
  symbol
){

  const buffer =
    trades.get(
      symbol
    );


  if(
    !buffer ||
    buffer.length < 5
  ){

    return {

      samples:
        0,

      avgUsd:
        0,

      medianUsd:
        0,

      avgImbalance:
        0

    };

  }


  /*
    Разбиваем последние сделки
    на короткие buckets.

    Это позволяет определить,
    действительно ли текущий flow
    необычный для конкретной
    монеты.
  */

  const bucketMs =
    5000;


  const current =
    now();


  const buckets =
    new Map();


  for(
    const trade of buffer
  ){

    const age =
      current -
      trade.receivedTime;


    if(
      age < 0 ||
      age > 120000
    ){

      continue;

    }


    const bucket =
      Math.floor(
        trade.receivedTime /
        bucketMs
      );


    let item =
      buckets.get(
        bucket
      );


    if(
      !item
    ){

      item = {

        buyUsd:
          0,

        sellUsd:
          0,

        totalUsd:
          0

      };


      buckets.set(
        bucket,
        item
      );

    }


    item.totalUsd +=
      trade.usd;


    if(
      trade.side ===
      "Buy"
    ){

      item.buyUsd +=
        trade.usd;

    }else{

      item.sellUsd +=
        trade.usd;

    }

  }


  const samples =
    [...buckets.values()]
      .filter(
        bucket =>
          bucket.totalUsd >
          0
      );


  if(
    !samples.length
  ){

    return {

      samples:
        0,

      avgUsd:
        0,

      medianUsd:
        0,

      avgImbalance:
        0

    };

  }


  const volumes =
    samples
      .map(
        bucket =>
          bucket.totalUsd
      )
      .sort(
        (
          a,
          b
        ) =>
          a - b
      );


  const avgUsd =
    volumes.reduce(
      (
        sum,
        value
      ) =>
        sum + value,
      0
    ) /
    volumes.length;


  const middle =
    Math.floor(
      volumes.length / 2
    );


  const medianUsd =
    volumes.length % 2
      ? volumes[middle]
      : (
          volumes[middle - 1] +
          volumes[middle]
        ) / 2;


  const avgImbalance =
    samples.reduce(
      (
        sum,
        bucket
      ) => {

        const imbalance =
          bucket.totalUsd > 0
            ? (
                bucket.buyUsd -
                bucket.sellUsd
              ) /
              bucket.totalUsd
            : 0;

        return (
          sum +
          imbalance
        );

      },
      0
    ) /
    samples.length;


  return {

    samples:
      samples.length,

    avgUsd,

    medianUsd,

    avgImbalance

  };

}


/* =========================================================
   FLOW INTENSITY
   ========================================================= */

function calculateFlowIntensity(
  symbol,
  flow
){

  if(
    !flow ||
    flow.totalUsd <= 0
  ){

    return {

      intensity:
        0,

      baseline:
        0,

      ratio:
        0

    };

  }


  const baseline =
    calculateFlowBaseline(
      symbol
    );


  if(
    baseline.medianUsd <= 0
  ){

    return {

      intensity:
        0,

      baseline:
        baseline.medianUsd,

      ratio:
        0

    };

  }


  const ratio =
    flow.totalUsd /
    baseline.medianUsd;


  /*
    Нормализованный intensity.

    1.0 = примерно baseline
    2.0 = сильнее baseline
    3.0+ = очень активный flow
  */

  const intensity =
    clamp(
      (
        ratio - 1
      ) /
      3,
      0,
      1
    );


  return {

    intensity,

    baseline:
      baseline.medianUsd,

    ratio

  };

}


/* =========================================================
   NORMALIZED FLOW
   ========================================================= */

function calculateNormalizedFlow(
  symbol,
  windowMs = CONFIG.FLOW_WINDOW_MS
){

  const flow =
    calculateFlow(
      symbol,
      windowMs
    );


  const intensity =
    calculateFlowIntensity(
      symbol,
      flow
    );


  const baseline =
    calculateFlowBaseline(
      symbol
    );


  const normalizedNet =
    intensity.ratio > 0
      ? flow.netUsd /
        Math.max(
          flow.totalUsd,
          1
        )
      : 0;


  return {

    ...flow,

    intensity:
      intensity.intensity,

    intensityRatio:
      intensity.ratio,

    baselineUsd:
      intensity.baseline,

    baselineImbalance:
      baseline.avgImbalance,

    normalizedNet,

    strongBuy:
      flow.imbalance >= 0.25 &&
      intensity.ratio >= 1.15,

    strongSell:
      flow.imbalance <= -0.25 &&
      intensity.ratio >= 1.15

  };

}


/* =========================================================
   CVD
   ========================================================= */

function calculateCVD(
  symbol,
  windowMs = CONFIG.FLOW_WINDOW_MS
){

  const recent =
    getRecentTrades(
      symbol,
      windowMs
    );


  if(
    !recent.length
  ){

    return {

      cvd:
        0,

      buyUsd:
        0,

      sellUsd:
        0,

      totalUsd:
        0,

      normalized:
        0

    };

  }


  let buyUsd =
    0;

  let sellUsd =
    0;


  for(
    const trade of recent
  ){

    if(
      trade.side ===
      "Buy"
    ){

      buyUsd +=
        trade.usd;

    }else{

      sellUsd +=
        trade.usd;

    }

  }


  const total =
    buyUsd +
    sellUsd;


  const cvd =
    buyUsd -
    sellUsd;


  const normalized =
    total > 0
      ? cvd /
        total
      : 0;


  return {

    cvd,

    buyUsd,

    sellUsd,

    totalUsd:
      total,

    normalized

  };

}


/* =========================================================
   PRICE RESPONSE
   ========================================================= */

function calculatePriceResponse(
  symbol,
  windowMs = CONFIG.FLOW_WINDOW_MS
){

  const recent =
    getRecentTrades(
      symbol,
      windowMs
    );


  if(
    recent.length < 2
  ){

    return {

      priceChangePct:
        0,

      rangePct:
        0,

      firstPrice:
        0,

      lastPrice:
        0,

      efficiency:
        0

    };

  }


  const first =
    recent[0].price;


  const last =
    recent[
      recent.length - 1
    ].price;


  let min =
    Infinity;

  let max =
    0;


  let totalUsd =
    0;


  for(
    const trade of recent
  ){

    if(
      trade.price <
      min
    ){

      min =
        trade.price;

    }


    if(
      trade.price >
      max
    ){

      max =
        trade.price;

    }


    totalUsd +=
      trade.usd;

  }


  const priceChangePct =
    first > 0
      ? (
          (
            last -
            first
          ) /
          first
        ) *
        100
      : 0;


  const rangePct =
    min < Infinity &&
    min > 0
      ? (
          (
            max -
            min
          ) /
          min
        ) *
        100
      : 0;


  /*
    Flow efficiency:

    сколько движения цены
    приходится на условные
    $100k агрессивного объёма.

    Это не прогноз, а метрика
    реакции рынка на flow.
  */

  const efficiency =
    totalUsd > 0
      ? (
          Math.abs(
            priceChangePct
          ) /
          totalUsd
        ) *
        100000
      : 0;


  return {

    priceChangePct,

    rangePct,

    firstPrice:
      first,

    lastPrice:
      last,

    efficiency

  };

}


/* =========================================================
   FLOW DIRECTION
   ========================================================= */

function getFlowDirection(
  normalizedFlow
){

  if(
    !normalizedFlow
  ){

    return null;

  }


  if(
    normalizedFlow.strongBuy &&
    !normalizedFlow.strongSell
  ){

    return "LONG";

  }


  if(
    normalizedFlow.strongSell &&
    !normalizedFlow.strongBuy
  ){

    return "SHORT";

  }


  return null;

}


/* =========================================================
   FLOW QUALITY
   ========================================================= */

function calculateFlowQuality(
  symbol,
  direction
){

  const flow =
    calculateNormalizedFlow(
      symbol
    );


  const response =
    calculatePriceResponse(
      symbol
    );


  if(
    !flow.totalUsd
  ){

    return {

      score:
        0,

      direction:
        null,

      flow,

      response

    };

  }


  const directionalImbalance =
    direction === "LONG"
      ? flow.imbalance
      : -flow.imbalance;


  const imbalanceScore =
    clamp(
      (
        directionalImbalance -
        0.10
      ) /
      0.55,
      0,
      1
    );


  const intensityScore =
    clamp(
      flow.intensityRatio /
      3,
      0,
      1
    );


  /*
    Flow должен не просто быть
    большим, но и направленным.
  */

  const score =
    (
      imbalanceScore *
      0.65 +
      intensityScore *
      0.35
    ) *
    100;


  return {

    score,

    direction:
      getFlowDirection(
        flow
      ),

    flow,

    response

  };

}


/* =========================================================
   FLOW CONFLICT
   ========================================================= */

function hasFlowConflict(
  normalizedFlow,
  direction
){

  if(
    !normalizedFlow
  ){

    return false;

  }


  if(
    direction === "LONG"
  ){

    return (
      normalizedFlow.strongSell
    );

  }


  if(
    direction === "SHORT"
  ){

    return (
      normalizedFlow.strongBuy
    );

  }


  return false;

}


/* =========================================================
   FLOW FRESHNESS
   ========================================================= */

function isFlowFresh(
  symbol
){

  const health =
    symbolHealth.get(
      symbol
    );


  if(
    !health
  ){

  }


  return (
    now() -

  ) <=

}


/* =========================================================
   FLOW SNAPSHOT
   ========================================================= */

function getFlowSnapshot(

){

  const flow =
    calculateNormalizedFlow(
      symbol
    );


  const cvd =

    );


  const response =

    );


  return {

    cvd,

    response,

    direction:

      ),

      )

}

   UPDATE FLOW METRICS

function updateFlowMetrics(){

  let active =

  const timestamp =

  for(
