/* =========================================================
   WALL PRICE MATCH
   ========================================================= */

function isSameWall(
  symbol,
  state,
  wall
){

  if(
    !state ||
    !wall
  ){

    return false;

  }


  const bucketDistance =
    Math.abs(
      getWallBucket(
        symbol,
        state.peakPrice
      ) -
      getWallBucket(
        symbol,
        wall.peakPrice
      )
    );


  const tick =
    marketMeta.get(
      symbol
    )?.tickSize ||
    0;


  const tolerance =
    Math.max(
      tick * 20,
      state.peakPrice *
      0.00035
    );


  return (
    bucketDistance === 0 ||
    Math.abs(
      state.peakPrice -
      wall.peakPrice
    ) <=
    tolerance
  );

}


/* =========================================================
   FIND EXISTING WALL
   ========================================================= */

function findExistingWallState(
  symbol,
  wall
){

  const map =
    ensureWallStateMap(
      symbol
    );


  const directKey =
    getStableWallKey(
      symbol,
      wall.side,
      wall.peakPrice
    );


  const direct =
    map.get(
      directKey
    );


  if(
    direct &&
    isSameWall(
      symbol,
      direct,
      wall
    )
  ){

    return direct;

  }


  /*
    После движения цены bucket
    может измениться.

    Ищем ближайшее состояние
    того же направления.
  */

  let nearest =
    null;

  let nearestDistance =
    Infinity;


  for(
    const state of
    map.values()
  ){

    if(
      state.side !==
      wall.side
    ){

      continue;

    }


    if(
      state.state ===
      "REMOVED"
    ){

      continue;

    }


    const distance =
      Math.abs(
        state.peakPrice -
        wall.peakPrice
      );


    const tolerance =
      Math.max(
        (
          marketMeta.get(
            symbol
          )?.tickSize ||
          0
        ) * 20,

        wall.peakPrice *
        0.00035
      );


    if(
      distance <=
      tolerance &&
      distance <
      nearestDistance
    ){

      nearest =
        state;

      nearestDistance =
        distance;

    }

  }


  return nearest;

}


/* =========================================================
   PRICE RELATION TO WALL
   ========================================================= */

function getWallInteraction(
  symbol,
  wall
){

  const book =
    books.get(
      symbol
    );


  if(
    !book
  ){

    return {

      relation:
        "UNKNOWN",

      distancePct:
        Infinity,

      marketPrice:
        0

    };

  }


  const marketPrice =
    book.lastTradePrice ||
    book.lastPrice ||
    marketMeta.get(
      symbol
    )?.lastPrice ||
    0;


  if(
    marketPrice <= 0
  ){

    return {

      relation:
        "UNKNOWN",

      distancePct:
        Infinity,

      marketPrice:
        0

    };

  }


  const distancePct =
    priceDistancePct(
      marketPrice,
      wall.peakPrice
    );


  let relation =
    "FAR";


  if(
    wall.side ===
    "BID"
  ){

    if(
      marketPrice >=
      wall.peakPrice
    ){

      relation =
        "ABOVE";

    }else if(
      distancePct <=
      0.001
    ){

      relation =
        "TEST";

    }else{

      relation =
        "BELOW";

    }

  }else{

    if(
      marketPrice <=
      wall.peakPrice
    ){

      relation =
        "BELOW";

    }else if(
      distancePct <=
      0.001
    ){

      relation =
        "TEST";

    }else{

      relation =
        "ABOVE";

    }

  }


  return {

    relation,

    distancePct,

    marketPrice

  };

}


/* =========================================================
   WALL TEST DETECTION
   ========================================================= */

function detectWallTest(
  symbol,
  state,
  wall
){

  const interaction =
    getWallInteraction(
      symbol,
      wall
    );


  const wasNear =
    state.lastTouch >
    0 &&
    (
      now() -
      state.lastTouch
    ) <=
    5000;


  const near =
    interaction.distancePct <=
    0.0012;


  if(
    near &&
    !wasNear
  ){

    state.touches++;

    state.tests++;

    state.lastTouch =
      now();

    state.testPressure =
      0;

    return true;

  }


  if(
    near
  ){

    return true;

  }


  state.lastAway =
    now();


  return false;

}


/* =========================================================
   CALCULATE FLOW AT WALL
   ========================================================= */

function calculateWallFlow(
  symbol,
  state
){

  const flow =
    calculateNormalizedFlow(
      symbol,
      Math.min(
        CONFIG.FLOW_WINDOW_MS,
        10000
      )
    );


  if(
    !flow ||
    !flow.totalUsd
  ){

    return {

      totalUsd:
        0,

      netUsd:
        0,

      imbalance:
        0

    };

  }


  state.lastFlowUsd =
    flow.totalUsd;


  state.lastFlowImbalance =
    flow.imbalance;


  return {

    totalUsd:
      flow.totalUsd,

    netUsd:
      flow.netUsd,

    imbalance:
      flow.imbalance

  };

}


/* =========================================================
   CALCULATE WALL CONSUMPTION
   ========================================================= */

function calculateWallConsumption(
  state,
  wall
){

  const previous =
    Math.max(
      state.currentUsd,
      0
    );


  const current =
    Math.max(
      wall.totalUsd,
      0
    );


  state.previousUsd =
    previous;

  state.currentUsd =
    current;


  if(
    current >
    state.maxUsd
  ){

    state.maxUsd =
      current;

  }


  if(
    current <
    state.minUsd
  ){

    state.minUsd =
      current;

  }


  const delta =
    current -
    previous;


  if(
    delta < 0
  ){

    const removed =
      Math.abs(
        delta
      );


    state.removedUsd +=
      removed;

    state.consumedUsd +=
      removed;

  }else if(
    delta > 0
  ){

    state.addedUsd +=
      delta;

    state.replenishedUsd +=
      delta;

  }


  const initial =
    Math.max(
      state.initialUsd,
      1
    );


  state.removalRatio =
    clamp(
      (
        initial -
        current
      ) /
      initial,
      0,
      1
    );


  return {

    delta,

    removed:
      Math.max(
        -delta,
        0
      ),

    added:
      Math.max(
        delta,
        0
      ),

    removalRatio:
      state.removalRatio

  };

}


/* =========================================================
   ABSORPTION ESTIMATE
   ========================================================= */

function calculateWallAbsorption(
  symbol,
  state,
  flow
){

  if(
    !flow ||
    flow.totalUsd <=
    0
  ){

    state.absorption *=
      0.95;

    return state.absorption;

  }


  /*
    Для BID стены нам интересен
    агрессивный SELL flow.

    Для ASK стены —
    агрессивный BUY flow.
  */

  const attackingUsd =
    state.side ===
    "BID"
      ? Math.max(
          -flow.netUsd,
          0
        )
      : Math.max(
          flow.netUsd,
          0
        );


  const consumed =
    Math.max(
      state.consumedUsd,
      1
    );


  /*
    Это не "истинная" absorption
    из одной только книги.

    Это оценка:

      aggressive flow /
      reduction of displayed wall

    Поэтому она используется
    только вместе с реакцией цены.
  */

  const raw =
    attackingUsd /
    consumed;


  state.absorption =
    clamp(
      raw,
      0,
      5
    );


  return state.absorption;

}


/* =========================================================
   REPLENISHMENT
   ========================================================= */

function calculateReplenishment(
  state
){

  const removed =
    Math.max(
      state.removedUsd,
      1
    );


  const added =
    Math.max(
      state.addedUsd,
      0
    );


  const ratio =
    added /
    removed;


  /*
    > 1 означает, что после снятия
    ликвидность заметно возвращалась.
  */

  return {

    added,

    removed,

    ratio,

    replenishing:
      ratio >= 0.70 &&
      state.tests >= 1

  };

}


/* =========================================================
   SPOOF ESTIMATE
   ========================================================= */

function calculateSpoofScore(
  symbol,
  state,
  wall
){

  const age =
    now() -
    state.firstSeen;


  const initial =
    Math.max(
      state.initialUsd,
      1
    );


  const current =
    Math.max(
      state.currentUsd,
      0
    );


  const removal =
    clamp(
      (
        initial -
        current
      ) /
      initial,
      0,
      1
    );


  const persistence =
    clamp(
      age /
      30000,
      0,
      1
    );


  const replenishment =
    calculateReplenishment(
      state
    );


  /*
    Быстрое исчезновение крупной
    стены без достаточного
    агрессивного давления —
    подозрительный признак.
  */

  const fastRemoval =
    age <
    CONFIG.WALL_STABILITY_MS &&
    removal >=
    0.70;


  const weakAttack =
    state.lastFlowUsd <
    initial *
    0.35;


  let score =
    0;


  if(
    fastRemoval
  ){

    score +=
      45;

  }


  if(
    weakAttack
  ){

    score +=
      30;

  }


  if(
    replenishment.ratio <
    0.25
  ){

    score +=
      15;

  }


  if(
    state.tests === 0
  ){

    score +=
      10;

  }


  state.spoofScore =
    clamp(
      score,
      0,
      100
    );


  return state.spoofScore;

}


/* =========================================================
   WALL STATE TRANSITION
   ========================================================= */

function setWallState(
  state,
  nextState
){

  if(
    state.state ===
    nextState
  ){

    return false;

  }


  state.previousState =
    state.state;

  state.state =
    nextState;

  state.stateChangedAt =
    now();

  return true;

}


/* =========================================================
   UPDATE WALL STATE
   ========================================================= */

function updateWallLifecycle(
  symbol,
  wall
){

  const map =
    ensureWallStateMap(
      symbol
    );


  let state =
    findExistingWallState(
      symbol,
      wall
    );


  if(
    !state
  ){

    state =
      createWallState(
        symbol,
        wall
      );


    map.set(
      state.key,
      state
    );

  }


  const timestamp =
    now();


  state.lastSeen =
    timestamp;

  state.lastPrice =
    wall.peakPrice;

  state.lastMarketPrice =
    wall.marketPrice ||
    books.get(
      symbol
    )?.lastTradePrice ||
    books.get(
      symbol
    )?.lastPrice ||
    0;

  state.concentration =
    wall.concentration;

  state.ratio =
    wall.ratio;

  state.distance =
    wall.distance;


  const age =
    timestamp -
    state.firstSeen;


  state.persistence =
    clamp(
      age /
      60000,
      0,
      1
    );


  const stability =
    clamp(
      age /
      CONFIG.WALL_STABILITY_MS,
      0,
      1
    );


  state.stability =
    stability;


  const consumption =
    calculateWallConsumption(
      state,
      wall
    );


  const flow =
    calculateWallFlow(
      symbol,
      state
    );


  const absorption =
    calculateWallAbsorption(
      symbol,
      state,
      flow
    );


  const replenishment =
    calculateReplenishment(
      state
    );


  const spoof =
    calculateSpoofScore(
      symbol,
      state,
      wall
    );


  const tested =
    detectWallTest(
      symbol,
      state,
      wall
    );


  const interaction =
    getWallInteraction(
      symbol,
      wall
    );


  /*
    ---------------------------------------------------------
    STATE MACHINE
    ---------------------------------------------------------
  */


  if(
    spoof >= 75 &&
    age <
    CONFIG.WALL_STABILITY_MS
  ){

    setWallState(
      state,
      "SPOOF"
    );

  }else if(
    consumption.removalRatio >=
    0.85 &&
    state.lastMarketPrice > 0
  ){

    /*
      Стена практически исчезла.
    */

    setWallState(
      state,
      "BREAKING"
    );

  }else if(
    replenishment.replenishing &&
    tested
  ){

    setWallState(
      state,
      "REPLENISHING"
    );

  }else if(
    tested &&
    absorption >= 0.80
  ){

    setWallState(
      state,
      "ABSORBING"
    );

  }else if(
    tested
  ){

    setWallState(
      state,
      "TESTED"
    );

  }else if(
    age >=
    CONFIG.WALL_STABILITY_MS
  ){

    setWallState(
      state,
      "STABLE"
    );

  }else{

    setWallState(
      state,
      "NEW"
    );

  }


  /*
    Успешный тест:

    BID:
      цена коснулась стены,
      но не закрепилась ниже.

    ASK:
      цена коснулась стены,
      но не закрепилась выше.
  */

  if(
    tested &&
    interaction.marketPrice > 0
  ){

    const rejectionTolerance =
      Math.max(
        (
          marketMeta.get(
            symbol
          )?.tickSize ||
          0
        ) * 5,

        interaction.marketPrice *
        0.00035
      );


    if(
      state.side ===
      "BID"
    ){

      if(
        interaction.marketPrice >=
        state.peakPrice -
        rejectionTolerance
      ){

        state.successfulTests++;

      }

    }else{

      if(
        interaction.marketPrice <=
        state.peakPrice +
        rejectionTolerance
      ){

        state.successfulTests++;

      }

    }

  }


  state.lastUpdate =
    timestamp;


  /*
    Перезаписываем bucket-key,
    если цена стены немного
    сместилась.
  */

  const newKey =
    getStableWallKey(
      symbol,
      state.side,
      state.peakPrice
    );


  if(
    newKey !==
    state.key
  ){

    map.delete(
      state.key
    );

    state.key =
      newKey;

    map.set(
      newKey,
      state
    );

  }


  return {

    state,

    consumption,

    flow,

    absorption,

    replenishment,

    spoof,

    interaction

  };

}


/* =========================================================
   UPDATE ALL WALLS FOR SYMBOL
   ========================================================= */

function updateWallsForSymbol(
  symbol
){

  const detected =
    detectWalls(
      symbol
    );


  const active =
    [];


  for(
    const wall of
    detected.all
  ){

    const result =
      updateWallLifecycle(
        symbol,
        wall
      );


    if(
      result.state.state !==
      "REMOVED"
    ){

      active.push(
        result
      );

    }

  }


  /*
    Состояния, которые давно
    исчезли из книги, переводим
    в REMOVED.
  */

  const map =
    ensureWallStateMap(
      symbol
    );


  const timestamp =
    now();


  for(
    const state of
    map.values()
  ){

    if(
      state.lastSeen ===
      timestamp
    ){

      continue;

    }


    const unseenFor =
      timestamp -
      state.lastSeen;


    if(
      unseenFor >
      CONFIG.WALL_HISTORY_TTL
    ){

      setWallState(
        state,
        "REMOVED"
      );

    }

  }


  return active;

}


/* =========================================================
   GET ACTIVE WALL STATES
   ========================================================= */

function getActiveWallStates(
  symbol
){

  const map =
    wallStates.get(
      symbol
    );


  if(
    !map
  ){

    return [];

  }


  const result =
    [];


  for(
    const state of
    map.values()
  ){

    if(
      state.state ===
      "REMOVED"
    ){

      continue;

    }


    if(
      state.state ===
      "SPOOF"
    ){

      continue;

    }


    result.push(
      state
    );

  }


  return result;

}


/* =========================================================
   GET BEST ACTIONABLE WALL
   ========================================================= */

function getActionableWall(
  symbol,
  direction
){

  const states =
    getActiveWallStates(
      symbol
    );


  const book =
    books.get(
      symbol
    );


  if(
    !book
  ){

    return null;

  }


  const price =
    book.lastTradePrice ||
    book.lastPrice ||
    0;


  if(
    price <= 0
  ){

    return null;

  }


  const wantedSide =
    direction ===
    "LONG"
      ? "BID"
      : "ASK";


  const candidates =
    states.filter(
      state => {

        if(
          state.side !==
          wantedSide
        ){

          return false;

        }


        if(
          state.state ===
          "BREAKING"
        ){

          return false;

        }


        if(
          state.state ===
          "SPOOF"
        ){

          return false;

        }


        const distance =
          priceDistancePct(
            price,
            state.peakPrice
          );


        return (
          distance <=
          CONFIG.WALL_MAX_DISTANCE
        );

      }
    );


  if(
    !candidates.length
  ){

    return null;

  }


  candidates.sort(
    (
      a,
      b
    ) => {

      const da =
        priceDistancePct(
          price,
          a.peakPrice
        );


      const db =
        priceDistancePct(
          price,
          b.peakPrice
        );


      return (
        da - db
      );

    }
  );


  return candidates[0];

}


/* =========================================================
   WALL QUALITY SCORE
   ========================================================= */

function calculateActionableWallScore(
  state,
  direction
){

  if(
    !state
  ){

    return 0;

  }


  let score =
    0;


  /*
    STABILITY
  */

  if(
    state.state ===
    "STABLE"
  ){

    score +=
      20;

  }else if(
    state.state ===
    "TESTED"
  ){

    score +=
      25;

  }else if(
    state.state ===
    "ABSORBING"
  ){

    score +=
      35;

  }else if(
    state.state ===
    "REPLENISHING"
  ){

    score +=
      30;

  }


  /*
    AGE
  */

  const age =
    now() -
    state.firstSeen;


  if(
    age >=
    30000
  ){

    score +=
      15;

  }else if(
    age >=
    CONFIG.WALL_MIN_AGE_MS
  ){

    score +=
      8;

  }


  /*
    CONCENTRATION
  */

  if(
    state.concentration >=
    0.75
  ){

    score +=
      20;

  }else if(
    state.concentration >=
    0.60
  ){

    score +=
      12;

  }else if(
    state.concentration >=
    CONFIG.MIN_CONCENTRATION
  ){

    score +=
      6;

  }


  /*
    ABSORPTION
  */

  if(
    state.absorption >=
    1.25
  ){

    score +=
      20;

  }else if(
    state.absorption >=
    0.80
  ){

    score +=
      12;

  }


  /*
    REPLENISHMENT
  */

  const replenishment =
    calculateReplenishment(
      state
    );


  if(
    replenishment.ratio >=
    1.0
  ){

    score +=
      15;

  }else if(
    replenishment.ratio >=
    0.70
  ){

    score +=
      8;

  }


  /*
    SPOOF PENALTY
  */

  score -=
    state.spoofScore *
    0.50;


  /*
    BREAKING WALLS нельзя считать
    опорой/сопротивлением.
  */

  if(
    state.state ===
    "BREAKING"
  ){

    score -=
      40;

  }


  return clamp(
    score,
    0,
    100
  );

}


/* =========================================================
   WALL SNAPSHOT
   ========================================================= */

function getWallLifecycleSnapshot(
  symbol
){

  const states =
    getActiveWallStates(
      symbol
    );


  return states
    .map(
      state => ({

        key:
          state.key,

        side:
          state.side,

        price:
          state.peakPrice,

        state:
          state.state,

        age:
          now() -
          state.firstSeen,

        initialUsd:
          state.initialUsd,

        currentUsd:
          state.currentUsd,

        concentration:
          state.concentration,

        ratio:
          state.ratio,

        absorption:
          state.absorption,

        replenishment:
          calculateReplenishment(
            state
          ),

        removalRatio:
          state.removalRatio,

        spoofScore:
          state.spoofScore,

        tests:
          state.tests,

        successfulTests:
          state.successfulTests,

        score:
          calculateActionableWallScore(
            state,
            state.side === "BID"
              ? "LONG"
              : "SHORT"
          )

      })
    );

}

function makeSignalId(
  symbol,
  direction
){

  return [
    symbol,
    direction,
    Date.now(),
    Math.random()
      .toString(36)
      .slice(2,8)
  ].join(

  );

/* =========================================================
   CURRENT MARKET PRICE
   ========================================================= */

function getCurrentMarketPrice(
  symbol
){

  const book =
    books.get(
      symbol
    );


  const meta =
    marketMeta.get(
      symbol
    );


  if(
    book?.lastTradePrice >
    0
  ){

    return book.lastTradePrice;

  }


  if(
    meta?.lastPrice >
    0
  ){

    return meta.lastPrice;

  }


  if(
    book?.lastPrice >
    0
  ){

    return book.lastPrice;

  }


  if(
    book?.bestBid > 0 &&
    book?.bestAsk > 0
  ){

    return (
      book.bestBid +
      book.bestAsk
    ) / 2;

  }


  return 0;

}


/* =========================================================
   HTF CONTEXT
   ========================================================= */

function getHTFContext(
  symbol,
  direction,
  price
){

  const data =
    htfData.get(
      symbol
    );


  if(
    !data ||
    !Array.isArray(
      data.zones
    )
  ){

    return {

      valid:
        false,

      score:
        0,

      nearestZone:
        null,

      distancePct:
        Infinity,

      zones:
        []

    };

  }


  const type =
    direction ===
    "LONG"
      ? "SUPPORT"
      : "RESISTANCE";


  const zone =
    getNearestZone(
      symbol,
      price,
      type,
      direction ===
        "LONG"
        ? "below"
        : "above"
    );


  if(
    !zone
  ){

    return {

      valid:
        false,

      score:
        0,

      nearestZone:
        null,

      distancePct:
        Infinity,

      zones:
        data.zones

    };

  }


  const distancePct =
    priceDistancePct(
      price,
      zone.price
    );


  let score =
    0;


  /*
    Ближайшая HTF-зона
    должна быть достаточно
    близко к текущей цене.
  */

  if(
    distancePct <=
    0.0015
  ){

    score +=
      30;

  }else if(
    distancePct <=
    0.003
  ){

    score +=
      22;

  }else if(
    distancePct <=
    0.005
  ){

    score +=
      14;

  }else if(
    distancePct <=
    0.008
  ){

    score +=
      7;

  }


  /*
    Confluence нескольких
    таймфреймов.
  */

  const confluence =
    safeNumber(
      zone.confluence,
      1
    );


  score +=
    clamp(
      confluence *
      5,
      0,
      15
    );


  /*
    4H / 1H / 15M weights.
  */

  if(
    zone.timeframes?.includes(
      "4H"
    )
  ){

    score +=
      12;

  }


  if(
    zone.timeframes?.includes(
      "1H"
    )
  ){

    score +=
      8;

  }


  if(
    zone.timeframes?.includes(
      "15M"
    )
  ){

    score +=
      5;

  }


  return {

    valid:
      distancePct <=
      CONFIG.WALL_MAX_DISTANCE,

    score:
      clamp(
        score,
        0,
        70
      ),

    nearestZone:
      zone,

    distancePct,

    zones:
      data.zones

  };

}


/* =========================================================
   WALL CONTEXT
   ========================================================= */

function getSignalWallContext(
  symbol,
  direction,
  price
){

  const wantedSide =
    direction ===
    "LONG"
      ? "BID"
      : "ASK";


  const states =
    getActiveWallStates(
      symbol
    );


  const candidates =
    states.filter(
      state => {

        if(
          state.side !==
          wantedSide
        ){

          return false;

        }


        if(
          state.state ===
          "SPOOF" ||
          state.state ===
          "BREAKING"
        ){

          return false;

        }


        const distance =
          priceDistancePct(
            price,
            state.peakPrice
          );


        return (
          distance <=
          CONFIG.WALL_MAX_DISTANCE
        );

      }
    );


  if(
    !candidates.length
  ){

    return {

      valid:
        false,

      score:
        0,

      wall:
        null,

      distancePct:
        Infinity

    };

  }


  candidates.sort(
    (
      a,
      b
    ) => {

      const da =
        priceDistancePct(
          price,
          a.peakPrice
        );


      const db =
        priceDistancePct(
          price,
          b.peakPrice
        );


      /*
        Сначала близость,
        затем качество.
      */

      if(
        Math.abs(
          da - db
        ) >
        0.0005
      ){

        return da - db;

      }


      return (
        calculateActionableWallScore(
          b,
          direction
        ) -
        calculateActionableWallScore(
          a,
          direction
        )
      );

    }
  );


  const wall =
    candidates[0];


  const distancePct =
    priceDistancePct(
      price,
      wall.peakPrice
    );


  const score =
    calculateActionableWallScore(
      wall,
      direction
    );


  return {

    valid:
      score >= 30,

    score,

    wall,

    distancePct

  };

}


/* =========================================================
   PRICE RESPONSE CONFIRMATION
   ========================================================= */

function calculateDirectionalResponse(
  symbol,
  direction
){

  const response =
    calculatePriceResponse(
      symbol,
      Math.min(
        CONFIG.FLOW_WINDOW_MS,
        10000
      )
    );


  if(
    !response ||
    !response.lastPrice
  ){

    return {

      score:
        0,

      confirmed:
        false,

      response

    };

  }


  let score =
    0;


  const move =
    response.priceChangePct;


  const directionalMove =
    direction ===
    "LONG"
      ? move
      : -move;


  /*
    Цена должна хотя бы
    немного отвечать на flow.
  */

  if(
    directionalMove >=
    0.10
  ){

    score +=
      25;

  }else if(
    directionalMove >=
    0.05
  ){

    score +=
      15;

  }else if(
    directionalMove >=
    0.02
  ){

    score +=
      8;

  }


  /*
    Слишком сильное движение
    непосредственно перед входом
    ухудшает точку входа.
  */

  const overExtended =
    directionalMove >
    0.80;


  if(
    overExtended
  ){

    score -=
      15;

  }


  return {

    score:
      clamp(
        score,
        0,
        25
      ),

    confirmed:
      directionalMove >=
      0.02 &&
      !overExtended,

    response

  };

}


/* =========================================================
   FLOW CONTEXT FOR SIGNAL
   ========================================================= */

function getSignalFlowContext(
  symbol,
  direction
){

  const flow =
    calculateNormalizedFlow(
      symbol
    );


  if(
    !flow ||
    flow.totalUsd <=
    0
  ){

    return {

      valid:
        false,

      score:
        0,

      flow,
      
      conflict:
        false

    };

  }


  const directionalImbalance =
    direction ===
    "LONG"
      ? flow.imbalance
      : -flow.imbalance;


  let score =
    0;


  if(
    directionalImbalance >=
    0.40
  ){

    score +=
      35;

  }else if(
    directionalImbalance >=
    0.30
  ){

    score +=
      28;

  }else if(
    directionalImbalance >=
    0.20
  ){

    score +=
      20;

  }else if(
    directionalImbalance >=
    0.12
  ){

    score +=
      10;

  }


  /*
    Интенсивность относительно
    собственной истории монеты.
  */

  if(
    flow.intensityRatio >=
    3
  ){

    score +=
      25;

  }else if(
    flow.intensityRatio >=
    2
  ){

    score +=
      18;

  }else if(
    flow.intensityRatio >=
    1.30
  ){

    score +=
      12;

  }else if(
    flow.intensityRatio >=
    1.10
  ){

    score +=
      5;

  }


  const conflict =
    hasFlowConflict(
      flow,
      direction
    );


  if(
    conflict
  ){

    score -=
      40;

  }


  return {

    valid:
      directionalImbalance >=
      0.12 &&
      !conflict,

    score:
      clamp(
        score,
        0,
        60
      ),

    flow,

    conflict

  };

}


/* =========================================================
   WALL + FLOW INTERACTION
   ========================================================= */

function calculateWallFlowConfirmation(
  symbol,
  direction,
  wall
){

  if(
    !wall
  ){

    return {

      score:
        0,

      confirmed:
        false

    };

  }


  const flow =
    calculateNormalizedFlow(
      symbol,
      Math.min(
        CONFIG.FLOW_WINDOW_MS,
        10000
      )
    );


  if(
    !flow.totalUsd
  ){

    return {

      score:
        0,

      confirmed:
        false

    };

  }


  const attackingUsd =
    wall.side ===
    "BID"
      ? Math.max(
          -flow.netUsd,
          0
        )
      : Math.max(
          flow.netUsd,
          0
        );


  const directionalUsd =
    wall.side ===
    "BID"
      ? Math.max(
          flow.netUsd,
          0
        )
      : Math.max(
          -flow.netUsd,
          0
        );


  let score =
    0;


  /*
    Если стена BID и агрессивные
    продавцы атакуют её, нам нужна
    именно реакция стены.

    Если ASK — наоборот.
  */

  if(
    wall.absorption >=
    1.50
  ){

    score +=
      35;

  }else if(
    wall.absorption >=
    1.0
  ){

    score +=
      25;

  }else if(
    wall.absorption >=
    0.70
  ){

    score +=
      15;

  }


  if(
    directionalUsd >
    attackingUsd
  ){

    score +=
      15;

  }


  if(
    wall.state ===
    "ABSORBING"
  ){

    score +=
      20;

  }


  if(
    wall.state ===
    "REPLENISHING"
  ){

    score +=
      10;

  }


  return {

    score:
      clamp(
        score,
        0,
        70
      ),

    confirmed:
      score >=
      25,

    attackingUsd,

    directionalUsd

  };

}


/* =========================================================
   ENTRY PRICE
   ========================================================= */

function calculateEntryPrice(
  symbol,
  direction
){

  const price =
    getCurrentMarketPrice(
      symbol
    );


  if(
    price <= 0
  ){

    return 0;

  }


  const book =
    books.get(
      symbol
    );


  if(
    !book
  ){

    return price;

  }


  /*
    Для ручного входа ориентируемся
    на актуальную market price.

    Не используем цену стены
    как entry.

    Это критично для корректного RR.
  */

  if(
    direction ===
    "LONG"
  ){

    return (
      book.bestAsk ||
      price
    );

  }


  return (
    book.bestBid ||
    price
  );

}


/* =========================================================
   STRUCTURAL STOP
   ========================================================= */

function calculateStopLoss(
  symbol,
  direction,
  entry,
  wallContext,
  htfContext
){

  if(
    entry <= 0
  ){

    return 0;

  }


  const data =
    htfData.get(
      symbol
    );


  const atr =
    safeNumber(
      data?.atr5M,
      0
    );


  const atrBuffer =
    atr > 0
      ? atr *
        0.20
      : entry *
        0.0015;


  let stop =
    0;


  if(
    direction ===
    "LONG"
  ){

    const wallPrice =
      wallContext?.wall?.peakPrice ||
      0;


    const zonePrice =
      htfContext?.nearestZone?.price ||
      0;


    const structural =
      Math.min(
        wallPrice > 0
          ? wallPrice
          : Infinity,

        zonePrice > 0
          ? zonePrice
          : Infinity
      );


    if(
      structural <
      Infinity
    ){

      stop =
        structural -
        atrBuffer;

    }else{

      stop =
        entry -
        Math.max(
          atrBuffer,
          entry *
          0.002
        );

    }


    /*
      Stop обязательно ниже entry.
    */

    if(
      stop >=
      entry
    ){

      stop =
        entry -
        Math.max(
          atrBuffer,
          entry *
          0.0015
        );

    }

  }else{

    const wallPrice =
      wallContext?.wall?.peakPrice ||
      0;


    const zonePrice =
      htfContext?.nearestZone?.price ||
      0;


    const structural =
      Math.max(
        wallPrice > 0
          ? wallPrice
          : -Infinity,

        zonePrice > 0
          ? zonePrice
          : -Infinity
      );


    if(
      structural >
      -Infinity
    ){

      stop =
        structural +
        atrBuffer;

    }else{

      stop =
        entry +
        Math.max(
          atrBuffer,
          entry *
          0.002
        );

    }


    if(
      stop <=
      entry
    ){

      stop =
        entry +
        Math.max(
          atrBuffer,
          entry *
          0.0015
        );

    }

  }


  return roundToTick(
    symbol,
    stop
  );

}


/* =========================================================
   NEXT LIQUIDITY TARGET
   ========================================================= */

function findLiquidityTarget(
  symbol,
  direction,
  entry
){

  const book =
    books.get(
      symbol
    );


  if(
    !book ||
    entry <= 0
  ){

    return null;

  }


  const targetSide =
    direction ===
    "LONG"
      ? "ASK"
      : "BID";


  const levels =
    getBookSideLevels(
      symbol,
      targetSide,
      CONFIG.WALL_MAX_DISTANCE
    );


  if(
    !levels.length
  ){

    return null;

  }


  const threshold =
    getAdaptiveWallThreshold(
      symbol,
      targetSide
    );


  const candidates =
    levels
      .filter(
        level => {

          if(
            direction ===
            "LONG" &&
            level.price <=
            entry
          ){

            return false;

          }


          if(
            direction ===
            "SHORT" &&
            level.price >=
            entry
          ){

            return false;

          }


          return (
            level.usd >=
            threshold *
            0.70
          );

        }
      )
      .sort(
        (
          a,
          b
        ) => {

          if(
            direction ===
            "LONG"
          ){

            return (
              a.price -
              b.price
            );

          }


          return (
            b.price -
            a.price
          );

        }
      );


  if(
    candidates.length
  ){

    return candidates[0];

  }


  /*
    Если крупной стены нет,
    используем ближайшую HTF
    зону противоположного типа.
  */

  const data =
    htfData.get(
      symbol
    );


  const zoneType =
    direction ===
    "LONG"
      ? "RESISTANCE"
      : "SUPPORT";


  const zone =
    getNearestZone(
      symbol,
      entry,
      zoneType,
      direction ===
        "LONG"
        ? "above"
        : "below"
    );


  if(
    zone
  ){

    return {

      price:
        zone.price,

      usd:
        0,

      type:
        "HTF_ZONE",

      zone

    };

  }


  return null;

}


/* =========================================================
   TAKE PROFIT
   ========================================================= */

function calculateTakeProfit(
  symbol,
  direction,
  entry,
  stop
){

  const target =
    findLiquidityTarget(
      symbol,
      direction,
      entry
    );


  if(
    !target
  ){

    return 0;

  }


  let tp =
    target.price;


  const risk =
    Math.abs(
      entry -
      stop
    );


  if(
    risk <= 0
  ){

    return 0;

  }


  const minimumTarget =
    direction ===
    "LONG"
      ? entry +
        risk *
        CONFIG.MIN_RR
      : entry -
        risk *
        CONFIG.MIN_RR;


  /*
    Для LONG TP должен быть
    выше минимального RR.

    Для SHORT — ниже.
  */

  if(
    direction ===
    "LONG"
  ){

    if(
      tp <
      minimumTarget
    ){

      return 0;

    }

  }else{

    if(
      tp >
      minimumTarget
    ){

      return 0;

    }

  }


  return roundToTick(
    symbol,
    tp
  );

}


/* =========================================================
   RISK / REWARD
   ========================================================= */

function calculateRR(
  direction,
  entry,
  stop,
  target
){

  if(
    entry <= 0 ||
    stop <= 0 ||
    target <= 0
  ){

    return 0;

  }


  const risk =
    Math.abs(
      entry -
      stop
    );


  const reward =
    Math.abs(
      target -
      entry
    );


  if(
    risk <= 0
  ){

    return 0;

  }


  return (
    reward /
    risk
  );

}


/* =========================================================
   SPREAD FILTER
   ========================================================= */

function checkSpread(
  symbol
){

  const book =
    books.get(
      symbol
    );


  if(
    !book ||
    !book.bestBid ||
    !book.bestAsk
  ){

    return {

      valid:
        false,

      spreadPct:
        Infinity

    };

  }


  const spreadPct =
    (
      (
        book.bestAsk -
        book.bestBid
      ) /
      (
        (
          book.bestAsk +
          book.bestBid
        ) / 2
      )
    ) *
    100;


  /*
    Для большинства liquid USDT
    perpetuals спред должен быть
    маленьким.

    На слишком широком спреде
    ручной вход становится хуже.
  */

  return {

    valid:
      spreadPct <=
      0.08,

    spreadPct

  };

}


/* =========================================================
   BOOK FRESHNESS
   ========================================================= */

function checkBookFreshness(
  symbol
){

  const health =
    symbolHealth.get(
      symbol
    );


  if(
    !health
  ){

    return false;

  }


  return (
    health.bookValid &&
    now() -
    health.lastBookRx <=
    CONFIG.SYMBOL_STALE_MS
  );

}


/* =========================================================
   SIGNAL SCORE
   ========================================================= */

function calculateSignalScore(
  symbol,
  direction
){

  const price =
    getCurrentMarketPrice(
      symbol
    );


  if(
    price <= 0
  ){

    return {

      valid:
        false,

      score:
        0

    };

  }


  const htf =
    getHTFContext(
      symbol,
      direction,
      price
    );


  const wall =
    getSignalWallContext(
      symbol,
      direction,
      price
    );


  const flow =
    getSignalFlowContext(
      symbol,
      direction
    );


  const response =
    calculateDirectionalResponse(
      symbol,
      direction
    );


  const wallFlow =
    calculateWallFlowConfirmation(
      symbol,
      direction,
      wall.wall
    );


  const spread =
    checkSpread(
      symbol
    );


  const freshBook =
    checkBookFreshness(
      symbol
    );


  const freshFlow =
    isFlowFresh(
      symbol
    );


  let score =
    0;


  /*
    HTF STRUCTURE
  */

  score +=
    htf.score;


  /*
    WALL
  */

  score +=
    wall.score *
    0.65;


  /*
    FLOW
  */

  score +=
    flow.score *
    0.65;


  /*
    PRICE RESPONSE
  */

  score +=
    response.score;


  /*
    WALL/FLOW INTERACTION
  */

  score +=
    wallFlow.score *
    0.45;


  /*
    Penalties
  */

  if(
    !spread.valid
  ){

    score -=
      15;

  }


  if(
    !freshBook
  ){

    score -=
      30;

  }


  if(
    !freshFlow
  ){

    score -=
      25;

  }


  if(
    flow.conflict
  ){

    score -=
      35;

  }


  /*
    Не даём score уходить
    за границы.
  */

  score =
    clamp(
      score,
      0,
      100
    );


  return {

    valid:
      score >=
      CONFIG.MIN_SCORE &&

      htf.valid &&

      wall.valid &&

      flow.valid &&

      response.confirmed &&

      wallFlow.confirmed &&

      spread.valid &&

      freshBook &&

      freshFlow &&

      !flow.conflict,

    score,

    price,

    htf,

    wall,

    flow,

    response,

    wallFlow,

    spread,

    freshBook,

    freshFlow

  };

}


/* =========================================================
   BUILD SIGNAL
   ========================================================= */

function buildSignal(
  symbol,
  direction,
  analysis
){

  const entry =
    calculateEntryPrice(
      symbol,
      direction
    );


  if(
    entry <= 0
  ){

    return null;

  }


  const stop =
    calculateStopLoss(
      symbol,
      direction,
      entry,
      analysis.wall,
      analysis.htf
    );


  if(
    stop <= 0
  ){

    return null;

  }


  const target =
    calculateTakeProfit(
      symbol,
      direction,
      entry,
      stop
    );


  if(
    target <= 0
  ){

    return null;

  }


  const rr =
    calculateRR(
      direction,
      entry,
      stop,
      target
    );


  if(
    rr <
    CONFIG.MIN_RR
  ){

    return null;

  }


  const wall =
    analysis.wall.wall;


  const signal =
    {

      id:
        makeSignalId(
          symbol,
          direction
        ),

      symbol,

      direction,

      createdAt:
        now(),

      updatedAt:
        now(),

      /*
        entryPrice НИКОГДА
        не меняется после
        создания сигнала.
      */

      entryPrice:
        entry,

      currentPrice:
        entry,

      stopLoss:
        stop,

      takeProfit:
        target,

      rr,

      score:
        analysis.score,

      status:
        "ACTIVE",

      wall: wall
        ? {

            side:
              wall.side,

            price:
              wall.peakPrice,

            state:
              wall.state,

            usd:
              wall.currentUsd,

            ratio:
              wall.ratio,

            concentration:
              wall.concentration,

            absorption:
              wall.absorption

          }
        : null,

      htf:
        analysis.htf.nearestZone
          ? {

              type:
                analysis.htf.nearestZone.type,

              price:
                analysis.htf.nearestZone.price,

              confluence:
                analysis.htf.nearestZone.confluence,

              timeframes:
                analysis.htf.nearestZone.timeframes

            }
          : null,

      flow:
        {

          imbalance:
            analysis.flow.flow.imbalance,

          totalUsd:
            analysis.flow.flow.totalUsd,

          intensity:
            analysis.flow.flow.intensityRatio,

          netUsd:
            analysis.flow.flow.netUsd

        },

      response:
        {

          movePct:
            analysis.response.response.priceChangePct,

          efficiency:
            analysis.response.response.efficiency

        },

      spreadPct:
        analysis.spread.spreadPct,

      entryValidUntil:
        now() +
        CONFIG.ENTRY_VALID_MS,

      expiresAt:
        now() +
        CONFIG.SIGNAL_TTL_MS,

      lastValidation:
        now(),

      invalidReason:
        null

    };


  return signal;

}


/* =========================================================
   SIGNAL INVALIDATION
   ========================================================= */

function invalidateSignal(
  signal,
  reason
){

  if(
    !signal ||
    signal.status !==
    "ACTIVE"
  ){

    return;

  }


  signal.status =
    "INVALIDATED";


  signal.invalidReason =
    reason;


  signal.updatedAt =
    now();


  setCooldown(
    signal.symbol,
    signal.direction,
    CONFIG.INVALIDATION_COOLDOWN_MS
  );

}


/* =========================================================
   VALIDATE ACTIVE SIGNAL
   ========================================================= */

function validateActiveSignal(
  signal
){

  if(
    !signal ||
    signal.status !==
    "ACTIVE"
  ){

    return false;

  }


  const price =
    getCurrentMarketPrice(
      signal.symbol
    );


  if(
    price <= 0
  ){

    invalidateSignal(
      signal,
      "NO_PRICE"
    );

    return false;

  }


  signal.currentPrice =
    price;


  /*
    1. TTL
  */

  if(
    now() >
    signal.expiresAt
  ){

    invalidateSignal(
      signal,
      "EXPIRED"
    );

    return false;

  }


  /*
    2. Entry window.

    После 30 секунд сигнал
    перестаёт быть новым входом,
    но может оставаться ACTIVE
    для отслеживания.
  */

  if(
    now() >
    signal.entryValidUntil
  ){

    signal.entryExpired =
      true;

  }


  /*
    3. Проверка SL / TP.
  */

  if(
    signal.direction ===
    "LONG"
  ){

    if(
      price <=
      signal.stopLoss
    ){

      signal.status =
        "STOP";

      signal.updatedAt =
        now();

      return false;

    }


    if(
      price >=
      signal.takeProfit
    ){

      signal.status =
        "TARGET";

      signal.updatedAt =
        now();

      return false;

    }

  }else{

    if(
      price >=
      signal.stopLoss
    ){

      signal.status =
        "STOP";

      signal.updatedAt =
        now();

      return false;

    }


    if(
      price <=
      signal.takeProfit
    ){

      signal.status =
        "TARGET";

      signal.updatedAt =
        now();

      return false;

    }

  }


  /*
    4. Book freshness.
  */

  if(
    !checkBookFreshness(
      signal.symbol
    )
  ){

    invalidateSignal(
      signal,
      "BOOK_STALE"
    );

    return false;

  }


  /*
    5. Ключевая стена исчезла.
  */

  const activeWall =
    signal.wall
      ? getActiveWallStates(
          signal.symbol
        ).find(
          state =>
            state.side ===
              signal.wall.side &&
            Math.abs(
              state.peakPrice -
              signal.wall.price
            ) <=
            Math.max(
              (
                marketMeta.get(
                  signal.symbol
                )?.tickSize ||
                0
              ) * 20,

              signal.wall.price *
              0.0005
            )
        )
      : null;


  if(
    signal.wall &&
    !activeWall
  ){

    invalidateSignal(
      signal,
      "WALL_REMOVED"
    );

    return false;

  }


  if(
    activeWall
  ){

    signal.wall.state =
      activeWall.state;

    signal.wall.usd =
      activeWall.currentUsd;

    signal.wall.absorption =
      activeWall.absorption;


    if(
      activeWall.state ===
      "BREAKING" ||
      activeWall.state ===
      "SPOOF"
    ){

      invalidateSignal(
        signal,
        "WALL_INVALID"
      );

      return false;

    }

  }


  /*
    6. Противоположный aggressive
    flow.

    Не закрываем сигнал из-за
    каждого маленького reversal,
    только при явном конфликте.
  */

  const flow =
    calculateNormalizedFlow(
      signal.symbol
    );


  const conflict =
    hasFlowConflict(
      flow,
      signal.direction
    );


  if(
    conflict &&
    flow.intensityRatio >=
    1.50
  ){

    invalidateSignal(
      signal,
      "FLOW_FLIP"
    );

    return false;

  }


  signal.lastValidation =
    now();

  signal.updatedAt =
    now();


  return true;

}


/* =========================================================
   CREATE OR UPDATE SIGNAL
   ========================================================= */

function processDirection(
  symbol,
  direction
){

  /*
    Не создаём новый сигнал,
    если есть cooldown.
  */

  if(
    cooldownActive(
      symbol,
      direction
    )
  ){

    return null;

  }


  /*
    Если уже существует активный
    сигнал в ту же сторону —
    ничего не создаём.
  */

  const existing =
    signals.get(
      symbol
    );


  if(
    existing &&
    existing.status ===
    "ACTIVE"
  ){

    if(
      existing.direction ===
      direction
    ){

      validateActiveSignal(
        existing
      );

      return existing;

    }


    /*
      Не разрешаем LONG/SHORT
      одновременно по одному
      символу.
    */

    return null;

  }


  const analysis =
    calculateSignalScore(
      symbol,
      direction
    );


  if(
    !analysis.valid
  ){

    return null;

  }


  const signal =
    buildSignal(
      symbol,
      direction,
      analysis
    );


  if(
    !signal
  ){

    return null;

  }


  signals.set(
    symbol,
    signal
  );


  setCooldown(
    symbol,
    direction,
    CONFIG.COOLDOWN_MS
  );


  metrics.signals++;


  return signal;

}


/* =========================================================
   SYMBOL SCAN
   ========================================================= */

function scanSymbol(
  symbol
){

  if(
    !isSymbolFresh(
      symbol
    )
  ){

    return null;

  }


  const book =
    books.get(
      symbol
    );


  if(
    !book ||
    !book.valid
  ){

    return null;

  }


  const price =
    getCurrentMarketPrice(
      symbol
    );


  if(
    price <= 0
  ){

    return null;

  }


  /*
    Сначала обновляем жизненный
    цикл стен.
  */

  updateWallsForSymbol(
    symbol
  );


  /*
    Затем flow.
  */

  calculateNormalizedFlow(
    symbol
  );


  /*
    Если уже есть активный сигнал,
    валидируем его и не пытаемся
    создать противоположный.
  */

  const existing =
    signals.get(
      symbol
    );


  if(
    existing &&
    existing.status ===
    "ACTIVE"
  ){

    validateActiveSignal(
      existing
    );

    return existing;

  }


  /*
    LONG и SHORT анализируются
    независимо.

    Но создаётся только один.
  */

  const longAnalysis =
    calculateSignalScore(
      symbol,
      "LONG"
    );


  const shortAnalysis =
    calculateSignalScore(
      symbol,
      "SHORT"
    );


  const longValid =
    longAnalysis.valid;


  const shortValid =
    shortAnalysis.valid;


  if(
    longValid &&
    !shortValid
  ){

    return processDirection(
      symbol,
      "LONG"
    );

  }


  if(
    shortValid &&
    !longValid
  ){

    return processDirection(
      symbol,
      "SHORT"
    );

  }


  /*
    Если одновременно подходят
    обе стороны — не торгуем.
    Это защита от конфликтного
    order-flow.
  */

  if(
    longValid &&
    shortValid
  ){

    return null;

  }


  return null;

}


/* =========================================================
   SCAN ALL PENDING SYMBOLS
   ========================================================= */

function scanPendingSymbols(){

  const symbols =
    [];


  for(
    const [
      symbol,
      pending
    ]
    of pendingScan.entries()
  ){

    if(
      pending
    ){

      symbols.push(
        symbol
      );

    }

  }


  for(
    const symbol of
    symbols
  ){

    pendingScan.set(
      symbol,
      false
    );


    try{

      scanSymbol(
        symbol
      );

    }catch(
      error
    ){

      const health =
        symbolHealth.get(
          symbol
        );


      if(
        health
      ){

        health.lastError =
          String(
            error?.message ||
            error
          );

      }

    }

  }


  return symbols.length;

}


/* =========================================================
   MANAGE ACTIVE SIGNALS
   ========================================================= */

function manageSignals(){

  const timestamp =
    now();


  for(
    const [
      symbol,
      signal
    ]
    of signals.entries()
  ){

    if(
      !signal
    ){

      signals.delete(
        symbol
      );

      continue;

    }


    if(
      signal.status ===
      "ACTIVE"
    ){

      validateActiveSignal(
        signal
      );

    }


    /*
      Не удаляем завершённые
      сигналы мгновенно.

      Они остаются в UI,
      чтобы пользователь видел,
      чем закончилась идея.
    */

    if(
      signal.status !==
      "ACTIVE" &&
      timestamp -
      signal.updatedAt >
      CONFIG.SIGNAL_TTL_MS
    ){

      signals.delete(
        symbol
      );

    }

  }

}

/* =========================================================
   REFRESH UNIVERSE
   ========================================================= */

async function refreshUniverse(){

  try{

    await loadUniverse();


    const currentSymbols =
      new Set(
        marketUniverse.map(
          item =>
            item.symbol
        )
      );


    /*
      Добавляем новые структуры
      для новых символов.
    */

    for(
      const symbol of
      currentSymbols
    ){

      ensureBook(
        symbol
      );

      ensureTradeBuffer(
        symbol
      );


      if(
        !symbolHealth.has(
          symbol
        )
      ){

        symbolHealth.set(
          symbol,
          {

            symbol,

            lastBookRx:
              0,

            lastTradeRx:
              0,

            lastBookTs:
              0,

            lastTradeTs:
              0,

            bookValid:
              false,

            reconnects:
              0,

            sequenceErrors:
              0,

            lastError:
              null

          }
        );

      }


      if(
        !wallStates.has(
          symbol
        )
      ){

        wallStates.set(
          symbol,
          new Map()
        );

      }

    }


    /*
      Старые символы из runtime
      не удаляем мгновенно.

      Это позволяет не ломать
      активные сигналы при refresh.
    */

    return true;

  }catch(
    error
  ){

    console.error(
      "Universe refresh:",
      error
    );


    setStatus(
      "Ошибка обновления рынка"
    );


    return false;

  }

}

/* =========================================================
   RENDER NUMBER
   ========================================================= */

function renderNumber(
  value,
  digits = 2
){

  if(
    !Number.isFinite(
      value
    )
  ){

    return "—";

  }


  return Number(
    value
  ).toFixed(
    digits
  );

}


/* =========================================================
   SIGNAL STATUS LABEL
   ========================================================= */

function signalStatusLabel(
  status
){

  switch(
    status
  ){

    case "ACTIVE":
      return "АКТИВЕН";

    case "TARGET":
      return "TP";

    case "STOP":
      return "SL";

    case "INVALIDATED":
      return "ОТМЕНЁН";

    default:
      return status || "—";

  }

}


/* =========================================================
   SIGNAL CARD
   ========================================================= */

function createSignalCard(
  signal
){

  const card =
    document.createElement(
      "div"
    );


  card.className =
    "signal " +
    (
      signal.direction ===
      "LONG"
        ? "long"
        : "short"
    );


  const price =
    signal.currentPrice ||
    signal.entryPrice;


  const pnlPct =
    signal.entryPrice > 0
      ? (
          signal.direction ===
          "LONG"
            ? (
                (
                  price -
                  signal.entryPrice
                ) /
                signal.entryPrice
              ) *
              100
            : (
                (
                  signal.entryPrice -
                  price
                ) /
                signal.entryPrice
              ) *
              100
        )
      : 0;


  const ageSec =
    Math.max(
      0,
      (
        now() -
        signal.createdAt
      ) /
      1000
    );


  const wallState =
    signal.wall?.state ||
    "—";


  const flowImbalance =
    signal.flow?.imbalance ||
    0;


  const flowPct =
    flowImbalance *
    100;


  card.innerHTML = `

    <div class="signalTop">

      <div>

        <strong>
          ${signal.symbol}
        </strong>

        <span class="badge">

          ${signal.direction}

        </span>

      </div>

      <div class="score">

        ${renderNumber(
          signal.score,
          0
        )}

      </div>

    </div>


    <div class="signalGrid">

      <div>

        <small>Статус</small>

        <b>
          ${signalStatusLabel(
            signal.status
          )}
        </b>

      </div>


      <div>

        <small>Текущая</small>

        <b>
          ${formatPrice(
            signal.symbol,
            price
          )}
        </b>

      </div>


      <div>

        <small>Entry</small>

        <b>
          ${formatPrice(
            signal.symbol,
            signal.entryPrice
          )}
        </b>

      </div>


      <div>

        <small>SL</small>

        <b>
          ${formatPrice(
            signal.symbol,
            signal.stopLoss
          )}
        </b>

      </div>


      <div>

        <small>TP</small>

        <b>
          ${formatPrice(
            signal.symbol,
            signal.takeProfit
          )}
        </b>

      </div>


      <div>

        <small>RR</small>

        <b>
          ${renderNumber(
            signal.rr,
            2
          )}R
        </b>

      </div>


      <div>

        <small>PnL</small>

        <b>
          ${pnlPct >= 0
            ? "+"
            : ""
          }${renderNumber(
            pnlPct,
            2
          )}%
        </b>

      </div>


      <div>

        <small>Возраст</small>

        <b>
          ${renderNumber(
            ageSec,
            0
          )}s
        </b>

      </div>

    </div>


    <div class="signalMeta">

      <span>
        Wall:
        <b>
          ${wallState}
        </b>
      </span>


      <span>
        Flow:
        <b>
          ${flowPct >= 0
            ? "+"
            : ""
          }${renderNumber(
            flowPct,
            1
          )}%
        </b>
      </span>


      <span>
        Wall $
        <b>
          ${formatUsd(
            signal.wall?.usd || 0
          )}
        </b>
      </span>


      <span>
        Score
        <b>
          ${renderNumber(
            signal.score,
            0
          )}
        </b>
      </span>

    </div>

  `;


  return card;

}


/* =========================================================
   RENDER SIGNALS
   ========================================================= */

function renderSignals(){

  const container =
    document.getElementById(
      "signals"
    );


  if(
    !container
  ){

    return;

  }


  container.innerHTML =
    "";


  const list =
    [...signals.values()]
      .sort(
        (
          a,
          b
        ) => {

          /*
            Сначала ACTIVE,
            затем по score.
          */

          if(
            a.status ===
            "ACTIVE" &&
            b.status !==
            "ACTIVE"
          ){

            return -1;

          }


          if(
            a.status !==
            "ACTIVE" &&
            b.status ===
            "ACTIVE"
          ){

            return 1;

          }


          return (
            b.score -
            a.score
          );

        }
      );


  if(
    !list.length
  ){

    container.innerHTML = `

      <div class="empty">

        Сигналов пока нет.<br>

        Сканер ждёт совпадение
        HTF + wall + flow + reaction.

      </div>

    `;

    return;

  }


  for(
    const signal of
    list
  ){

    container.appendChild(
      createSignalCard(
        signal
      )
    );

  }

}


/* =========================================================
   RENDER APPLICATION
   ========================================================= */

function renderApplication(){

  if(
    uiRenderRequested
  ){

  }


  uiRenderRequested =

  requestAnimationFrame(
    () => {

      uiRenderRequested =
        false;


      renderSignals();

    }
  );

/* =========================================================
   UPDATE STATS
   ========================================================= */

function updateStats(){

  const monitors =
    document.getElementById(
      "statMonitors"
    );


  const booksEl =
    document.getElementById(
      "statBooks"
    );


  const flowEl =
    document.getElementById(
      "statFlow"
    );


  const wallsEl =
    document.getElementById(
      "statWalls"
    );


  const signalsEl =
    document.getElementById(
      "statSignals"
    );


  const lagEl =
    document.getElementById(
      "statLag"
    );


  if(
    monitors
  ){

    monitors.textContent =
      marketUniverse.length;

  }


  if(
    booksEl
  ){

    booksEl.textContent =
      metrics.books;

  }


  if(
    flowEl
  ){

    flowEl.textContent =
      metrics.flow;

  }


  if(
    wallsEl
  ){

    wallsEl.textContent =
      metrics.walls;

  }


  if(
    signalsEl
  ){

    signalsEl.textContent =
      [...signals.values()]
        .filter(
          signal =>
            signal.status ===
            "ACTIVE"
        )
        .length;

  }


  if(
    lagEl
  ){

    let latest =
      0;


    for(
      const health of
      symbolHealth.values()
    ){

      if(
        health.lastBookRx >
        latest
      ){

        latest =
          health.lastBookRx;

      }


      if(
        health.lastTradeRx >
        latest
      ){

        latest =
          health.lastTradeRx;

      }

    }


    const lag =
      latest > 0
        ? now() -
          latest
        : 0;


    lagEl.textContent =
      latest > 0
        ? `${Math.max(
            0,
            Math.round(
              lag
            )
          )}ms`
        : "—";

  }

}


/* =========================================================
   STATUS REFRESH
   ========================================================= */

function updateEngineStatus(){

  if(
    !engineRunning
  ){

    setStatus(
      "Остановлен"
    );

    return;

  }


  const active =
    [...signals.values()]
      .filter(
        signal =>
          signal.status ===
          "ACTIVE"
      )
      .length;


  const freshBooks =
    [...symbolHealth.values()]
      .filter(
        health =>
          health.bookValid &&
          now() -
          health.lastBookRx <=
          CONFIG.SYMBOL_STALE_MS
      )
      .length;


  const freshFlow =
    [...symbolHealth.values()]
      .filter(
        health =>
          now() -
          health.lastTradeRx <=
          CONFIG.FLOW_FRESH_MS
      )
      .length;


  setStatus(
    `Работает · `
    +
    `${freshBooks}/${marketUniverse.length} books · `
    +
    `${freshFlow}/${marketUniverse.length} flow · `
    +
    `${active} сигналов`
  );

}


/* =========================================================
   START SCANNER
   ========================================================= */

async function startScanner(){

  if(
    engineRunning
  ){

    return;

  }


  engineRunning =
    true;


  engineStartedAt =
    now();


  setStatus(
    "Запуск..."
  );


  try{

    /*
      1. Market metadata
    */

    await initializeMarket();


    /*
      2. HTF context
    */

    setStatus(
      "Загрузка HTF..."
    );


    await refreshHTF();


    /*
      3. WebSockets
    */

    setStatus(
      "Подключение WebSocket..."
    );


    await initializeWebSockets();


    /*
      4. Main loops
    */

    startEngineLoops();


    /*
      5. Periodic HTF refresh
    */

    htfTimer =
      setInterval(
        refreshHTFPeriodic,
        CONFIG.HTF_REFRESH_MS
      );


    /*
      6. Universe refresh.
    */

    universeTimer =
      setInterval(
        async () => {

          if(
            !engineRunning
          ){

            return;

          }


          await refreshUniverse();

        },

        600000
      );


    updateEngineStatus();

    renderApplication();

  }catch(
    error
  ){

    console.error(
      "START ERROR:",
      error
    );


    engineRunning =
      false;


    stopEngineLoops();


    closeAllSockets();


    setStatus(
      "Ошибка запуска"
    );

  }

}


/* =========================================================
   STOP SCANNER
   ========================================================= */

function stopScanner(){

  engineRunning =
    false;


  stopEngineLoops();


  closeAllSockets();


  setStatus(
    "Остановлен"
  );


  renderApplication();

}

  signals.clear();

  wallStates.clear();

  trades.clear();

  books.clear();

  symbolHealth.clear();


  metrics.books =
    0;

  metrics.flow =
    0;

  metrics.walls =
    0;

  metrics.signals =
    0;


  /*
    Если scanner запущен,
    заново создаём структуры.
  */

  for(
    const item of
    marketUniverse
  ){

    const symbol =
      item.symbol;


    ensureBook(

    );

    ensureTradeBuffer(
      symbol
    );

    wallStates.set(
      symbol,
      new Map()
    );

  }


  renderApplication();

}


/* =========================================================
   RECONNECT CHECK
   ========================================================= */

function performReconnectCheck(){

  if(
    !engineRunning
  ){

    return;

  }


  const timestamp =
    now();


  for(
    const state of
    socketStates
  ){

    if(
      !state.ws
    ){

      scheduleSocketReconnect(
        state
      );

      continue;

    }


    if(
      state.ws.readyState !==
      WebSocket.OPEN
    ){

      continue;

    }


    /*
      WebSocket открыт,
      но данных давно нет.
    */

    if(
      timestamp -
      state.lastRx >
      CONFIG.WS_STALE_MS
    ){

      try{

        state.ws.close();

      }catch(
        error
      ){

        console.warn(
          "Socket close:",
          error
        );

      }

      continue;

    }


    /*
      Проверяем символы
      внутри сокета.
    */

    for(
      const symbol of
      state.symbols
    ){

      checkSymbolHealth(
        symbol
      );

    }

  }

}
