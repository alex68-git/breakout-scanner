<script>
const DEPTH = 50;
const TOP = 80;
const SIGNAL_TTL = 900000;
const COOLDOWN = 90000;

let run = false;
let ws = [];
let reconnecting = false;
let reconnectLock = false;

let pingTimer = null;
let watchdogTimer = null;
let swingRefreshTimer = null;
let debounceTimer = null;
let managerTimer = null;
let audioCtx = null;

let books = new Map();
let trades = new Map();
let zones = new Map();
let signals = new Map();
let metrics = new Map();
let cooldowns = new Map();
let wallHistory = new Map();
let instrumentCache = new Map();

let symbols = [];
let pending = new Set();
let lastRx = Date.now();

const S = document.getElementById("signals");
const ST = document.getElementById("status");

const now = () => Date.now();
const pf = v => Number(v) >= 1000 ? Number(v).toFixed(2) : Number(v).toFixed(4);

function resetRuntime() {
books.clear();
trades.clear();
wallHistory.clear();
pending.clear();
}

function closeSockets() {
ws.forEach(x => {
try {
x.onopen = null;
x.onmessage = null;
x.onerror = null;
x.onclose = null;
x.close();
} catch(e) {}
});
ws = [];
}
// ==========================================================
// REST API И ЗАГРУЗКА ИНСТРУМЕНТОВ С ЗАЩИТОЙ ОТ RATE LIMIT (429)
// ==========================================================

async function loadInstrumentInfo() {
try {
const r = await fetch("https://api.bybit.com/v5/market/instruments-info?category=linear&limit=1000");
const j = await r.json();
(j.result?.list || []).forEach(i => {
instrumentCache.set(i.symbol, {
tickSize: +(i.priceFilter?.tickSize || 0.0001),
qtyStep: +(i.lotSizeFilter?.qtyStep || 0.001)
});
});
} catch(e) {
console.warn("Ошибка загрузки спецификаций контрактов", e);
}
}

async function start() {
if (run) return;
run = true;

ST.textContent = "Инициализация и загрузка спецификаций...";
await loadInstrumentInfo();

ST.textContent = "Получение списка монет...";

try {
const res = await fetch("https://api.bybit.com/v5/market/tickers?category=linear");
const json = await res.json();

const exclude = new Set(["BTCUSDT", "ETHUSDT", "SOLUSDT", "XRPUSDT", "DOGEUSDT"]);

symbols = [];
metrics.clear();

json.result.list
.filter(x => x.symbol.endsWith("USDT"))
.filter(x => !exclude.has(x.symbol))
.sort((a, b) => +b.turnover24h - +a.turnover24h)
.slice(0, TOP)
.forEach((x, i) => {
symbols.push(x.symbol);
const cached = instrumentCache.get(x.symbol);
metrics.set(x.symbol, {
rank: i + 1,
turnover: +x.turnover24h,
tickSize: cached ? cached.tickSize : +(x.priceFilter?.tickSize || 0.0001)
});
});

let loaded = 0;
for (const s of symbols) {
if (!run) return;
await loadSwings(s);
loaded++;
ST.textContent = `Разметка HTF: ${loaded}/${symbols.length}`;
// Пауза 80 мс для защиты от ошибки HTTP 429 (Too Many Requests)
await new Promise(r => setTimeout(r, 80));
}

connectSockets();
startBackgroundJobs();
ST.textContent = `Мониторинг запущен (${symbols.length} монет)`;

} catch(e) {
run = false;
ST.textContent = "Ошибка запуска";
}
}

// ==========================================================
// ЗАГРУЗКА HTF ЗОН (ИСКЛЮЧАЯ НЕЗАКРЫТУЮ СВЕЧУ)
// ==========================================================

async function loadSwings(symbol) {
try {
const fetchK = (tf, lim) => fetch(`https://api.bybit.com/v5/market/kline?category=linear&symbol=${symbol}&interval=${tf}&limit=${lim}`)
.then(r => r.ok ? r.json() : null);

const r4 = await fetchK(240, 60);
const r1 = await fetchK(60, 60);
const r15 = await fetchK(15, 60);
const r5 = await fetchK(5, 40);

const parse = list => (list || []).map(x => ({
h: +x[2],
l: +x[3],
c: +x[4]
})).reverse();

// .slice(0, -1) отсекает текущую формующуюся свечу от фрактального анализа
const k4 = parse(r4?.result?.list).slice(0, -1);
const k1 = parse(r1?.result?.list).slice(0, -1);
const k15 = parse(r15?.result?.list).slice(0, -1);
const k5 = parse(r5?.result?.list);

let raw = [];
extractFractals(k4, "4H", 3, raw);
extractFractals(k1, "1H", 2, raw);
extractFractals(k15, "15M", 1, raw);

zones.set(symbol, {
zones: buildZones(raw),
k5m: k5
});
} catch(e) {}
}

function extractFractals(arr, tf, weight, out) {
if (!arr || arr.length < 5) return;
for (let i = 2; i < arr.length - 2; i++) {
const H = arr[i].h;
const L = arr[i].l;

if (H > arr[i-1].h && H > arr[i-2].h && H > arr[i+1].h && H > arr[i+2].h) {
out.push({ price: H, side: "SHORT", tf, weight });
}
if (L < arr[i-1].l && L < arr[i-2].l && L < arr[i+1].l && L < arr[i+2].l) {
out.push({ price: L, side: "LONG", tf, weight });
}
}
}

function buildZones(raw) {
const merge = list => {
list.sort((a, b) => a.price - b.price);
const out = [];
for (const lvl of list) {
if (!out.length) {
out.push({ min: lvl.price, max: lvl.price, tf: lvl.tf, weight: lvl.weight, side: lvl.side });
continue;
}
const last = out[out.length - 1];
if ((lvl.price - last.max) / last.max <= 0.0035) {
last.max = lvl.price;
if (lvl.weight > last.weight) {
last.weight = lvl.weight;
last.tf = lvl.tf;
}
} else {
out.push({ min: lvl.price, max: lvl.price, tf: lvl.tf, weight: lvl.weight, side: lvl.side });
}
}
return out;
};

return [
...merge(raw.filter(x => x.side === "LONG")),
...merge(raw.filter(x => x.side === "SHORT"))
];
}

function atr(k) {
if (!k || k.length < 2) return 0;
let sum = 0;
for (let i = 1; i < k.length; i++) {
sum += Math.max(
k[i].h - k[i].l,
Math.abs(k[i].h - k[i-1].c),
Math.abs(k[i].l - k[i-1].c)
);
}
return sum / (k.length - 1);
}

// ==========================================================
// РАСЧЕТ ПЛОТНОСТЕЙ И КЛАСТЕРОВ СТАКАНА
// ==========================================================

function getPeakCluster(map, center, symbol) {
if (!map || !map.size) return null;
const tick = metrics.get(symbol)?.tickSize || 0.0001;
const levels = [];

for (const [p, q] of map) {
if (Math.abs(p - center) / center <= 0.003) {
levels.push({ price: p, usd: p * q });
}
}

if (!levels.length) return null;
levels.sort((a, b) => a.price - b.price);

let peak = levels[0];
for (const l of levels) {
if (l.usd > peak.usd) peak = l;
}

let core = 0;
let windowUsd = 0;
let weighted = 0;
let ticks = 0;

for (const l of levels) {
windowUsd += l.usd;
if (Math.abs(l.price - peak.price) <= tick * 2.5) {
core += l.usd;
weighted += l.price * l.usd;
ticks++;
}
}

const concentration = core / windowUsd;
const min = Math.max(15000, (metrics.get(symbol)?.turnover || 5000000) / 1440 * 1.8);

if (core < min) return null;
// Порог концентрации снижен до 0.35, чтобы не отбрасывать плотности в широком стакане
if (concentration < 0.35) return null;

return {
peakPrice: weighted / core,
coreUsd: core,
windowUsd,
concentration,
ticks
};
}
// ==========================================================
// WEBSOCKET ENGINE (С ИСПРАВЛЕННОЙ ВАЛИДАЦИЕЙ SEQ)
// ==========================================================

function connectSockets() {
closeSockets();
ws = [];
lastRx = now();

for (let i = 0; i < symbols.length; i += 20) {
const group = symbols.slice(i, i + 20);
createSocket(group);
}

if (pingTimer) clearInterval(pingTimer);
pingTimer = setInterval(() => {
ws.forEach(s => {
if (s.readyState === WebSocket.OPEN) {
s.send(JSON.stringify({ op: "ping" }));
}
});
}, 20000);
}

function createSocket(group) {
const socket = new WebSocket("wss://stream.bybit.com/v5/public/linear");
ws.push(socket);

socket.onopen = async () => {
const args = [];
group.forEach(sym => {
args.push(`orderbook.${DEPTH}.${sym}`);
args.push(`publicTrade.${sym}`);
});

for (let i = 0; i < args.length; i += 10) {
if (socket.readyState !== WebSocket.OPEN) break;
socket.send(JSON.stringify({ op: "subscribe", args: args.slice(i, i + 10) }));
await new Promise(r => setTimeout(r, 60));
}
};

socket.onmessage = e => {
if (!run) return;
lastRx = now();

try {
const d = JSON.parse(e.data);
if (!d.topic) return;
const p = d.topic.split(".");
const type = p[0];
const symbol = p[p.length - 1];

if (type === "orderbook") handleBook(symbol, d);
else if (type === "publicTrade") handleTrades(symbol, d.data);
} catch(e) {}
};

socket.onerror = () => { if (run) setTimeout(repairConnection, 1200); };
socket.onclose = () => { if (run) setTimeout(repairConnection, 1200); };
}

function handleBook(symbol, data) {
let book = books.get(symbol) || {
bids: new Map(),
asks: new Map(),
last: 0,
seq: 0,
valid: false
};

if (data.type === "snapshot") {
book.bids.clear();
book.asks.clear();
(data.data.b || []).forEach(o => book.bids.set(+o[0], +o[1]));
(data.data.a || []).forEach(o => book.asks.set(+o[0], +o[1]));
book.seq = data.data.u || 0;
book.valid = true;
} else {
if (!book.valid) return;
const seq = data.data.u || 0;
if (seq <= book.seq) return; // Игнорируем старые пакеты

// Исправление: Не сбрасываем book.valid при seq !== seq + 1, так как Bybit пропускает ID в дельтах
(data.data.b || []).forEach(o => {
+o[1] ? book.bids.set(+o[0], +o[1]) : book.bids.delete(+o[0]);
});
(data.data.a || []).forEach(o => {
+o[1] ? book.asks.set(+o[0], +o[1]) : book.asks.delete(+o[0]);
});
book.seq = seq;
}

books.set(symbol, book);
pending.add(symbol);
}

function handleTrades(symbol, list) {
if (!list || !list.length) return;

let book = books.get(symbol) || {
bids: new Map(), asks: new Map(), last: 0, seq: 0, valid: false
};
book.last = +list[0].p;
books.set(symbol, book);

if (!trades.has(symbol)) trades.set(symbol, []);
const buf = trades.get(symbol);

list.forEach(t => {
buf.push({
p: +t.p,
qty: +t.v,
usd: +t.p * +t.v,
side: t.S,
id: t.i,
time: t.T || now()
});
});

// Увеличен буфер сделок до 120 секунд для корректного анализа поглощения
const cut = now() - 120000;
while (buf.length && buf[0].time < cut) {
buf.shift();
}

pending.add(symbol);
}

function repairConnection() {
if (!run || reconnectLock) return;
reconnectLock = true;

const dead = ws.length === 0 || ws.some(x => x.readyState !== WebSocket.OPEN);
const stale = now() - lastRx > 12000;

if (!dead && !stale) {
reconnectLock = false;
return;
}

ST.textContent = "Восстановление соединения...";
resetRuntime();
connectSockets();

setTimeout(() => {
reconnectLock = false;
if (run) ST.textContent = `Мониторинг запущен (${symbols.length} монет)`;
}, 2500);
}

function startWatchdog() {
if (watchdogTimer) clearInterval(watchdogTimer);
watchdogTimer = setInterval(() => { repairConnection(); }, 5000);
}

function startDebounceEngine() {
if (debounceTimer) clearInterval(debounceTimer);
debounceTimer = setInterval(() => {
if (!run || !pending.size) return;
const list = [...pending];
pending.clear();
list.forEach(scan);
}, 120);
}
// ==========================================================
// АНАЛИЗАТОР СТЕН И ГЛАВНЫЙ СКАЧАЮЩИЙ ДВИЖОК
// ==========================================================

function analyzeWall(symbol, side, cluster) {
const tick = metrics.get(symbol)?.tickSize || 0.0001;
// Округление цены до тика предотвращает дублирование ключей при микроколебаниях
const gridPrice = Math.round(cluster.peakPrice / tick) * tick;
const key = `${symbol}_${side}_${gridPrice.toFixed(6)}`;

let state = wallHistory.get(key);
if (!state) {
state = { firstSeen: now(), lastSeen: now(), maxUsd: cluster.coreUsd };
wallHistory.set(key, state);
} else {
state.lastSeen = now();
if (cluster.coreUsd > state.maxUsd) state.maxUsd = cluster.coreUsd;
}

const age = (state.lastSeen - state.firstSeen) / 1000;
let marketHits = 0;
const arr = trades.get(symbol) || [];

for (const t of arr) {
const hit = side === "LONG" ? t.side === "Sell" : t.side === "Buy";
if (hit && Math.abs(t.p - cluster.peakPrice) / cluster.peakPrice < 0.002) {
marketHits += t.usd;
}
}

const eaten = Math.max(0, state.maxUsd - cluster.coreUsd);
const absorption = eaten > 0 ? marketHits / eaten : (marketHits > 0 ? 1 : 0);
const spoof = eaten > marketHits * 2.5 && cluster.coreUsd < state.maxUsd * 0.30;

return { age, marketHits, eaten, absorption, spoof };
}

function scan(symbol) {
const book = books.get(symbol);
const zoneData = zones.get(symbol);

if (!book || !book.valid || !zoneData || !book.last) return;

const active = zoneData.zones.filter(z => {
const tol = z.tf === "4H" ? 0.004 : z.tf === "1H" ? 0.0025 : 0.0015;
return book.last >= z.min * (1 - tol) && book.last <= z.max * (1 + tol);
});

if (!active.length) return;

const A = atr(zoneData.k5m);

for (const zone of active) {
const cooldownKey = `${symbol}_${zone.side}`;
if (cooldowns.has(cooldownKey) && cooldowns.get(cooldownKey) > now()) continue;

const opposite = zone.side === "LONG" ? "SHORT" : "LONG";
if ([...signals.values()].some(s => s.symbol === symbol && s.side === opposite)) continue;

const center = zone.side === "LONG" ? zone.min : zone.max;
const cluster = getPeakCluster(zone.side === "LONG" ? book.bids : book.asks, center, symbol);

if (!cluster) continue;

const wall = analyzeWall(symbol, zone.side, cluster);
if (wall.spoof) continue;

const bounced = zone.side === "LONG"
? book.last >= cluster.peakPrice + A * 0.15
: book.last <= cluster.peakPrice - A * 0.15;

if (!bounced) continue;

let score = 0;
const reasons = [];

if (zone.tf === "4H") { score += 30; reasons.push("4H зона"); }
else if (zone.tf === "1H") { score += 20; reasons.push("1H зона"); }
else { score += 10; reasons.push("15M зона"); }

if (cluster.concentration >= 0.50) { score += 20; reasons.push(`Ядро ${(cluster.concentration*100).toFixed(0)}%`); }
else { score += 10; reasons.push(`Ядро ${(cluster.concentration*100).toFixed(0)}%`); }

if (wall.age >= 120) { score += 15; reasons.push("Стена >120с"); }
else if (wall.age >= 30) { score += 10; reasons.push("Стена >30с"); }

if (wall.absorption >= 0.80) { score += 15; reasons.push("Absorption"); }
score += 10; reasons.push("Bounce ATR");

if (score < 65) continue;

// Защита от слишком узкого SL: минимум 0.3% от цены для перекрытия комиссий и спреда
const minBuffer = book.last * 0.003;
const slDistance = Math.max(A * 1.5, minBuffer);

const sl = zone.side === "LONG" ? cluster.peakPrice - slDistance : cluster.peakPrice + slDistance;
const risk = Math.abs(book.last - sl);

const tp1 = zone.side === "LONG" ? book.last + risk * 2 : book.last - risk * 2;
const tp2 = zone.side === "LONG" ? book.last + risk * 3.5 : book.last - risk * 3.5;

const key = `${symbol}_${zone.side}_${zone.min.toFixed(6)}`;

if (signals.has(key)) {
const s = signals.get(key);
s.price = book.last;
s.score = score;
s.coreUsd = cluster.coreUsd;
s.reasons = reasons;
continue;
}

signals.set(key, {
key, symbol, side: zone.side, tf: zone.tf, score,
price: book.last, zoneMin: zone.min, zoneMax: zone.max,
peakPrice: cluster.peakPrice, coreUsd: cluster.coreUsd,
wallAge: wall.age, absorption: wall.absorption,
sl, tp1, tp2, reasons, created: now()
});
}

render();
}

// ==========================================================
// МЕНЕДЖЕР СИГНАЛОВ И РЕНДЕР UI
// ==========================================================

function startSignalManager() {
if (managerTimer) clearInterval(managerTimer);
managerTimer = setInterval(() => {
if (!run) return;
const current = now();
let changed = false;

for (const [key, time] of cooldowns) {
if (current > time) cooldowns.delete(key);
}

for (const [key, wall] of wallHistory) {
if (current - wall.lastSeen > 180000) wallHistory.delete(key);
}

for (const [key, sig] of signals) {
const book = books.get(sig.symbol);
if (!book || !book.last) continue;

if (current - sig.created > SIGNAL_TTL) {
signals.delete(key);
changed = true;
continue;
}

const cluster = getPeakCluster(sig.side === "LONG" ? book.bids : book.asks, sig.peakPrice, sig.symbol);
if (!cluster || cluster.coreUsd < sig.coreUsd * 0.35) {
signals.delete(key);
cooldowns.set(`${sig.symbol}_${sig.side}`, current + 60000);
changed = true;
continue;
}

sig.price = book.last;
sig.coreUsd = cluster.coreUsd;
}

if (changed) render();
}, 1000);
}

function startBackgroundJobs() {
startWatchdog();
startSignalManager();
startDebounceEngine();

if (swingRefreshTimer) clearInterval(swingRefreshTimer);
swingRefreshTimer = setInterval(async () => {
if (!run) return;
for (const s of symbols) {
await loadSwings(s);
await new Promise(r => setTimeout(r, 50));
}
}, 300000);
}

function playSignalSound() {
try {
if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
if (audioCtx.state === "suspended") audioCtx.resume();
const osc = audioCtx.createOscillator();
const gain = audioCtx.createGain();
osc.connect(gain);
gain.connect(audioCtx.destination);
osc.frequency.value = 880;
gain.gain.value = 0.12;
osc.start();
osc.stop(audioCtx.currentTime + 0.12);
} catch(e) {}
}

let lastSignalCount = 0;

function render() {
if (signals.size > lastSignalCount) playSignalSound();
lastSignalCount = signals.size;

if (!signals.size) {
S.innerHTML = `
<div style="color:#8f98a5;padding:30px;text-align:center">
Мониторинг институциональных зон и стакана.<br>
Ожидание подтверждённых сетапов...
</div>`;
return;
}

const list = [...signals.values()]
.sort((a, b) => b.score - a.score || b.created - a.created)
.slice(0, 15);

S.innerHTML = list.map(sig => {
const scoreClass = sig.score >= 80 ? "high" : sig.score >= 65 ? "mid" : "low";
const sideColor = sig.side === "LONG" ? "#0ecb81" : "#f6465d";
const rr = Math.abs(sig.tp1 - sig.price) / Math.max(0.0001, Math.abs(sig.price - sig.sl));
const age = Math.floor((now() - sig.created) / 1000);

return `
<div class="card ${sig.side === "SHORT" ? "short" : ""}">
<div class="card-head">
<div>
<div style="font-size:16px;font-weight:800">${sig.symbol}</div>
<div style="color:${sideColor};font-weight:700">${sig.side} · ENTRY · ${sig.tf}</div>
</div>
<div class="score ${scoreClass}">${sig.score}/100</div>
</div>
<div class="grid">
<div class="box">Вход<b>${pf(sig.price)}</b></div>
<div class="box">Peak<b>${pf(sig.peakPrice)}</b></div>
<div class="box">SL<b>${pf(sig.sl)}</b></div>
<div class="box">TP1<b>${pf(sig.tp1)}</b></div>
<div class="box">TP2<b>${pf(sig.tp2)}</b></div>
</div>
<div class="grid">
<div class="box">Ядро<b>$${Math.round(sig.coreUsd).toLocaleString()}</b></div>
<div class="box">Absorption<b>${(sig.absorption || 0).toFixed(2)}</b></div>
<div class="box">Стена<b>${Math.round(sig.wallAge || 0)} c</b></div>
<div class="box">Риск<b>${((Math.abs(sig.price - sig.sl) / sig.price) * 100).toFixed(2)}%</b></div>
<div class="box">R:R<b>${rr.toFixed(2)}</b></div>
</div>
<div class="tags">
${sig.reasons.map(x => `<span class="tag">✔ ${x}</span>`).join("")}
</div>
<div class="info">
<span>Возраст сигнала: ${age} сек</span>
<span>${sig.zoneMin ? `${pf(sig.zoneMin)}–${pf(sig.zoneMax)}` : "HTF Zone"}</span>
</div>
</div>`;
}).join("");
}

function stop() {
run = false;
[pingTimer, watchdogTimer, managerTimer, debounceTimer, swingRefreshTimer].forEach(t => {
if (t) clearInterval(t);
});
pingTimer = watchdogTimer = managerTimer = debounceTimer = swingRefreshTimer = null;
closeSockets();
pending.clear();
ST.textContent = "Сканер остановлен.";
}

function clearCards() {
signals.clear();
lastSignalCount = 0;
render();
}

setInterval(() => {
if (!run) return;
const alive = ws.filter(x => x.readyState === WebSocket.OPEN).length;
const lag = Math.max(0, Math.floor((now() - lastRx) / 1000));
ST.textContent = `WS ${alive}/${Math.ceil(symbols.length / 20)} · Монет ${symbols.length}/${TOP} · Лаг ${lag}с`;
}, 1000);

window.addEventListener("beforeunload", () => { stop(); });
</script>
</body>
</html>
