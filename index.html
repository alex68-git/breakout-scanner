<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bybit Institutional OrderFlow Engine v7.0 (Fixed & Enhanced)</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; padding: 15px; background: #080a0c; color: #eaecef; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; }
.header { background: #12161c; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #1e2630; }
h1 { font-size: 18px; margin: 0 0 12px 0; color: #f0b90b; display: flex; align-items: center; gap: 8px; }
.controls { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; align-items: center; }
button { border: none; border-radius: 6px; padding: 10px 16px; font-weight: bold; cursor: pointer; background: #f0b90b; color: #000; font-size: 12px; }
button.stop { background: #f6465d; color: white; }
button.clear { background: #2b313a; color: white; }
.status-bar { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 10px; }
.stat-card { background: #181e25; border-radius: 6px; padding: 8px; text-align: center; border: 1px solid #222c37; font-size: 11px; color: #848e9c; }
.stat-card span { display: block; font-size: 13px; font-weight: bold; margin-top: 2px; color: #eaecef; }
.signals { height: 72vh; overflow-y: auto; }
.card { background: #12161c; border-radius: 8px; padding: 14px; margin-bottom: 10px; border-left: 5px solid #0ecb81; border: 1px solid #1e2630; }
.card.hold { border-left-color: #3b82f6; }
.card.broken { border-left-color: #f6465d; opacity: 0.6; }
.head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.symbol { font-size: 16px; font-weight: bold; }
.badge { font-weight: bold; font-size: 11px; padding: 3px 8px; border-radius: 4px; text-transform: uppercase; background: rgba(14, 203, 129, 0.2); color: #0ecb81; }
.badge.short { background: rgba(246, 70, 93, 0.2); color: #f6465d; }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 10px 0; font-size: 11px; }
.box { background: #181e25; padding: 6px 8px; border-radius: 4px; color: #848e9c; }
.box strong { display: block; color: #eaecef; font-size: 12px; margin-top: 2px; }
.reason { color: #848e9c; font-size: 11px; margin-top: 8px; line-height: 1.4; background: #181e25; padding: 8px; border-radius: 4px; }
.empty { text-align: center; color: #848e9c; padding: 50px; font-size: 13px; }
</style>
</head>
<body>

<div class="header">
    <h1>⚡ OrderFlow Engine v7.0</h1>
    <div class="controls">
        <button onclick="startEngine()">▶ Запустить Сканер</button>
        <button class="stop" onclick="stopEngine()">⏹ Стоп</button>
        <button class="clear" onclick="clearSignals()">🗑 Очистить</button>
    </div>
    <div class="status-bar">
        <div class="stat-card">Монеты<span id="coinCount">0</span></div>
        <div class="stat-card">WS Потоки<span id="wsStatus" style="color:#f6465d">0/4</span></div>
        <div class="stat-card">Сигналы (ENTRY)<span id="sigCount">0</span></div>
        <div class="stat-card">Всего Кластеров<span id="clusterCount">0</span></div>
    </div>
</div>

<div id="signals" class="signals">
    <div class="empty" id="emptyState">Нажмите "Запустить Сканер" для старта инициализации...</div>
</div>

<script>
const workerCode = `
const ORDERBOOK_DEPTH = 50;
const LEVEL_COOLDOWN = 90000;

let wsConnections = [];
let symbols = [];
let symbolMetrics = new Map();
let running = false;

const books = new Map();
const swingLevels = new Map();
const states = new Map();
const cooldowns = new Map();
const trades = new Map();

function now() { return Date.now(); }

self.onmessage = function(e) {
    const { type, payload } = e.data;
    if (type === 'START') {
        symbols = payload.symbols;
        payload.metrics.forEach(([s, m]) => symbolMetrics.set(s, m));
        running = true;
        initMultiWS();
        startGarbageCollector();
        startManager();
    } else if (type === 'STOP') {
        running = false;
        closeWS();
    } else if (type === 'SWING') {
        swingLevels.set(payload.symbol, payload.data);
    }
};

function startGarbageCollector() {
    setInterval(() => {
        if (!running) return;
        const currentTime = now();
        for (const [key, timestamp] of cooldowns.entries()) {
            if (currentTime > timestamp) cooldowns.delete(key);
        }
        for (const [key, state] of states.entries()) {
            if (currentTime - state.lastTrade > 900000) states.delete(key);
        }
        for (const [symbol, buffer] of trades.entries()) {
            const cutoff = currentTime - 30000;
            while (buffer.length > 0 && buffer[0].t < cutoff) buffer.shift();
            if (buffer.length === 0) trades.delete(symbol);
        }
    }, 10000);
}

function closeWS() {
    wsConnections.forEach(ws => { try { ws.onclose=null; ws.close(); } catch(e){} });
    wsConnections = [];
}

function initMultiWS() {
    closeWS();
    books.clear(); states.clear(); trades.clear();
    const chunkSize = 25;
    let activeWSCount = 0;

    for (let i = 0; i < symbols.length; i += chunkSize) {
        const group = symbols.slice(i, i + chunkSize);
        createSingleWS(group, () => {
            activeWSCount++;
            self.postMessage({ type: 'WS', payload: \`\${activeWSCount}/4\` });
        });
    }
}

function createSingleWS(group, onOpenCb) {
    const ws = new WebSocket("wss://stream.bybit.com/v5/public/linear");
    wsConnections.push(ws);

    ws.onopen = async () => {
        if (onOpenCb) onOpenCb();
        const args = [];
        group.forEach(s => {
            args.push(\`orderbook.\${ORDERBOOK_DEPTH}.\${s}\`);
            args.push(\`publicTrade.\${s}\`);
        });

        for (let i = 0; i < args.length; i += 20) {
            ws.send(JSON.stringify({ op: "subscribe", args: args.slice(i, i + 20) }));
            await new Promise(r => setTimeout(r, 80));
        }
    };

    ws.onmessage = (e) => {
        if (!running) return;
        try {
            const data = JSON.parse(e.data);
            if (!data.topic) return;
            const parts = data.topic.split('.');
            const type = parts[0], symbol = parts[parts.length - 1];

            if (type === 'orderbook') handleOrderbook(symbol, data);
            else if (type === 'publicTrade') handleTrades(symbol, data.data);
        } catch(err){}
    };

    ws.onclose = () => { if (running) setTimeout(() => createSingleWS(group, null), 3000); };
}

function handleOrderbook(symbol, data) {
    let book = books.get(symbol);
    if (data.type === 'snapshot') {
        book = { bids: new Map(), asks: new Map(), lastPrice: 0 };
        data.data.b.forEach(o => book.bids.set(parseFloat(o[0]), parseFloat(o[1])));
        data.data.a.forEach(o => book.asks.set(parseFloat(o[0]), parseFloat(o[1])));
        books.set(symbol, book);
    } else if (data.type === 'delta') {
        if (!book) return;
        data.data.b.forEach(o => { 
            const p=parseFloat(o[0]), q=parseFloat(o[1]); 
            q===0 ? book.bids.delete(p) : book.bids.set(p,q); 
        });
        data.data.a.forEach(o => { 
            const p=parseFloat(o[0]), q=parseFloat(o[1]); 
            q===0 ? book.asks.delete(p) : book.asks.set(p,q); 
        });
    }
    processEngine(symbol);
}

function handleTrades(symbol, tradeList) {
    if (!tradeList || !tradeList.length) return;
    const book = books.get(symbol);
    if (book) book.lastPrice = parseFloat(tradeList[0].p);

    if (!trades.has(symbol)) trades.set(symbol, []);
    const buffer = trades.get(symbol);

    tradeList.forEach(t => {
        buffer.push({
            p: parseFloat(t.p),
            v: parseFloat(t.v),
            val: parseFloat(t.p) * parseFloat(t.v),
            side: t.S,
            t: t.T || now()
        });
    });
}

function getCluster(sourceMap, targetPrice, symbol) {
    if (!sourceMap || sourceMap.size === 0) return null;
    let totalUsd = 0, peakPrice = targetPrice, maxUsd = 0, ticks = 0;
    const minClusterSize = Math.max(10000, (symbolMetrics.get(symbol)?.turnover || 5000000) / 1440 * 1.2);

    for (const [p, q] of sourceMap.entries()) {
        if (Math.abs(p - targetPrice) / targetPrice <= 0.005) {
            const usd = p * q;
            totalUsd += usd;
            ticks++;
            if (usd > maxUsd) { maxUsd = usd; peakPrice = p; }
        }
    }

    if (totalUsd < minClusterSize) return null;
    return { usd: totalUsd, price: peakPrice, min: peakPrice * 0.998, max: peakPrice * 1.002, ticks };
}

function calcAbsorptionRatio(symbol, side, cluster) {
    const buf = trades.get(symbol) || [];
    let marketVol = 0;

    buf.forEach(tr => {
        const hit = side === "LONG" ? tr.side === "Sell" : tr.side === "Buy";
        if (hit && Math.abs(tr.p - cluster.price) / cluster.price <= 0.003) {
            marketVol += tr.val;
        }
    });

    return marketVol / cluster.usd;
}

function detectSpoof(symbol, side, cluster) {
    const book = books.get(symbol);
    if (!book) return false;
    const source = side === "LONG" ? book.bids : book.asks;
    let currentTotal = 0;

    for (const [p, q] of source.entries()) {
        if (Math.abs(p - cluster.price) / cluster.price <= 0.005) {
            currentTotal += p * q;
        }
    }

    const remaining = currentTotal / cluster.usd;
    if (remaining < 0.35) {
        const ratio = calcAbsorptionRatio(symbol, side, cluster);
        if (ratio < 0.15) return true; 
    }
    return false;
}

function detectLiquidityPull(symbol, side, cluster) {
    const book = books.get(symbol);
    if (!book) return false;
    const source = side === "LONG" ? book.bids : book.asks;
    let currentTotal = 0;

    for (const [p, q] of source.entries()) {
        if (Math.abs(p - cluster.price) / cluster.price <= 0.003) {
            currentTotal += p * q;
        }
    }
    return (currentTotal / cluster.usd) < 0.30;
}

function calcATR(k5m) {
    if (!k5m || k5m.length < 2) return 0;
    let trSum = 0;
    for (let i = 1; i < k5m.length; i++) {
        const tr = Math.max(k5m[i].h - k5m[i].l, Math.abs(k5m[i].h - k5m[i-1].c), Math.abs(k5m[i].l - k5m[i-1].c));
        trSum += tr;
    }
    return trSum / (k5m.length - 1);
}

function processEngine(symbol) {
    const book = books.get(symbol);
    const swings = swingLevels.get(symbol);
    if (!book || !swings || !book.lastPrice) return;

    const levels = [
        ...swings.lows.map(l => ({ p: l, side: 'LONG' })),
        ...swings.highs.map(h => ({ p: h, side: 'SHORT' }))
    ];

    levels.forEach(l => {
        const key = \`\${symbol}_\${l.side}_\${l.p}\`;
        if (cooldowns.has(key)) return;

        const source = l.side === "LONG" ? book.bids : book.asks;
        const c = getCluster(source, l.p, symbol);
        if (!c) return;

        let st = states.get(key) || { hits: 0, abs: 0, touch: false, min: book.lastPrice, max: book.lastPrice, lastTrade: 0, state: "TRACKING", entryPrice: 0, cluster: c };

        const border = l.side === "LONG" ? c.max : c.min;
        if (Math.abs(book.lastPrice - border) / border <= 0.0025) st.touch = true;

        if (!st.touch) { states.set(key, st); return; }

        st.min = Math.min(st.min, book.lastPrice);
        st.max = Math.max(st.max, book.lastPrice);

        const arr = trades.get(symbol) || [];
        arr.forEach(t => {
            if (t.t <= st.lastTrade) return;
            const hit = l.side === "LONG" ? t.side === "Sell" : t.side === "Buy";
            if (hit && t.p >= c.min * 0.995 && t.p <= c.max * 1.005) {
                st.hits++;
                st.abs += t.val;
            }
            st.lastTrade = Math.max(st.lastTrade, t.t);
        });

        const ATR = calcATR(swings.k5m);
        const stop = l.side === "LONG" ? c.min - ATR * 0.2 : c.max + ATR * 0.2;
        const bounce = l.side === "LONG" ? book.lastPrice - st.min : st.max - book.lastPrice;
        const risk = Math.abs(book.lastPrice - stop);

        const spoof = detectSpoof(symbol, l.side, c);
        const pull = detectLiquidityPull(symbol, l.side, c);

        if ((st.hits >= 2 || st.abs >= 5000) && bounce >= ATR * 0.15 && !spoof && !pull && st.state === "TRACKING") {
            cooldowns.set(key, now() + LEVEL_COOLDOWN);
            st.state = "ENTRY";
            st.entryPrice = book.lastPrice;

            self.postMessage({
                type: "ENTRY",
                payload: {
                    key, symbol, side: l.side,
                    state: "ENTRY",
                    price: book.lastPrice,
                    cluster: c.usd,
                    clusterPrice: c.price,
                    ticks: c.ticks,
                    hits: st.hits,
                    abs: st.abs,
                    sl: stop,
                    tp: book.lastPrice + (l.side === "LONG" ? risk * 2 : -risk * 2),
                    bounce,
                    atr: ATR
                }
            });
        }
        states.set(key, st);
    });
}

function startManager() {
    setInterval(() => {
        if (!running) return;
        states.forEach((st, key) => {
            if (st.state !== "ENTRY" && st.state !== "HOLD") return;
            const book = books.get(st.symbol);
            if (!book || !book.lastPrice) return;

            const price = book.lastPrice;
            const atr = st.atr || 0;

            if (st.side === "LONG") {
                if (price > st.entryPrice + atr * 0.4 && st.state !== "HOLD") {
                    st.state = "HOLD";
                    self.postMessage({ type: "SIGNAL_UPDATE", payload: { key, state: "HOLD", reason: "Уровень удержался" } });
                }
                if (price < st.cluster.price - atr * 0.25 && st.state !== "BROKEN") {
                    st.state = "BROKEN";
                    self.postMessage({ type: "SIGNAL_UPDATE", payload: { key, state: "BROKEN", reason: "Уровень сломан" } });
                }
            } else {
                if (price < st.entryPrice - atr * 0.4 && st.state !== "HOLD") {
                    st.state = "HOLD";
                    self.postMessage({ type: "SIGNAL_UPDATE", payload: { key, state: "HOLD", reason: "Сопротивление удержалось" } });
                }
                if (price > st.cluster.price + atr * 0.25 && st.state !== "BROKEN") {
                    st.state = "BROKEN";
                    self.postMessage({ type: "SIGNAL_UPDATE", payload: { key, state: "BROKEN", reason: "Сопротивление пробито" } });
                }
            }
        });
    }, 700);
}
`;

// ============================================================================
// MAIN THREAD LOGIC
// ============================================================================
let worker = null;
let running = false;
const signals = new Map();
const symbols = [];
const metrics = [];

function money(v) { return Number(v).toLocaleString("en-US", { maximumFractionDigits: 0 }); }
function price(v) { return Number(v) >= 1000 ? Number(v).toFixed(2) : Number(v).toFixed(4); }

async function loadSwings(symbol) {
    try {
        const [r5, r60] = await Promise.all([
            fetch(`https://api.bybit.com/v5/market/kline?category=linear&symbol=${symbol}&interval=5&limit=40`),
            fetch(`https://api.bybit.com/v5/market/kline?category=linear&symbol=${symbol}&interval=60&limit=24`)
        ]);

        const j5 = await r5.json();
        const j60 = await r60.json();
        if (!j5.result?.list) return;

        const k5 = j5.result.list.map(k => ({ h: +k[2], l: +k[3], c: +k[4] })).reverse();
        const highs = [], lows = [];

        for (let i = 2; i < k5.length - 2; i++) {
            if (k5[i].h > k5[i-1].h && k5[i].h > k5[i-2].h && k5[i].h > k5[i+1].h && k5[i].h > k5[i+2].h) highs.push(k5[i].h);
            if (k5[i].l < k5[i-1].l && k5[i].l < k5[i-2].l && k5[i].l < k5[i+1].l && k5[i].l < k5[i+2].l) lows.push(k5[i].l);
        }

        if (worker) {
            worker.postMessage({ type: "SWING", payload: { symbol, data: { highs, lows, k5m: k5 } } });
        }
    } catch(e){}
}

async function startEngine() {
    if (running) return;
    running = true;

    worker = new Worker(URL.createObjectURL(new Blob([workerCode], { type: "text/javascript" })));

    worker.onmessage = e => {
        const { type, payload } = e.data;
        if (type === "WS") {
            document.getElementById("wsStatus").innerText = payload;
            document.getElementById("wsStatus").style.color = "#0ecb81";
        }
        if (type === "ENTRY") {
            signals.set(payload.key, payload);
            render();
        }
        if (type === "SIGNAL_UPDATE") {
            if (signals.has(payload.key)) {
                const s = signals.get(payload.key);
                s.state = payload.state;
                s.reason = payload.reason;
                render();
            }
        }
    };

    document.getElementById("emptyState").innerText = "Загрузка списка монет и уровней...";

    const res = await fetch("https://api.bybit.com/v5/market/tickers?category=linear");
    const json = await res.json();

    const exclude = ["BTCUSDT", "ETHUSDT", "SOLUSDT", "XRPUSDT", "DOGEUSDT"];
    const list = json.result.list
        .filter(i => i.symbol.endsWith("USDT"))
        .filter(i => !exclude.includes(i.symbol))
        .sort((a,b) => +b.turnover24h - +a.turnover24h)
        .slice(0, 100);

    symbols.length = 0; metrics.length = 0;
    for (let i = 0; i < list.length; i++) {
        symbols.push(list[i].symbol);
        metrics.push([list[i].symbol, { rank: i + 1, turnover: +list[i].turnover24h }]);
    }

    document.getElementById("coinCount").innerText = symbols.length;

    for (let i = 0; i < symbols.length; i++) {
        await loadSwings(symbols[i]);
        await new Promise(r => setTimeout(r, 60));
    }

    worker.postMessage({ type: "START", payload: { symbols, metrics } });
    document.getElementById("emptyState").innerText = "Мониторинг запущен. Ожидание сигналов...";

    setInterval(async () => {
        if (!running) return;
        for (let i = 0; i < symbols.length; i += 5) {
            await Promise.all(symbols.slice(i, i + 5).map(loadSwings));
            await new Promise(r => setTimeout(r, 200));
        }
    }, 300000);
}

function stopEngine() {
    running = false;
    if (worker) { worker.postMessage({ type: "STOP" }); worker.terminate(); worker = null; }
    document.getElementById("wsStatus").innerText = "0/4";
    document.getElementById("wsStatus").style.color = "#f6465d";
}

function clearSignals() {
    signals.clear();
    render();
}

function render() {
    const box = document.getElementById("signals");

    if (signals.size === 0) {
        box.innerHTML = '<div class="empty" id="emptyState">Ожидаем подтвержденный отскок от институционального уровня...</div>';
        document.getElementById("sigCount").innerText = 0;
        document.getElementById("clusterCount").innerText = 0;
        return;
    }

    const arr = [...signals.values()].sort((a,b) => b.cluster - a.cluster).slice(0, 15);
    document.getElementById("sigCount").innerText = arr.filter(s => s.state === 'ENTRY' || s.state === 'HOLD').length;
    document.getElementById("clusterCount").innerText = signals.size;

    box.innerHTML = arr.map(s => `
        <div class="card ${s.state ? s.state.toLowerCase() : ''}">
            <div class="head">
                <div class="symbol">${s.symbol}</div>
                <div class="badge ${s.side === 'SHORT' ? 'short' : ''}">${s.side} [${s.state}]</div>
            </div>
            <div class="grid">
                <div class="box">Кластер<strong>$${money(s.cluster)}</strong></div>
                <div class="box">Цена Входа<strong>${price(s.price)}</strong></div>
                <div class="box">SL<strong>${price(s.sl)}</strong></div>
                <div class="box">TP<strong>${price(s.tp)}</strong></div>
                <div class="box">Удары в Ядро<strong>${s.hits}</strong></div>
                <div class="box">Absorption<strong>$${money(s.abs)}</strong></div>
                <div class="box">Цена Ядра<strong>${price(s.clusterPrice)}</strong></div>
                <div class="box">Тиков<strong>${s.ticks}</strong></div>
            </div>
            <div class="reason">
                <b>Статус: ${s.state}</b><br>
                ${s.reason || "Цена коснулась ядра кластера, прошла проверка на спуфинг, зафиксировано поглощение маркет-ордерами."}
            </div>
        </div>
    `).join("");
}
</script>
</body>
</html>
