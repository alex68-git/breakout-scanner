<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bybit Breakout Scanner Pro</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; padding: 15px; background: #0b0e11; color: #eaecef; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
.header { background: #1e2329; padding: 15px; border-radius: 12px; margin-bottom: 15px; }
h1 { font-size: 20px; margin: 0 0 15px 0; }
.controls { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
button, select { border: none; border-radius: 8px; padding: 10px 14px; font-weight: bold; cursor: pointer; }
button { background: #f7931a; color: #1e2329; }
button.stop { background: #e74c3c; color: white; }
button.clear { background: #555; color: white; }
select { background: #2b3139; color: white; }
.status { color: #848e9c; font-size: 13px; margin-top: 8px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
.stat { background: #161a1e; border-radius: 8px; padding: 9px; text-align: center; font-size: 11px; }
.stat-value { display: block; font-size: 15px; font-weight: bold; margin-top: 4px; }
.section-title { color: #848e9c; font-size: 14px; margin: 15px 0 8px; }
.signals { height: 70vh; min-height: 400px; overflow-y: auto; }
.signal { background: #1e2329; border-radius: 11px; padding: 13px; margin-bottom: 9px; border-left: 5px solid #555; }
.signal.long { border-left-color: #27ae60; }
.signal.short { border-left-color: #e74c3c; }
.signal-top { display: flex; justify-content: space-between; align-items: center; }
.symbol { font-size: 17px; font-weight: bold; }
.direction { font-weight: bold; font-size: 14px; }
.score { font-size: 22px; font-weight: bold; margin-top: 6px; }
.entry-box { margin-top: 10px; background: #161a1e; padding: 12px; border-radius: 9px; }
.entry-title { color: #848e9c; font-size: 11px; }
.entry-price { font-size: 22px; font-weight: bold; margin-top: 3px; }
.data-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 7px; margin-top: 10px; }
.data-box { background: #161a1e; padding: 8px; border-radius: 7px; font-size: 11px; color: #848e9c; }
.data-box strong { display: block; color: #eaecef; font-size: 13px; margin-top: 3px; }
.reason { margin-top: 9px; padding: 8px; border-radius: 7px; background: #161a1e; font-size: 12px; line-height: 1.5; }
.empty { text-align: center; color: #848e9c; padding: 60px 15px; }
.green { color: #27ae60; }
.red { color: #e74c3c; }
.gray { color: #848e9c; }
@media (max-width: 600px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .signals { height: 65vh; }
}
</style>
</head>
<body>

<div class="header">
    <h1>🚀 Bybit Breakout Scanner Pro</h1>
    <div class="controls">
        <button onclick="startScanner()">▶ Запустить</button>
        <button class="stop" onclick="stopScanner()">⏹ Стоп</button>
        <button class="clear" onclick="clearSignals()">🗑 Очистить</button>
    </div>
    <div class="controls">
        <label>Период уровня:
            <select id="levelPeriod">
                <option value="24">2 часа (24 свечи)</option>
                <option value="48" selected>4 часа (48 свечей)</option>
                <option value="72">6 часов (72 свечи)</option>
                <option value="96">8 часов (96 свечей)</option>
            </select>
        </label>
        <label>Мин. Score:
            <select id="minScore">
                <option value="60">60</option>
                <option value="70" selected>70</option>
                <option value="80">80</option>
            </select>
        </label>
    </div>
    <div class="status">Статус: <span id="status">Остановлен</span></div>
    <div class="stats">
        <div class="stat">TOP 100<span id="coinCount" class="stat-value">0</span></div>
        <div class="stat">WS<span id="wsStatus" class="stat-value">OFF</span></div>
        <div class="stat">Уровней<span id="levelCount" class="stat-value">0</span></div>
        <div class="stat">Сигналов<span id="signalCount" class="stat-value">0</span></div>
    </div>
</div>

<div class="section-title">🔥 TOP-5 вероятных пробоев</div>
<div id="signals" class="signals">
    <div class="empty">
        Запусти сканер.<br><br>
        Он загрузит историю, подключит WS и найдёт лучшие точки пробоя.
    </div>
</div>

<script>
const MAX_SYMBOLS = 100;
const MAX_SIGNALS = 5;
const KLINE_INTERVAL = "5";
const MAX_KLINES = 100;
const ANALYSIS_INTERVAL = 1500;
const UI_INTERVAL = 1000;
const SYMBOL_REFRESH = 5 * 60 * 1000;
const MAX_LEVEL_DISTANCE = 0.015;
const MIN_LEVEL_DISTANCE = 0.0005;
const TRADE_WINDOW = 30000;
const PING_INTERVAL = 20000;

let ws = null;
let running = false;
let symbolRefreshTimer = null;
let analysisTimer = null;
let uiTimer = null;
let pingTimer = null;

const symbols = [];
const symbolRanks = new Map();
const klines = new Map();
const prices = new Map();
const tradeFlows = new Map(); // Оптимизированный агрегатор потока сделок
const signals = new Map();

const statusEl = document.getElementById("status");
const wsEl = document.getElementById("wsStatus");
const coinCountEl = document.getElementById("coinCount");
const levelCountEl = document.getElementById("levelCount");
const signalCountEl = document.getElementById("signalCount");
const signalsEl = document.getElementById("signals");

function now() { return Date.now(); }

function priceFormat(value) {
    const n = Number(value);
    if (!Number.isFinite(n)) return "-";
    if (n >= 1000) return n.toFixed(2);
    if (n >= 1) return n.toFixed(4);
    return n.toFixed(6);
}

function percent(value) { return (Number(value) * 100).toFixed(2) + "%"; }
function clamp(val, min, max) { return Math.max(min, Math.min(max, val)); }

function initSymbol(symbol) {
    if (!klines.has(symbol)) klines.set(symbol, []);
    if (!tradeFlows.has(symbol)) tradeFlows.set(symbol, { buy: 0, sell: 0, count: 0, resetAt: now() + TRADE_WINDOW });
}

// Оптимизированная обработка сделок
function processTrade(data) {
    if (!Array.isArray(data)) return;
    for (const trade of data) {
        const symbol = trade.s;
        const price = Number(trade.p);
        const qty = Number(trade.v);
        if (!symbol || !prices.has(symbol)) continue;

        prices.set(symbol, price);
        let flow = tradeFlows.get(symbol);
        if (!flow) continue;

        if (now() > flow.resetAt) {
            flow.buy = 0; flow.sell = 0; flow.count = 0;
            flow.resetAt = now() + TRADE_WINDOW;
        }

        const val = price * qty;
        if (trade.S === "Buy") flow.buy += val;
        else flow.sell += val;
        flow.count++;
    }
}

function getTradeFlow(symbol) {
    const flow = tradeFlows.get(symbol) || { buy: 0, sell: 0, count: 0 };
    const total = flow.buy + flow.sell;
    const imbalance = total > 0 ? (flow.buy - flow.sell) / total : 0;
    return { ...flow, total, imbalance };
}

function processKline(symbol, data) {
    if (!Array.isArray(data)) return;
    initSymbol(symbol);
    const list = klines.get(symbol);

    for (const candle of data) {
        const item = {
            start: Number(candle.start),
            high: Number(candle.high),
            low: Number(candle.low),
            close: Number(candle.close),
            turnover: Number(candle.turnover)
        };
        prices.set(symbol, item.close);

        const idx = list.findIndex(x => x.start === item.start);
        if (idx >= 0) list[idx] = item;
        else list.push(item);
    }

    list.sort((a, b) => a.start - b.start);
    while (list.length > MAX_KLINES) list.shift();
}

// Загрузка исторической K-line через REST API
async function fetchKlineHistory(symbol) {
    try {
        const res = await fetch(`https://api.bybit.com/v5/market/kline?category=linear&symbol=${symbol}&interval=${KLINE_INTERVAL}&limit=${MAX_KLINES}`);
        const json = await res.json();
        if (json.retCode === 0 && json.result?.list) {
            const formatted = json.result.list.map(c => ({
                start: Number(c[0]),
                open: Number(c[1]),
                high: Number(c[2]),
                low: Number(c[3]),
                close: Number(c[4]),
                turnover: Number(c[6])
            })).reverse();
            klines.set(symbol, formatted);
            if (formatted.length > 0) prices.set(symbol, formatted[formatted.length - 1].close);
        }
    } catch (e) {
        console.error(`Ошибка загрузки истории ${symbol}:`, e);
    }
}

function getATR(candles, period = 14) {
    if (candles.length < period + 1) return 0;
    const recent = candles.slice(-(period + 1));
    let sum = 0;
    for (let i = 1; i < recent.length; i++) {
        const tr = Math.max(
            recent[i].high - recent[i].low,
            Math.abs(recent[i].high - recent[i - 1].close),
            Math.abs(recent[i].low - recent[i - 1].close)
        );
        sum += tr;
    }
    return sum / period;
}

function findCandidateLevels(symbol) {
    const candles = klines.get(symbol) || [];
    const period = parseInt(document.getElementById("levelPeriod").value);
    const data = candles.slice(-period);
    if (data.length < 10) return [];

    const currentPrice = prices.get(symbol) || data[data.length - 1].close;
    if (!currentPrice) return [];

    const candidates = [];
    for (let i = 2; i < data.length - 2; i++) {
        const c = data[i];
        if (c.high >= data[i-1].high && c.high >= data[i-2].high && c.high >= data[i+1].high && c.high >= data[i+2].high) {
            candidates.push({ type: "RESISTANCE", price: c.high, index: i });
        }
        if (c.low <= data[i-1].low && c.low <= data[i-2].low && c.low <= data[i+1].low && c.low <= data[i+2].low) {
            candidates.push({ type: "SUPPORT", price: c.low, index: i });
        }
    }

    return candidates.filter(level => {
        const dist = Math.abs(level.price - currentPrice) / currentPrice;
        return dist >= MIN_LEVEL_DISTANCE && dist <= MAX_LEVEL_DISTANCE;
    });
}

function mergeLevels(candidates, atr) {
    const result = [];
    const tolerance = Math.max(atr * 0.35, 0.0008);
    const sorted = [...candidates].sort((a, b) => a.price - b.price);

    for (const cand of sorted) {
        let existing = result.find(r => r.type === cand.type && Math.abs(r.price - cand.price) <= tolerance);
        if (existing) {
            existing.price = (existing.price * existing.touches + cand.price) / (existing.touches + 1);
            existing.touches++;
            existing.lastIndex = Math.max(existing.lastIndex, cand.index);
        } else {
            result.push({ type: cand.type, price: cand.price, touches: 1, lastIndex: cand.index });
        }
    }
    return result;
}

function scoreLevel(symbol, level) {
    const candles = klines.get(symbol) || [];
    if (candles.length < 20) return null;

    const currentPrice = prices.get(symbol) || candles[candles.length - 1].close;
    const atr = getATR(candles.slice(-30));
    if (!currentPrice || !atr) return null;

    const distance = Math.abs(level.price - currentPrice) / currentPrice;
    if (distance > MAX_LEVEL_DISTANCE) return null;

    let touches = 0;
    const tolerance = Math.max(atr * 0.30, currentPrice * 0.0008);
    for (const c of candles) {
        if (Math.abs(c.high - level.price) <= tolerance || Math.abs(c.low - level.price) <= tolerance) {
            touches++;
        }
    }
    if (touches < 2) return null;

    const recent = candles.slice(-6);
    const momentum = (recent[recent.length - 1].close - recent[0].close) / recent[0].close;
    const direction = level.type === "RESISTANCE" ? "LONG" : "SHORT";

    const flow = getTradeFlow(symbol);
    let flowScore = 0;
    if (flow.count >= 5) {
        flowScore = direction === "LONG" ? clamp(flow.imbalance * 40, -20, 25) : clamp(-flow.imbalance * 40, -20, 25);
    }

    const distanceScore = clamp((1 - distance / MAX_LEVEL_DISTANCE) * 20, 0, 20);
    const touchScore = clamp(touches * 6, 0, 24);
    const freshnessScore = clamp(15 - (candles.length - 1 - level.lastIndex) * 1.5, 0, 15);

    const avgTurnover = candles.slice(-20).reduce((s, c) => s + c.turnover, 0) / 20;
    const recentTurnover = candles.slice(-3).reduce((s, c) => s + c.turnover, 0) / 3;
    const volumeRatio = avgTurnover > 0 ? recentTurnover / avgTurnover : 0;
    const volumeScore = clamp((volumeRatio - 0.8) * 15, -10, 15);

    let score = 20 + distanceScore + touchScore + freshnessScore + flowScore + volumeScore;
    if ((direction === "LONG" && momentum < -0.004) || (direction === "SHORT" && momentum > 0.004)) score -= 15;

    const alreadyBroken = direction === "LONG" ? currentPrice > level.price * 1.0015 : currentPrice < level.price * 0.9985;
    if (alreadyBroken) return null;

    score = clamp(Math.round(score), 0, 100);
    const minScoreThreshold = parseInt(document.getElementById("minScore").value);
    if (score < minScoreThreshold) return null;

    const entry = direction === "LONG" ? level.price + Math.max(atr * 0.08, level.price * 0.0004) : level.price - Math.max(atr * 0.08, level.price * 0.0004);

    return {
        symbol, rank: symbolRanks.get(symbol), direction, level: level.price,
        entry, score, touches, distance, momentum, flow, volumeRatio
    };
}

function analyzeAll() {
    if (!running) return;
    const all = [];
    let totalLevels = 0;

    for (const symbol of symbols) {
        const candles = klines.get(symbol) || [];
        const atr = getATR(candles.slice(-30));
        if (!atr) continue;

        const candidates = findCandidateLevels(symbol);
        const merged = mergeLevels(candidates, atr);
        totalLevels += merged.length;

        for (const lvl of merged) {
            const scored = scoreLevel(symbol, lvl);
            if (scored) all.push(scored);
        }
    }

    all.sort((a, b) => b.score - a.score);
    const selected = [];
    for (const sig of all) {
        if (!selected.some(x => x.symbol === sig.symbol && x.direction === sig.direction)) {
            selected.push(sig);
            if (selected.length >= MAX_SIGNALS) break;
        }
    }

    signals.clear();
    for (const sig of selected) signals.set(`${sig.symbol}_${sig.direction}`, sig);
    levelCountEl.innerText = totalLevels;
}

function renderSignals() {
    const list = [...signals.values()].sort((a, b) => b.score - a.score);
    signalCountEl.innerText = list.length;

    if (list.length === 0) {
        signalsEl.innerHTML = `<div class="empty">🔎 Ищем уровни с подходящим Score...</div>`;
        return;
    }

    let html = "";
    list.forEach((s, i) => {
        const isLong = s.direction === "LONG";
        html += `
            <div class="signal ${isLong ? 'long' : 'short'}">
                <div class="signal-top">
                    <div class="symbol">${isLong ? '🟢' : '🔴'} #${i + 1} ${s.symbol} <span class="gray">TOP ${s.rank}</span></div>
                    <div class="direction">${s.direction}</div>
                </div>
                <div class="score">Score: ${s.score}/100</div>
                <div class="entry-box">
                    <div class="entry-title">ЦЕНА ВХОДА ПОСЛЕ ПРОБОЯ</div>
                    <div class="entry-price">${priceFormat(s.entry)}</div>
                </div>
                <div class="data-grid">
                    <div class="data-box">Уровень<strong>${priceFormat(s.level)}</strong></div>
                    <div class="data-box">Тип<strong>${isLong ? 'СОПРОТИВЛЕНИЕ' : 'ПОДДЕРЖКА'}</strong></div>
                    <div class="data-box">До уровня<strong>${percent(s.distance)}</strong></div>
                    <div class="data-box">Касаний<strong>${s.touches}</strong></div>
                    <div class="data-box">Объём<strong>${s.volumeRatio.toFixed(1)}x</strong></div>
                    <div class="data-box">Дисбаланс<strong>${percent(s.flow.imbalance)}</strong></div>
                </div>
            </div>`;
    });
    signalsEl.innerHTML = html;
}

function subscribeAll() {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    const args = [];
    for (const symbol of symbols) {
        args.push(`kline.${KLINE_INTERVAL}.${symbol}`);
        args.push(`publicTrade.${symbol}`);
    }

    const CHUNK = 40;
    for (let i = 0; i < args.length; i += CHUNK) {
        const chunk = args.slice(i, i + CHUNK);
        setTimeout(() => {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ op: "subscribe", args: chunk }));
            }
        }, Math.floor(i / CHUNK) * 100);
    }
}

function startHeartbeat() {
    stopHeartbeat();
    pingTimer = setInterval(() => {
        if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ op: "ping" }));
    }, PING_INTERVAL);
}

function stopHeartbeat() {
    if (pingTimer) clearInterval(pingTimer);
    pingTimer = null;
}

function connectWebSocket() {
    if (!running) return;
    if (ws) { try { ws.onclose = null; ws.close(); } catch(e){} }

    statusEl.innerText = "Подключение WS...";
    statusEl.style.color = "#f7931a";

    ws = new WebSocket("wss://stream.bybit.com/v5/public/linear");
    ws.onopen = () => {
        wsEl.innerText = "ON"; wsEl.className = "stat-value green";
        statusEl.innerText = "Сканирование активно"; statusEl.style.color = "#27ae60";
        startHeartbeat();
        subscribeAll();
    };

    ws.onmessage = (e) => {
        try {
            const data = JSON.parse(e.data);
            if (!data.topic) return;
            if (data.topic.startsWith("kline.")) {
                const symbol = data.topic.split(".")[2];
                processKline(symbol, data.data);
            } else if (data.topic.startsWith("publicTrade.")) {
                processTrade(data.data);
            }
        } catch (err) {}
    };

    ws.onclose = () => {
        stopHeartbeat();
        wsEl.innerText = "OFF"; wsEl.className = "stat-value red";
        if (running) setTimeout(connectWebSocket, 3000);
    };
}

async function loadSymbols() {
    try {
        statusEl.innerText = "Загрузка TOP-100...";
        const res = await fetch("https://api.bybit.com/v5/market/tickers?category=linear");
        const json = await res.json();
        
        const list = json.result.list
            .filter(i => i.symbol && i.symbol.endsWith("USDT") && Number(i.turnover24h) > 0)
            .sort((a, b) => Number(b.turnover24h) - Number(a.turnover24h))
            .slice(0, MAX_SYMBOLS);

        symbols.length = 0;
        symbolRanks.clear();

        statusEl.innerText = "Загрузка истории свечей...";
        for (let i = 0; i < list.length; i++) {
            const sym = list[i].symbol;
            symbols.push(sym);
            symbolRanks.set(sym, i + 1);
            initSymbol(sym);
            await fetchKlineHistory(sym); // Ограничено частотой REST
        }

        coinCountEl.innerText = symbols.length;
        return true;
    } catch (e) {
        statusEl.innerText = "Ошибка загрузки данных";
        return false;
    }
}

async function startScanner() {
    if (running) return;
    running = true;

    const ok = await loadSymbols();
    if (!ok) { running = false; return; }

    connectWebSocket();
    analysisTimer = setInterval(analyzeAll, ANALYSIS_INTERVAL);
    uiTimer = setInterval(renderSignals, UI_INTERVAL);
    symbolRefreshTimer = setInterval(loadSymbols, SYMBOL_REFRESH);
}

function stopScanner() {
    running = false;
    clearInterval(analysisTimer);
    clearInterval(uiTimer);
    clearInterval(symbolRefreshTimer);
    stopHeartbeat();
    if (ws) ws.close();
    wsEl.innerText = "OFF";
    statusEl.innerText = "Остановлен";
    statusEl.style.color = "#848e9c";
}

function clearSignals() {
    signals.clear();
    renderSignals();
}
</script>
</body>
</html>
